name: Release Adapter Preview Discovery

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: release-adapter-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-adapter-preview:
    name: release-adapter-preview
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request code read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report preview adapter contract
        run: |
          printf '%s\n' 'release-adapter-preview: no-op-safe, no secrets, no protected-ref authority'
