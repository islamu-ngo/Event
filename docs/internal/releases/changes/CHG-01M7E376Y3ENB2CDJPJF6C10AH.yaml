Change-Id: CHG-01M7E376Y3ENB2CDJPJF6C10AH
Title: "Preserve HTTP rejection for OAuth publication"
Type: fix
Scope: access
Summary: "OAuth client metadata and signing-key publication reject insecure requests without redirecting them or replacing their response with an HTML error page."
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/AUTHENTICATION.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      OAuth publication handlers reject insecure requests themselves.
      Generic HTTPS redirects and HTML error-page re-execution no longer
      replace their rejection. Other authentication and listener guards remain.
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: >-
      Configure HTTPS publication URLs. HTTP requests to the metadata and JWKS
      endpoints return 404 without a redirect; this is the intended rejection.
