# Notifications are personal data: all authenticated users can manage their own notifications.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_notification"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_notification.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all notifications within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # All authenticated users can manage their own notifications
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
