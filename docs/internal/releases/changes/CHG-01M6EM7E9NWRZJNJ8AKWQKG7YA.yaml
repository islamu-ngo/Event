Change-Id: CHG-01M6EM7E9NWRZJNJ8AKWQKG7YA
Title: "Check recognition erasure subjects without reading private profiles"
Type: fix
Scope: privacy
Summary: "Use the existing filtered subject-existence query after acquiring the original user fences, avoiding unnecessary User and private-profile materialization."
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/PRIVACY_ERASURE.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/PRIVACY_ERASURE.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Preserve the subject predicate, query filters, original identity transaction
      and ordered user fences. A missing subject still fails closed. Do not grant
      the erasure purpose access to private profile tables merely to prove that
      its fenced subject exists.
  Migration:
    Reference: docs/internal/BACKUP_RESTORE_UPGRADE.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/internal/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/privacy-erasure.md
    Disposition: documented
    Detail: >-
      Recognition erasure uses its existing narrow subject access. No additional
      private-table permission or deployment setting is required.
