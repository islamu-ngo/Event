# ABOUTME: Gitleaks configuration extending default rules with repository-specific allowlists.
# ABOUTME: Excludes mock secrets and token placeholders in documentation, design notes, and agent skills.

[extend]
useDefault = true

[allowlist]
description = "Repository documentation, mock tokens, and planning notes"
paths = [
    '''(?i)^\.agents/skills/.*/resources/''',
    '''(?i)^dev/(active|completed|next|_journal)/''',
    '''(?i)^docs/''',
    '''(?i)^islamic-value-sensitive-design/''',
    '''\.env\.example''',
    '''(?i)tests/.*/TestData/'''
]
