      - "Environment and Infisical are explicit deployment-owned authority modes; UserSecrets is an explicit Development/Testing-only local authority; the selected authority never falls back to a lower source and application databases never hold secret values or reversible ciphertext"
      - "Required consumers fail closed while optional consumers isolate an explicit unconfigured or degraded capability; provider failures never collapse into a successful absence"
      - "Tenant, instance, source, reference, cache, and rotation state remain server-authoritative and tenant-qualified under hostile concurrency and multi-replica execution"
      - "Logs, stderr, traces, metrics, health, ProblemDetails, support artifacts, APIs, manifests, generated clients, BFF responses, and UI contain no secret values, ciphertext, credentials, tokens, provider payloads, exception text, or sensitive coordinates"
      - "Every rotation mode is classified as overlap-rollout, coordinated-restart, or unsupported-live; deployment evidence, not one process, owns convergence and old-credential revocation"
      - "Operator documentation ships with each authority-changing behavior and provides truthful value-free diagnosis, rerun, rollback, backup, restore, and break-glass recovery"
      - "Conditional API, HAL, OpenAPI, Blazor, infrastructure-bootstrap, migration, and CI obligations are inherited from the related intents actually triggered by the final changed-file set"
    pr_checklist:
      - "Failing invariant-breaker tests precede implementation and cover authority fallback, cross-tenant cache isolation, zero-secret output canaries, provider failure, rotation partial activation, stale replicas, or topology divergence as applicable"
      - "The final changed-file set is reclassified against this primary intent and every applicable related intent; all combined minimum tests, docs, acceptance criteria, and forbidden actions are satisfied"
      - "Generated EF migrations, designers, and model snapshots come only from repository tooling and all supported providers have clean, idempotent, tenant-safe evidence"
      - "Any local-development reset has separate explicit approval plus immediate proof of environment, provider, database, container, and volume identity for the exact target"
      - "No secret, credential, token, provider response, exception message, connection string, or sensitive coordinate appears in source defaults, tests, logs, diagnostics, generated artifacts, or review evidence"
      - "An anonymized Epistemic MAD review challenges authority fallback, tenancy, confidentiality, migration safety, rollback, multi-replica convergence, and operator recovery before merge"
      - "Obsolete aliases, dual reads, dual writes, routes, fields, fallback sources, and adapters are removed rather than preserved through backward-compatibility shims"
    forbidden_without_approval:
      - "Persisting secret values, reversible ciphertext, provider admin credentials, service-account credentials, or deployment-managed values in an application database or runtime artifact"
      - "Falling back from the selected authority to environment, appsettings, User Secrets, configuration, database values, or another provider after absence, unauthorized, invalid, or unavailable outcomes"
      - "Logging or returning secret values, ciphertext, credentials, tokens, connection strings, provider payloads, exception text, source coordinates, project identifiers, client identifiers, paths, or keys"
      - "Trusting request headers, request bodies, browser claims, or caller-supplied tenant, scope, provider, binding, capability, or rotation state as authority"
      - "Hand-editing generated migrations, designers, model snapshots, OpenAPI artifacts, contract inventories, or generated clients"
      - "Resetting any database, container, volume, key ring, provider state, Infisical state, deployment secret store, production, shared, staging, CI evidence, unnamed, ambiguous, or unproven target"
      - "Adding compatibility aliases, dual reads, dual writes, deprecated routes or fields, data migration shims, fallback adapters, or fictitiously reversible destructive Down paths"
      - "Adding file secret sources, Vault or cloud-provider scaffolding, Redis or HybridCache L2, generic read-audit storage, universal rotation state machines, duplicate secret CRUD UI, Kubernetes or Helm support, or fixed resilience recipes without a measured requirement and separate approval"
      - "Claiming multi-replica convergence, successful rotation, safe revocation, migration safety, or recovery from documentary inspection or one-process success instead of executable evidence"
