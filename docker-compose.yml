# ABOUTME: Docker Compose topology for the ISLAMU Event platform.
# ABOUTME: Uses explicit env mappings, health-gated dependencies, and profiles for optional infrastructure.

name: islamu-event-platform

x-keycloak-env: &keycloak-env
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ISLAMU}
  KEYCLOAK_ENDPOINT: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}
  KEYCLOAK_BLAZOR_CLIENT_ID: ${KEYCLOAK_BLAZOR_CLIENT_ID:-islamu-event-blazor}
  KEYCLOAK_BLAZOR_CLIENT_SECRET: ${KEYCLOAK_BLAZOR_CLIENT_SECRET:-}
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  Keycloak__RequireHttpsMetadata: ${KEYCLOAK_REQUIRE_HTTPS_METADATA:-false}

x-authentication-selection-env: &authentication-selection-env
  Authentication__Provider: ${AUTHENTICATION_PROVIDER:-}
  Authentication__AtprotoLoginEnabled: ${ATPROTO_LOGIN_ENABLED:-false}

x-local-identity-runtime-env: &local-identity-runtime-env
  Authentication__Local__JwtKey: ${AUTHENTICATION_LOCAL_JWT_KEY:-}
  Authentication__Local__LockoutThreshold: ${AUTHENTICATION_LOCAL_LOCKOUT_THRESHOLD:-5}
  Authentication__Local__LockoutDurationMinutes: ${AUTHENTICATION_LOCAL_LOCKOUT_DURATION_MINUTES:-15}
  IdentityDatabase__Topology: ${IDENTITY_DATABASE_TOPOLOGY:-colocated}
  IdentityDatabase__Provider: ${IDENTITY_DATABASE_PROVIDER:-}
  IdentityDatabase__ConnectionString: ${IDENTITY_DATABASE_CONNECTION_STRING:-}
  IdentityDatabase__Host: ${IDENTITY_DATABASE_HOST:-}
  IdentityDatabase__Port: ${IDENTITY_DATABASE_PORT:-}
  IdentityDatabase__Name: ${IDENTITY_DATABASE_NAME:-}
  IdentityDatabase__Schema: ${IDENTITY_DATABASE_SCHEMA:-}
  IdentityDatabase__TlsMode: ${IDENTITY_DATABASE_TLS_MODE:-}
  IdentityDatabase__TrustServerCertificate: ${IDENTITY_DATABASE_TRUST_SERVER_CERTIFICATE:-false}
  IdentityDatabase__Runtime__Username: ${IDENTITY_DATABASE_RUNTIME_USERNAME:-}
  IdentityDatabase__Runtime__Password: ${IDENTITY_DATABASE_RUNTIME_PASSWORD:-}

x-local-identity-migrator-env: &local-identity-migrator-env
  IdentityDatabase__Topology: ${IDENTITY_DATABASE_TOPOLOGY:-colocated}
  IdentityDatabase__Provider: ${IDENTITY_DATABASE_PROVIDER:-}
  IdentityDatabase__ConnectionString: ${IDENTITY_DATABASE_CONNECTION_STRING:-}
  IdentityDatabase__Host: ${IDENTITY_DATABASE_HOST:-}
  IdentityDatabase__Port: ${IDENTITY_DATABASE_PORT:-}
  IdentityDatabase__Name: ${IDENTITY_DATABASE_NAME:-}
  IdentityDatabase__Schema: ${IDENTITY_DATABASE_SCHEMA:-}
  IdentityDatabase__TlsMode: ${IDENTITY_DATABASE_TLS_MODE:-}
  IdentityDatabase__TrustServerCertificate: ${IDENTITY_DATABASE_TRUST_SERVER_CERTIFICATE:-false}
  IdentityDatabase__Migrator__Username: ${IDENTITY_DATABASE_MIGRATOR_USERNAME:-}
  IdentityDatabase__Migrator__Password: ${IDENTITY_DATABASE_MIGRATOR_PASSWORD:-}

# One explicit deployment-owned secret authority. Environment never contacts Infisical;
# Infisical never falls back to the lower environment values below.
x-secrets-env: &secrets-env
  SecretProvider__Provider: ${SECRET_PROVIDER:?Set SECRET_PROVIDER to Environment or Infisical}
  SecretProvider__Infisical__Url: ${INFISICAL_URL:-}
  SecretProvider__Infisical__ProjectId: ${INFISICAL_PROJECT_ID:-}
  SecretProvider__Infisical__ClientId: ${INFISICAL_CLIENT_ID:-}
  SecretProvider__Infisical__ClientSecret: ${INFISICAL_CLIENT_SECRET:-}
  SecretProvider__Infisical__Environment: ${INFISICAL_ENV:-}

x-postgres-env: &postgres-env
  POSTGRES_USER: ${DATABASE_MIGRATOR_USERNAME-explore}
  POSTGRES_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:-}
  POSTGRES_DB: ${DATABASE_NAME:-islamu_event_db}

x-formbricks-env: &formbricks-env
  WEBAPP_URL: ${FORMBRICKS_WEBAPP_URL:-http://localhost:3005}
  NEXTAUTH_URL: ${FORMBRICKS_WEBAPP_URL:-http://localhost:3005}
  DATABASE_URL: postgresql://${FORMBRICKS_DATABASE_USER:-postgres}:${FORMBRICKS_DATABASE_PASSWORD:-}@formbricks-postgres:5432/${FORMBRICKS_DATABASE_NAME:-formbricks}?schema=public
  NEXTAUTH_SECRET: ${FORMBRICKS_NEXTAUTH_SECRET:-}
  ENCRYPTION_KEY: ${FORMBRICKS_ENCRYPTION_KEY:-}
  CRON_SECRET: ${FORMBRICKS_CRON_SECRET:-}
  REDIS_URL: redis://formbricks-redis:6379
  HUB_API_KEY: ${FORMBRICKS_HUB_API_KEY:-}
  HUB_API_URL: http://formbricks-hub:8080
  CUBEJS_API_URL: http://formbricks-cube:4000
  CUBEJS_API_SECRET: ${FORMBRICKS_CUBEJS_API_SECRET:-}
  CUBEJS_JWT_ISSUER: formbricks-web
  CUBEJS_JWT_AUDIENCE: formbricks-cube
  EMAIL_VERIFICATION_DISABLED: "1"
  PASSWORD_RESET_DISABLED: "1"
  TELEMETRY_DISABLED: "1"

