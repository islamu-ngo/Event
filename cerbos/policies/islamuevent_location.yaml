# Locations are tenant-scoped: only authorized administrators can view or manage them.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_location"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_location.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage locations within their tenant
    - actions: ["view", "create", "update", "delete", "manage_custom_addresses", "approve_tenant_address"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
