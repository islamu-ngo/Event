# ABOUTME: Public change fragment for immutable paid-checkout acceptance and operator governance.
# ABOUTME: Records breaking contract, migration, configuration, security, and operator impacts.
Change-Id: CHG-01M1VJ137PV3M9X822CQV71QNQ
Title: Paid checkout requires current operator-backed acceptance
Type: feat
Scope: registration
Summary: >-
  Buyers see and explicitly accept exact merchant, operator, delivery, money,
  refund, support, provider, and statement facts before a paid checkout starts.
  New sales fail closed when those facts become stale or operator governance
  stops sales, while signed payment intake and recovery remain available.
Group: paid-checkout-safety
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Payment-start requests require a current PaidOrderAcceptanceAcknowledgementDto.
      New private no-store payment-acceptance operations and the
      payment-acceptance HAL relation expose the server-authored facts that clients
      must render and acknowledge before using start-payment.
  Security:
    Reference: docs/SECURITY-MODEL.md
    Disposition: documented
    Detail: >-
      Acceptance, provider, tenant, operator, policy, and money facts are persisted
      as tenant-qualified immutable evidence and rebuilt before provider handoff.
      Instance identity is server-owned, authenticated commands use exact resource
      authorization, and global or event stop-sale removes sale affordances and
      blocks direct calls without disabling signed intake or reconciliation.
  Migration:
    Reference: docs/BACKUP_RESTORE_UPGRADE.md
    Disposition: documented
    Detail: >-
      Generated migrations for PostgreSQL, SQLite, SQL Server, MariaDB, and MySQL
      add paid-order acceptance, governance control, review, and audit persistence
      plus payment authority constraints. Historical attempts are not backfilled
      with acceptance they never recorded.
  Configuration:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      Payments:CheckoutGovernance supplies deployment-owned operator, origin,
      complaint, refund, statement, charge-profile, and activation facts. Checkout
      remains suspended until the profile is complete and explicitly approved.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Adds paid acceptance and checkout-governance operations, required acceptance
      acknowledgement members, immutable disclosure schemas, and related HAL
      relations. Generated API inventory and NSwag clients must be regenerated.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Operators must configure an independent instance identity, approve initial
      activation, preserve reviewer separation, monitor bounded reconciliation,
      and use global or event stop-sale for new-sale incidents without disabling
      webhook intake, support, or recovery.
