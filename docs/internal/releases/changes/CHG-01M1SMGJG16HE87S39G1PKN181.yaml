Title: reject account-required events without visitor onboarding
Type: feat
Scope: registration
Summary: Resolve public onboarding across usable providers and enforce the same capability in event configuration, publication, provider changes, and server-authored affordances.
Group: email-optional-self-hosting
Supersedes: []
Impacts:
