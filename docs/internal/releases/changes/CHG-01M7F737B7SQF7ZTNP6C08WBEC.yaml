Change-Id: CHG-01M7F737B7SQF7ZTNP6C08WBEC
Title: "Reject reused completed enrollment operations"
Type: fix
Scope: registration
Summary: "Prevent a completed Local enrollment operation from allocating a replacement account when its primary receipt is absent but the credential ledger remains."
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/AUTHORIZATION.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      A retained native credential operation prevents fresh allocation under
      the same enrollment operation ID when its primary receipt is absent.
      The check runs inside the original reservation custody and transactions.
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: >-
      Continue with the original account sign-in or supported recovery path.
      Reusing a completed enrollment operation ID cannot create a replacement.
