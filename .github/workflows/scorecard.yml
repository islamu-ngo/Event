name: OpenSSF Scorecard

permissions:
  contents: read
  security-events: write
  actions: read
  checks: read
  issues: read
  pull-requests: read

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
          file_mode: archive

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: scorecard-results.sarif

      - name: Stage Scorecard evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scorecard-evidence
          cp scorecard-results.sarif scorecard-evidence/scorecard-results.sarif
          {
            echo "## OpenSSF Scorecard"
            echo
            echo "Scorecard SARIF was generated and uploaded to code scanning."
            echo "Retained artifact: \`scorecard-evidence\`."
            echo "Public Scorecard result publishing is disabled for this repository-owned evidence lane."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Scorecard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-evidence
          path: scorecard-evidence/
          retention-days: 30
