Change-Id: CHG-01M4EXEQTSB4CBRF3AW5ZGTWRG
Title: "Keep audience metadata private until final delivery"
Type: fix
Scope: access
Summary: "Prevent audience detail and collection metadata from surviving revocation after response preparation. Native queries return private single-use projections; fresh authority gates final HTTP or native delivery after representation assembly. Native consumers must use Projection.DiscloseAsync instead of Value. HTTP response shapes remain unchanged and incomplete moderation profiles remain inactive."
