  - id: add-ef-migration
    title: "Generate an Entity Framework Core migration from model changes"
    category: persistence
    triggers:
      - "add an EF migration"
      - "schema change"
    must_read_docs:
      - docs/internal/QUICK_REFERENCE.md
      - docs/internal/DOMAIN.md
    load_skills:
      - dotnet-efcore-guidelines
    load_rules:
      - .agents/rules/efcore-migrations.md
    paths_in_scope:
      - "src/Explore.Persistence/Migrations/**/*.cs"
      - "src/Explore.Domain/**/*.cs"
    minimum_tests:
      - Event.Persistence.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - schemas/islamu-event.md
    unique_acceptance:
      - "Migration and model snapshot are produced by dotnet ef; no generated file is hand-edited"
      - "Incorrect generated output is fixed in entities, configurations, DbContext setup, lookup seeding, or the migration-generation extension before regeneration"
      - "Migration is idempotent and reversible"
      - "Stable enum IDs and codes stay synchronized with idempotent LookupTableSeeder repair and migration-local InsertData before dependent backfills"
    forbidden_without_approval:
      - "Manual edits to generated migration or model-snapshot files"
      - "Destructive Down() that silently loses data"
    related_agents:
      - backend-engineer-agent
      - platform-operations-agent
      - quality-verifier-agent
      - change-reviewer-agent
    criticality:
      tier: security
      required_model_tier: advanced
      verification_depth: exhaustive
      tenancy_scope: system_level
      rollback_strategy: expand_contract
      intake_clarification_mode: mandatory_grill_me
      exploration_protocol: exhaustive_graph_blast_radius
      testing_strategy: adversarial_concurrency_invariant_breakers
      review_protocol: anonymized_epistemic_mad
      safety_gates:
        - "never_hand_edit_migrations"
        - "expand_contract_zero_downtime"
        - "multi_provider_db_compatibility"
      mandatory_reviewers:
        - backend-engineer-agent
        - quality-verifier-agent

