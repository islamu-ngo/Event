apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_webhook"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_webhook.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    - actions:
        - "webhook:view"
        - "webhook:create"
        - "webhook:update"
        - "webhook:delete"
        - "webhook:rotate-secret"
        - "webhook:test"
        - "webhook:retry"
        - "webhook:redrive-incoming"
        - "webhook:pause"
        - "webhook:resume"
        - "webhook:reconcile-publication"
        - "webhook:abandon-publication"
        - "webhook:view-delivery"
        - "webhook:view-payload"
        - "webhook:bulk-replay"
        - "webhook:manage-provider"
        - "webhook:open-provider-portal"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
      condition:
        match:
          expr: >
            (!has(request.resource.attr.ownerKindId) ||
             request.resource.attr.ownerKindId == 1) &&
            ((!has(request.principal.attr.is_machine) ||
              request.principal.attr.is_machine != true) ||
             (has(request.principal.attr.scopes) &&
              request.principal.attr.scopes.exists(scope, scope == "admin:tenant")))

    - actions:
        - "webhook:process-incoming"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
      condition:
        match:
          expr: >
            has(request.principal.attr.is_machine) &&
            request.principal.attr.is_machine == true &&
            has(request.principal.attr.scopes) &&
            request.principal.attr.scopes.exists(scope, scope == "internal:webhook:process-incoming")

    - actions:
        - "webhook:view"
        - "webhook:create"
        - "webhook:update"
        - "webhook:delete"
        - "webhook:rotate-secret"
        - "webhook:test"
        - "webhook:retry"
        - "webhook:pause"
        - "webhook:resume"
        - "webhook:view-delivery"
        - "webhook:open-provider-portal"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin
      condition:
        match:
          expr: >
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true) &&
            has(request.resource.attr.ownerKindId) &&
            request.resource.attr.ownerKindId == 2

    - actions:
        - "webhook:view"
        - "webhook:create"
        - "webhook:update"
        - "webhook:delete"
        - "webhook:rotate-secret"
        - "webhook:test"
        - "webhook:retry"
        - "webhook:pause"
        - "webhook:resume"
        - "webhook:view-delivery"
        - "webhook:open-provider-portal"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_group_admin
      condition:
        match:
          expr: >
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true) &&
            has(request.resource.attr.ownerKindId) &&
            request.resource.attr.ownerKindId == 3

    - actions:
        - "webhook:view"
        - "webhook:create"
        - "webhook:update"
        - "webhook:delete"
        - "webhook:rotate-secret"
        - "webhook:test"
        - "webhook:retry"
        - "webhook:pause"
        - "webhook:resume"
        - "webhook:view-delivery"
        - "webhook:open-provider-portal"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_actor_user_owner
      condition:
        match:
          expr: >
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true) &&
            has(request.resource.attr.ownerKindId) &&
            request.resource.attr.ownerKindId == 4
