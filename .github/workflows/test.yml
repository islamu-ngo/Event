# ABOUTME: CI workflow running build and all test suites on push/PR to main and develop.
# ABOUTME: Always reports a status check, running tests only when build/test-relevant files change.

name: "Build & Test"

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-build-test-changes:
    name: Detect Build/Test-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
      run-app-tests: ${{ steps.changes.outputs.run-app-tests }}
      run-domain-tests: ${{ steps.changes.outputs.run-domain-tests }}
      run-architecture-tests: ${{ steps.changes.outputs.run-architecture-tests }}
      run-setup-tests: ${{ steps.changes.outputs.run-setup-tests }}
      run-infrastructure-tests: ${{ steps.changes.outputs.run-infrastructure-tests }}
      run-blazor-tests: ${{ steps.changes.outputs.run-blazor-tests }}
      run-secrets-tests: ${{ steps.changes.outputs.run-secrets-tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Build/Test-Relevant Changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          is_build_test_ignored() {
            case "$1" in
              .env.example|docker-compose.yml|docs/CONFIGURATION.md|eng/setup-assistant/generated/environment-catalogue.json) return 1 ;;
              schemas/configuration-manifest-v1alpha2.schema.json|schemas/tenant-configuration-package-v1alpha2.schema.json) return 1 ;;
              .agents/*|.claude/*|.codex/*|.copilot/*|.gemini/*|.opencode/*|.repomix/*|.sisyphus/*|.taskmaster/*) return 0 ;;
              _bmad/*|_bmad-output/*) return 0 ;;
              docs/*|schemas/*|assets/*|dev/*|event/*) return 0 ;;
              cerbos/*|docker/*|src/Explore.AppHost/*|tests/Event.Benchmarks/*|amp/*) return 0 ;;
              *.md|LICENSE|.editorconfig|.dockerignore|.mcp.json|repomix.config.json|opencode.json|jean.json) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_global_dependency() {
            case "$1" in
              Directory.Build.props|Directory.Packages.props|NuGet.Config|global.json|.ci/*|Explore.slnx|packages.lock.json|.github/workflows/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          base_sha=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base_sha="${{ github.event.merge_group.base_sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          fi

          if [ -z "$base_sha" ]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"

          if [ -z "$changed_files" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            echo "run-app-tests=true" >> "$GITHUB_OUTPUT"
            echo "run-domain-tests=true" >> "$GITHUB_OUTPUT"
            echo "run-architecture-tests=true" >> "$GITHUB_OUTPUT"
            echo "run-setup-tests=true" >> "$GITHUB_OUTPUT"
            echo "run-infrastructure-tests=true" >> "$GITHUB_OUTPUT"
            echo "run-blazor-tests=true" >> "$GITHUB_OUTPUT"
            echo "run-secrets-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Build & Test Change Detection"
              echo
              echo "Could not determine changed files; running all subsystem test suites."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant_files=""
          while IFS= read -r changed_file; do
            [ -z "$changed_file" ] && continue

            if ! is_build_test_ignored "$changed_file"; then
              relevant_files="${relevant_files}${changed_file}"$'\n'
            fi
          done <<< "$changed_files"

          if [ -z "$relevant_files" ]; then
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            echo "run-app-tests=false" >> "$GITHUB_OUTPUT"
            echo "run-domain-tests=false" >> "$GITHUB_OUTPUT"
            echo "run-architecture-tests=false" >> "$GITHUB_OUTPUT"
            echo "run-setup-tests=false" >> "$GITHUB_OUTPUT"
            echo "run-infrastructure-tests=false" >> "$GITHUB_OUTPUT"
            echo "run-blazor-tests=false" >> "$GITHUB_OUTPUT"
            echo "run-secrets-tests=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Build & Test Change Detection"
              echo
              echo "Only paths owned by dedicated or documentation workflows changed; Build & Test will report an intentional no-op pass."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "run-tests=true" >> "$GITHUB_OUTPUT"

          run_app="false"
          run_domain="false"
          run_arch="false"
          run_setup="false"
          run_infra="false"
          run_blazor="false"
          run_secrets="false"

          all_subsystems="false"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_global_dependency "$file"; then
              all_subsystems="true"
              break
            fi
          done <<< "$relevant_files"

          if [ "$all_subsystems" = "true" ]; then
            run_app="true"
            run_domain="true"
            run_arch="true"
            run_setup="true"
            run_infra="true"
            run_blazor="true"
            run_secrets="true"
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                src/Explore.Domain/*|tests/Event.Domain.UnitTests/*)
                  run_domain="true"
                  run_app="true"
                  run_arch="true"
                  run_infra="true"
                  ;;
                src/Explore.Application/*|tests/Event.Application.UnitTests/*)
                  run_app="true"
                  run_arch="true"
                  run_infra="true"
                  ;;
                src/Explore.API/*|tests/Event.API.IntegrationTests/*)
                  run_app="true"
                  run_infra="true"
                  run_arch="true"
                  ;;
                src/Explore.Infrastructure/*|src/Explore.Persistence/*|src/Explore.Atproto.Transport/*|src/Event.MigrationService/*|tests/Explore.Infrastructure.Tests/*|tests/Event.Persistence.IntegrationTests/*)
                  run_infra="true"
                  run_arch="true"
                  ;;
                src/Explore.Secrets/*|tests/Explore.Secrets.UnitTests/*)
                  run_secrets="true"
                  run_infra="true"
                  run_arch="true"
                  ;;
                src/Explore.Blazor/*|src/Explore.Blazor.Client/*|src/Event.Web.BffHosting/*|tests/Explore.Blazor.Client.Tests/*|tests/Explore.Blazor.IntegrationTests/*)
                  run_blazor="true"
                  run_arch="true"
                  ;;
                NuGet.Config|.env.example|docker-compose.yml|docs/CONFIGURATION.md|src/Event.Setup.Core/*|src/Event.SetupAssistant/*|src/Event.SetupAssistant.Browser/*|src/Event.SetupAssistant.Desktop/*|src/Event.SetupAssistant.Terminal/*|src/Event.SetupAssistant.Cli/*|tests/Event.Setup*.Tests/*|eng/setup-assistant/generated/browser-release-capabilities.json|eng/setup-assistant/generated/setup-live-release-capabilities.json|eng/setup-assistant/generated/frozen-contract-baseline.json|eng/setup-assistant/generated/environment-catalogue.json|eng/setup-assistant/*|eng/release/dependencies/terminal-gui/*)
                  run_arch="true"
                  run_setup="true"
                  ;;
                src/Event.Wire.Contracts/*|tests/Event.Wire.Contracts.UnitTests/*|eng/tools/Explore.GeneratedContracts/*|tests/Explore.GeneratedContracts.Tests/*)
                  run_arch="true"
                  ;;
                src/Explore.Diagnostic/*|tests/Explore.Diagnostic.UnitTests/*)
                  run_arch="true"
                  ;;
                src/Event.Standalone/*|tests/Event.Standalone.IntegrationTests/*)
                  run_arch="true"
                  run_infra="true"
                  run_blazor="true"
                  ;;
                tests/Event.Architecture.Tests/*)
                  run_arch="true"
                  ;;
                schemas/configuration-manifest-v1alpha2.schema.json|schemas/tenant-configuration-package-v1alpha2.schema.json|eng/configuration-manifest-schema/*)
                  run_arch="true"
                  ;;
                src/*)
                  run_app="true"
                  run_domain="true"
                  run_arch="true"
                  run_setup="true"
                  run_infra="true"
                  run_blazor="true"
                  run_secrets="true"
                  ;;
              esac
              case "$file" in
                src/Event.Wire.Contracts/SetupLive/*|src/Explore.Domain/SetupLive/*|src/Explore.Application/ApplicationServicesRegistration.cs|src/Explore.Application/Contracts/SetupLive/*|src/Explore.Application/Contracts/Persistence/ISetupLiveRepository.cs|src/Explore.Application/Contracts/Infrastructure/ISetupSecretBindingReadinessReader.cs|src/Explore.Application/Contracts/Secrets/ISetupSecretBindingWriter.cs|src/Explore.Application/Contracts/Secrets/ISetupSecretBindingCommitBarrier.cs|src/Explore.Application/Features/SetupLive/*|src/Explore.Application/Telemetry/SetupLiveTelemetry.cs|src/Explore.Persistence/PersistenceServicesRegistration.cs|src/Explore.Persistence/ExploreDbContext.DbSets.cs|src/Explore.Persistence/ExploreDbContext.QueryFilters.cs|src/Explore.Persistence/Configurations/Entities/SetupLiveConfigurations.cs|src/Explore.Persistence/Repositories/SetupLiveRepository.cs|src/Explore.Persistence/RelationalSetupSecretBindingOperationCoordinator.cs|src/Explore.Persistence/Migrations/*AddSetupLivePersistence*|src/Explore.Persistence/Migrations/ExploreDbContextModelSnapshot.cs|src/Explore.Persistence.Migrations.MySql/Migrations/*AddSetupLivePersistence*|src/Explore.Persistence.Migrations.MySql/Migrations/ExploreDbContextModelSnapshot.cs|src/Explore.Persistence.Migrations.SqlServer/Migrations/*AddSetupLivePersistence*|src/Explore.Persistence.Migrations.SqlServer/Migrations/ExploreDbContextModelSnapshot.cs|src/Explore.Persistence.Migrations.Sqlite/Migrations/*AddSetupLivePersistence*|src/Explore.Persistence.Migrations.Sqlite/Migrations/ExploreDbContextModelSnapshot.cs|src/Explore.Secrets/Services/SetupSecretBindingAuthority.cs|src/Explore.Secrets/Extensions/SecretResolutionServiceCollectionExtensions.cs|src/Explore.Infrastructure/InfrastructureServicesRegistration.cs|src/Explore.Infrastructure/Services/SetupSecretProvider.cs|src/Explore.API/Controllers/SetupTargetEnrollmentsController.cs|src/Explore.API/OpenApi/SetupLiveRequestBodyTransformer.cs|src/Explore.Blazor.Client/Clients/EventApiClients.cs|src/Explore.Blazor.Client/Clients/EventApiTagClients.g.cs|tests/Event.Wire.Contracts.UnitTests/SetupLive/*|tests/Event.Domain.UnitTests/SetupLive/*|tests/Event.Application.UnitTests/Features/SetupLive/*|tests/Event.Persistence.IntegrationTests/SetupLive/*|tests/Explore.Secrets.UnitTests/SetupLive/*|tests/Event.API.IntegrationTests/Features/SetupLive*|tests/Explore.GeneratedContracts.Tests/SetupLive*)
                  run_arch="true"
                  run_setup="true"
                  ;;
              esac
            done <<< "$relevant_files"
          fi

          echo "run-app-tests=$run_app" >> "$GITHUB_OUTPUT"
          echo "run-domain-tests=$run_domain" >> "$GITHUB_OUTPUT"
          echo "run-architecture-tests=$run_arch" >> "$GITHUB_OUTPUT"
          echo "run-setup-tests=$run_setup" >> "$GITHUB_OUTPUT"
          echo "run-infrastructure-tests=$run_infra" >> "$GITHUB_OUTPUT"
          echo "run-blazor-tests=$run_blazor" >> "$GITHUB_OUTPUT"
          echo "run-secrets-tests=$run_secrets" >> "$GITHUB_OUTPUT"

          {
            echo "## Build & Test Subsystem Routing"
            echo
            echo "| Subsystem Lane | Run Status |"
            echo "|---|---|"
            echo "| Application Unit Tests | $run_app |"
            echo "| Domain Unit Tests | $run_domain |"
            echo "| Architecture Tests | $run_arch |"
            echo "| Setup Project Gates | $run_setup |"
            echo "| Infrastructure Tests | $run_infra |"
            echo "| Blazor UI Tests | $run_blazor |"
            echo "| Secrets Tests | $run_secrets |"
            echo
            echo "### Changed Relevant Files"
            echo '```text'
            printf '%s' "$relevant_files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  run-tests:
    needs: detect-build-test-changes
    uses: ./.github/workflows/_build-test.yml
    with:
      run-fast-tests: ${{ needs.detect-build-test-changes.outputs.run-tests == 'true' }}
      run-app-tests: ${{ needs.detect-build-test-changes.outputs.run-app-tests == 'true' }}
      run-domain-tests: ${{ needs.detect-build-test-changes.outputs.run-domain-tests == 'true' }}
      run-architecture-tests: ${{ needs.detect-build-test-changes.outputs.run-architecture-tests == 'true' }}
      run-setup-tests: ${{ needs.detect-build-test-changes.outputs.run-setup-tests == 'true' }}
      run-infrastructure-tests: ${{ needs.detect-build-test-changes.outputs.run-infrastructure-tests == 'true' }}
      run-blazor-tests: ${{ needs.detect-build-test-changes.outputs.run-blazor-tests == 'true' }}
      run-secrets-tests: ${{ needs.detect-build-test-changes.outputs.run-secrets-tests == 'true' }}
      run-integration-tests: false
      configuration: Release
