Title: "Separate storage provenance from delivery"
Type: feat
Scope: storage
Summary: "Storage origins are explicit nullable provenance, never delivery authority. Public response URLs derive from managed object identity and eligible delivery routes; internal provider details stay out of ordinary contracts. Native cutover validation rejects unclassified legacy locators before rename or drop/add operations."
