# Org admins manage their organizations; tenant admins manage all orgs within their tenant.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_organization"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_organization.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all organizations within their tenant
    - actions: ["view", "create", "update", "delete", "manage_members", "view-evidence", "review-evidence", "create_custom_address"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Organization creation is a pre-create check: the organization row does not exist yet.
    # The CreateOrganizationCommand handler still validates the payload, binds the tenant,
    # creates the organization actor, and adds the creator as organization admin.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            has(request.resource.attr.authorizationPhase) &&
            request.resource.attr.authorizationPhase == "pre_create" &&
            (!has(request.principal.attr.is_machine) ||
            request.principal.attr.is_machine != true)

    # Org admins can manage their own organization
    - actions: ["view", "update", "manage_members", "view-evidence", "submit-evidence", "create_custom_address"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin

    # All authenticated users can view organizations
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
