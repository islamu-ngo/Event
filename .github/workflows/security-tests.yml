name: Security Integration Tests

permissions:
  contents: read

on:
  schedule:
    - cron: "45 2 * * *"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Security Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Security-Relevant Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Security Integration Tests"
              echo
              echo "Scheduled/manual run: executing security integration tests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          if [[ -z "$changed_files" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Security Integration Tests"
              echo
              echo "Could not determine changed files; running security integration tests fail-safe."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant_files=""
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            case "$changed_file" in
              cerbos/*|docker/keycloak/*|src/Explore.Application/Authorization/*|src/Explore.API/Program.cs|src/Explore.API/Extensions/*|src/Explore.API/Middleware/*|src/Explore.Blazor/Program.cs|src/Explore.Blazor/Services/*|src/Explore.Blazor/Yarp/*|src/Explore.Infrastructure/Services/CerbosAuthorizationService.cs|src/Explore.Infrastructure/Services/CerbosPrincipalBuilder.cs|src/Explore.Infrastructure/Services/RuntimeAuthorizationProvider.cs|src/Explore.Infrastructure/Services/LocalAuthorizationProvider.cs|docs/SECURITY-MODEL.md|docs/AUTHORIZATION.md|tests/Event.API.IntegrationTests/Fixtures/*|tests/Event.API.IntegrationTests/Features/Security*|tests/Event.API.IntegrationTests/Features/Cerbos*|tests/Event.API.IntegrationTests/Features/Token*|tests/Event.API.IntegrationTests/Features/Authorization*|tests/Event.API.IntegrationTests/Features/Cloud*|.github/workflows/security-tests.yml)
                relevant_files="${relevant_files}${changed_file}"$'\n'
                ;;
            esac
          done <<< "$changed_files"

          if [[ -n "$relevant_files" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Security Integration Tests"
              echo
              echo "Security-relevant files changed; running security integration tests."
              echo
              echo '```text'
              printf '%s' "$relevant_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Security Integration Tests"
              echo
              echo "No security integration relevant files changed; required check is intentionally passing without running container-backed tests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: No-Op for Non-Security Changes
        if: ${{ steps.changes.outputs.run-tests != 'true' }}
        run: |
          echo "Security Integration Tests no-op: no security-relevant changes detected."

      - name: Setup .NET
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        run: dotnet restore --locked-mode

      - name: Restore .NET Tools
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        run: dotnet tool restore

      - name: Build
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        run: dotnet build tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Security Integration Tests
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        id: security_integration_tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/security-tests
          dotnet test tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --no-build --verbosity minimal -- --treenode-filter "/*/*/*/*[Category=Security]" --minimum-expected-tests 1 --no-progress --report-trx --report-trx-filename security-integration-tests.trx 2>&1 | tee artifacts/security-tests/security-integration-tests.log

      - name: Cerbos Policy Contract Tests
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        id: cerbos_policy_contract_tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/security-tests
          dotnet test tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --no-build --verbosity minimal -- --treenode-filter "/*/*/*/*[Category=PolicyContract]" --minimum-expected-tests 1 --no-progress --report-trx --report-trx-filename cerbos-policy-contract-tests.trx 2>&1 | tee artifacts/security-tests/cerbos-policy-contract-tests.log

      - name: Upload Security Test Evidence
        if: ${{ always() && steps.changes.outputs.run-tests == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-test-evidence
          path: |
            artifacts/security-tests/**
            tests/Event.API.IntegrationTests/**/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Write Security Test Evidence Summary
        if: ${{ always() && steps.changes.outputs.run-tests == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          SECURITY_OUTCOME: ${{ steps.security_integration_tests.outcome }}
          CERBOS_OUTCOME: ${{ steps.cerbos_policy_contract_tests.outcome }}
        shell: bash
        run: |
          {
            echo "## Security Test Evidence"
            echo
            echo "Artifact: \`security-test-evidence\`"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | ${EVENT_NAME} |"
            echo "| Ref | ${REF_NAME} |"
            echo "| Commit | ${COMMIT_SHA} |"
            echo "| Reliability inventory | docs/TEST_RELIABILITY.md |"
            echo
            echo "| Test lane | Step outcome | Evidence |"
            echo "|---|---|---|"
            echo "| Security integration tests | ${SECURITY_OUTCOME:-not-run} | Log plus \`security-integration-tests.trx\` |"
            echo "| Cerbos policy contract tests | ${CERBOS_OUTCOME:-not-run} | Log plus \`cerbos-policy-contract-tests.trx\` |"
            echo
            echo "Repeated scheduled failures require an owner/date entry in docs/TEST_RELIABILITY.md before they are treated as accepted baseline noise."
          } >> "$GITHUB_STEP_SUMMARY"
