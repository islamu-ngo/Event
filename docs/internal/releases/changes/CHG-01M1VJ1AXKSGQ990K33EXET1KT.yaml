# ABOUTME: Public change fragment for governed address geocoding and local reuse.
# ABOUTME: Records breaking API, privacy, migration, configuration, and operator impacts.
Change-Id: CHG-01M1VJ1AXKSGQ990K33EXET1KT
Title: Locations gain governed private address geocoding
Type: feat
Scope: discovery
Summary: >-
  Authenticated location management can reuse tenant-authorized local addresses
  or optional self-hosted Photon suggestions through private HAL contracts and
  purpose-bound protected selection tokens.
Group: governed-address-geocoding
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Location and nested event writes remove caller-authored coordinates and
      current-tenant authority. Provider selections use an opaque token bound to
      the trusted tenant, actor, organization, target, concurrency stamp, and
      provider dataset revision. No compatibility alias or reader is provided.
  Security:
    Reference: docs/SECURITY-MODEL.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Exact address queries and coordinates remain authenticated private PII.
      Search is tenant- and visibility-filtered before projection, responses are
      no-store, telemetry is identifier-free, manual creation is policy- and
      authorization-gated, and browser actions derive solely from HAL links.
  Migration:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      PostgreSQL adds one reconciled incremental admission/address-governance
      head over the shared semantic-value predecessor. Development-only SQLite,
      SQL Server, MariaDB, and MySQL use current-model InitialApplication
      rebaselines. Apply only the configured provider chain.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Geocoding defaults to Provider=None. Photon requires an operator-owned
      endpoint and dataset version plus bounded timeout, retry, result-limit,
      culture, country-bias, and token-lifetime settings. Secrets and internal
      endpoints remain server-side.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      The private address-suggestion POST publishes typed provider outcomes and
      typed HAL embedded items. Location writes add the protected selection
      token and optional organization scope, and generated clients must be
      regenerated from the committed OpenAPI document.
  Operator:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      Manual and local-only address management remains healthy with Photon
      disabled. Enabling Photon requires a pinned self-hosted deployment,
      explicit dataset lifecycle, bounded readiness, capacity planning,
      attribution, and rollback to Provider=None during provider degradation.
