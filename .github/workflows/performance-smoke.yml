name: Performance Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "50 4 * * 4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare private execution parent
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$RUNNER_TEMP/islamu-performance-private"
          mkdir -p "$TMPDIR"
          test "$(stat -c %u "$TMPDIR")" = "$(id -u)"
          test ! -L "$TMPDIR"
          chmod 700 "$TMPDIR"
          test ! -e "$TMPDIR/public"
          [[ "$DOCKER_HOST" == unix:///* ]]
          socket="$(readlink --canonicalize-existing -- "${DOCKER_HOST#unix://}")"
          test -S "$socket"
          {
            printf 'TMPDIR=%s\n' "$TMPDIR"
            printf 'DOCKER_HOST=unix://%s\n' "$socket"
          } >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: |
          dotnet restore --locked-mode
          dotnet restore eng/release/src/ISLAMU.ReleaseEngineering/ISLAMU.ReleaseEngineering.csproj --locked-mode

      - name: Build native admission and benchmarks
        shell: bash
        run: |
          set -euo pipefail
          dotnet build eng/release/src/ISLAMU.ReleaseEngineering/ISLAMU.ReleaseEngineering.csproj \
            --configuration Release --no-restore --verbosity quiet --nologo -m:1 \
            -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true
          dotnet build tests/Event.Benchmarks/Event.Benchmarks.csproj \
            --configuration Release --no-restore --verbosity quiet --nologo -m:1 \
            -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true

      - name: Cache the declared PostgreSQL image
        shell: bash
        run: |
          set -euo pipefail
          docker --host "$DOCKER_HOST" pull postgres:18-alpine > "$TMPDIR/postgres-provision.log" 2>&1

      - name: Admit six native PostgreSQL functional cases
        id: performance_smoke
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dotnet eng/release/src/ISLAMU.ReleaseEngineering/bin/Release/net10.0/ISLAMU.ReleaseEngineering.dll \
            execute-api-benchmarks "$TMPDIR/public" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" smoke \
            > "$TMPDIR/benchmark-parent.log" 2>&1
          test -s "$TMPDIR/public/benchmark-summary.json"

      - name: Write Performance Smoke Summary
        if: always()
        shell: bash
        env:
          PERFORMANCE_OUTCOME: ${{ steps.performance_smoke.outcome }}
        run: |
          {
            echo "## Performance Smoke Evidence"
            echo
            echo "Native PostgreSQL whole-six Dry functional admission: ${PERFORMANCE_OUTCOME}."
            echo "Only the shared native parent's admitted benchmark-summary.json is published."
            echo "Private credentials, custody records, logs and full BenchmarkDotNet results are withheld."
            echo "Dry is not a statistical baseline or production capacity claim."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Admitted Performance Evidence
        if: ${{ success() && steps.performance_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-smoke-evidence
          path: ${{ env.TMPDIR }}/public/benchmark-summary.json
          if-no-files-found: error
          retention-days: 30
