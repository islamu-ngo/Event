    unique_acceptance:
      - "Primary application and Data Protection persistence retain PostgreSQL, SQLite, SQL Server, MariaDB, and MySQL provider composition without collapsing provider migration owners or history tables"
      - "PrivacyErasure:Authority:Topology keeps EmbeddedSqlite with any primary provider, CoLocated only for PostgreSQL or SQLite, and ExternalDatabase only for separate PostgreSQL"
      - "Unsupported SQL Server, MariaDB, and MySQL CoLocated authority combinations fail during composition before adapter use and without exposing credentials, connection strings, or structured database values"
      - "Provider-native authority adapters remain distinct because PostgreSQL row locking, SQLite single-writer behavior, and external PostgreSQL function-only access are separate safety contracts behind IPrivacyErasureAuthority"
      - "MigrationService applies exactly one authority migration path for the selected topology while preserving application, Data Protection, embedded SQLite authority, co-located PostgreSQL authority, and external PostgreSQL authority ownership boundaries"
      - "Operator documentation states the truthful backup, restoreReplayProtection, support-matrix, and fail-closed remediation contract without implying five-provider CoLocated authority support"
      - "The existing CI provider matrix remains the real-engine release gate for primary provider migration and idempotency evidence"
    pr_checklist:
      - "Source, tests, CI, operator docs, and the active workstream state the same primary provider and privacy-erasure authority support matrix"
      - "Focused provider-composition tests prove all five primary providers, supported authority topologies, unsupported CoLocated failures, singular adapter registration, and secret-safe diagnostics"
      - "Focused migration-ownership tests prove provider migration assemblies, history tables, and authority migration owners remain explicit and collision-free"
      - "No generated migration, designer, or model-snapshot artifact is hand-edited; source model changes, if any, are regenerated through dotnet ef under the add-ef-migration intent"
      - "No tenant filter, named query filter, or exact tenant predicate is weakened while proving the persistence contract"
      - "No provider fallback, backward-compatibility shim, generic authority adapter, or universal CoLocated repository is introduced"
    forbidden_without_approval:
      - "Hand-editing generated migration, designer, or model-snapshot artifacts"
      - "Weakening tenant filters, named query filters, subject predicates, or exact tenant predicates"
      - "Collapsing PostgreSQL, SQLite, and external PostgreSQL provider-native authority adapters into one generic authority implementation"
      - "Adding provider fallback, backward-compatibility translation, dual-write, or compatibility shims for unsupported topology/provider combinations"
      - "Exposing secrets, credentials, generated connection strings, structured database values, provider payloads, or raw exception text in diagnostics, logs, health, ProblemDetails, CI output, or support artifacts"
      - "Expanding CoLocated authority support beyond PostgreSQL and SQLite without an explicit product decision, updated recovery/security model, migration-ownership update, and real-engine test evidence"
      - "Collapsing application, Data Protection, embedded authority, co-located authority, or external authority migration ownership into one project, schema, or history table"
