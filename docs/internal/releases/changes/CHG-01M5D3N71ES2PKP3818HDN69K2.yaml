    Public-Disclosure: public
    Detail: Waiting operations recheck current authorization before changing membership or tenant status. Caller-owned transactions must already hold the original application's cooperative Human gate; repositories do not acquire it late or dispose borrowed custody. Direct database edits outside the application protocol can bypass C# rules.
