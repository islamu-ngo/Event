apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event_resource"
  version: "default"
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_event_resource_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event_resource.json
  rules:
    - actions: ["view", "view-management", "create", "update", "publish", "unpublish", "archive", "delete", "access", "download", "view-audit", "export", "moderate"]
      effect: EFFECT_ALLOW
      roles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            request.principal.attr.tenantId == request.resource.attr.tenantId &&
            request.resource.attr.domainAllowed == true
