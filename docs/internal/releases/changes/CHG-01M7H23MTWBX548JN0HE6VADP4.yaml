Title: "settle provider checkpoints under original Event authority"
Type: fix
Scope: registration
Summary: "Commit provider refresh and validation checkpoints with the original authenticated Event operation, accepting only proven native Event revisions and retaining privacy and discovery custody through settlement."
Group: event-provider-original-settlement
