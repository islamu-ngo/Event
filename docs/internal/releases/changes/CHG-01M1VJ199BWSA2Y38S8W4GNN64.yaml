# ABOUTME: Public change fragment for deterministic generated browser record contracts.
# ABOUTME: Records source compatibility, OpenAPI, security, and operator impacts.
Change-Id: CHG-01M1VJ199BWSA2Y38S8W4GNN64
Title: Complete immutable results, semantic constraints, and generated records
Type: refactor
Scope: architecture
Summary: >-
  Immutable command results use valid-state factories, semantic Domain values
  are protected by generated five-provider constraints, and pinned NSwag output
  is transformed into privacy-safe records by a repository-owned Roslyn tool.
Group: records-adoption
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Command-result callers must use valid-state factories, and generated C#
      client consumers must replace post-construction response mutation with
      initialization or record with-copies. No compatibility surface is kept.
  Security:
    Reference: docs/GOVERNANCE.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      HAL links remain the browser action authority, protocol input graphs stay
      mutable classes where binding requires it, generated record diagnostic
      text omits member values, and no tenant or user authority field changes.
  Migration:
    Reference: schemas/islamu-event.md
    Disposition: documented
    Detail: >-
      PostgreSQL retains the generated PersistSemanticValueConstraints
      migration. The development-only SQLite, SQL Server, MariaDB, and MySQL
      rebaselines include the same constraints in their current
      InitialApplication migrations. The checks protect four owner tables and
      reject malformed rows before non-transactional DDL.
  Configuration:
    Reference: docs/BLAZOR.md
    Disposition: not-applicable
    Detail: >-
      No runtime setting, secret, provider credential, or environment variable
      is added.
  OpenAPI:
    Reference: docs/API.md
    Disposition: documented
    Detail: >-
      JSON names, requiredness, nullability, operation methods, HAL relations,
      exceptions, file responses, and wire payloads remain unchanged. The
      generated C# response/value representation changes from class to a record
      whose diagnostic text never includes member values.
  Operator:
    Reference: docs/BLAZOR.md
    Disposition: documented
    Detail: >-
      Apply the semantic constraints, then regenerate and rebuild browser
      clients before coordinated deployment. No secret or infrastructure
      configuration rollout step is required.
