name: Cerbos Policy Validation

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cerbos-policy-check:
    name: Cerbos Policy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-policies: ${{ steps.changes.outputs.run-policies }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Cerbos-Relevant Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run-policies=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "Scheduled/manual run: compiling Cerbos policies."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          if [[ -z "$changed_files" ]]; then
            echo "run-policies=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "Could not determine changed files; compiling policies fail-safe."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant_files=""
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            case "$changed_file" in
              cerbos/*|src/Explore.Application/Authorization/*|src/Explore.Infrastructure/Services/CerbosAuthorizationService.cs|src/Explore.Infrastructure/Services/CerbosPrincipalBuilder.cs|src/Explore.Infrastructure/Services/RuntimeAuthorizationProvider.cs|src/Explore.Infrastructure/Services/LocalAuthorizationProvider.cs|.github/workflows/cerbos-policy-check.yml)
                relevant_files="${relevant_files}${changed_file}"$'\n'
                ;;
            esac
          done <<< "$changed_files"

          if [[ -n "$relevant_files" ]]; then
            echo "run-policies=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "Cerbos-relevant files changed; compiling policies."
              echo
              echo '```text'
              printf '%s' "$relevant_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run-policies=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "No Cerbos-relevant files changed; required check is intentionally passing without compiling policies."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: No-Op for Non-Cerbos Changes
        if: ${{ steps.changes.outputs.run-policies != 'true' }}
        run: |
          echo "Cerbos Policy Validation no-op: no Cerbos-relevant changes detected."

      - name: Setup Cerbos
        if: ${{ steps.changes.outputs.run-policies == 'true' }}
        uses: cerbos/cerbos-setup-action@d1418d9ea5db17f419a48e992edff39b01bd0756 # v1
        with:
          version: "v0.53.0"

      - name: Compile Cerbos Policies
        if: ${{ steps.changes.outputs.run-policies == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/cerbos-policy
          cerbos compile cerbos/policies 2>&1 | tee artifacts/cerbos-policy/compile.log

      - name: Run Cerbos Policy Tests
        if: ${{ steps.changes.outputs.run-policies == 'true' && hashFiles('cerbos/tests/**') != '' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/cerbos-policy
          cerbos compile --tests=cerbos/tests cerbos/policies 2>&1 | tee artifacts/cerbos-policy/tests.log

      - name: Upload Cerbos Policy Evidence
        if: ${{ always() && steps.changes.outputs.run-policies == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cerbos-policy-evidence
          path: artifacts/cerbos-policy/**
          if-no-files-found: warn
          retention-days: 30

  # Publication authority is operator-owned. Deployment consumes the authenticated
  # statement through _cerbos-publication.yml; this required validation job never
  # acquires reusable Cerbos administrator credentials.
