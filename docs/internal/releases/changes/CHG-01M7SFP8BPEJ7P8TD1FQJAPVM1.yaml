Change-Id: CHG-01M7SFP8BPEJ7P8TD1FQJAPVM1
Title: "Install narrow Runtime DML permissions for categories and lookup types"
Type: fix
Scope: database
Summary: "Grant Runtime least-privilege column-scoped permissions under mandatory tenant row-level security for Category and CategoryTypeCategories and include CategoryType in lookup catalogue reads."
Group: category-runtime-permissions
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: "Reprovision development-native PostgreSQL profiles before starting this revision. Existing installations missing the CategoryType lookup column grants or PostgresCategoryMutationPermissions package fail closed rather than being silently repaired."
  Security:
    Reference: docs/internal/SECURITY_OVERVIEW.md
    Disposition: documented
    Detail: "Runtime receives column-scoped SELECT, INSERT, UPDATE (excluding immutable id and tenant_id), and RLS-enforced DELETE permissions on Category and CategoryTypeCategories plus fixed lookup SELECT columns on CategoryType. Global, PUBLIC, and WITH GRANT OPTION remain denied, and event-projection caller guards reject partial or broadened privileges."
  Migration:
    Reference: docs/internal/SECURITY_OVERVIEW.md
    Disposition: documented
    Detail: "ExploreDatabaseMigrator installs PostgresLookupCatalogueReadPermissions including CategoryType and applies PostgresCategoryMutationPermissions with mandatory tenant_isolation RLS."
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: "Initialize a fresh development-native PostgreSQL profile with the current migrator. No new operator credentials or configuration keys are introduced."
