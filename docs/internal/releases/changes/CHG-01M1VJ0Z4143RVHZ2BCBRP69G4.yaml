# ABOUTME: Public change fragment for durable paid registration Checkout and reconciliation.
# ABOUTME: Records migration, configuration, OpenAPI, security, and operator impacts.
Change-Id: CHG-01M1VJ0Z4143RVHZ2BCBRP69G4
Title: Paid registrations reconcile authoritative provider evidence
Type: feat
Scope: registration
Summary: >-
  Positive registration orders can use organizer-directed Stripe Checkout while
  signed callbacks and scheduled retrieval determine authoritative payment truth.
Group: registration-payments-phase18
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: Payment routes, HAL relations, and generated-client methods are additive before v1.
  Security:
    Reference: docs/SECURITY-MODEL.md
    Disposition: documented
    Detail: >-
      Checkout uses capability-aware idempotency, same-origin one-time BFF tickets,
      exact host allowlists, signed intake, and provider-truth reconciliation.
  Migration:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      Generated migrations add durable payment attempts, Checkout dispatch, signed
      intake reconciliation, and succeeded-observation persistence for all providers.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Paid Checkout requires a canonical public HTTPS origin, Stripe mode and exact
      Checkout hosts, organizer platform identity, server-only secrets, and Split Redis.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Account, guest, and Studio payment operations plus HAL resources are included
      in the generated OpenAPI and NSwag client.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Operators monitor the payment-reconciliation health check and 30-second Quartz
      drain while preserving webhook intake and reconciliation during sales rollback.
