  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/authorization.md
    Disposition: documented
    Detail: "No migration, new configuration, manual cache flush, or claims refresh is required. Nodes must read the same authoritative database; lagging replicas and separate stores are outside the freshness guarantee. BFF display claims and permission-registry caching are unchanged."
