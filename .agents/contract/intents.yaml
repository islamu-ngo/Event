  - id: test-suite-rationalization
    title: "Rationalize repository test architecture without changing product behavior"
    category: cross-cutting
    triggers:
      - "rationalize the test suite"
      - "refactor all tests"
      - "remove brittle tests"
      - "consolidate repository test projects"
      - "test suite rationalization"
    must_read_docs:
      - AGENTS.md
      - docs/internal/QUICK_REFERENCE.md
      - docs/internal/GOVERNANCE.md
      - docs/internal/TESTING.md
      - docs/internal/OPERATIONS.md
    load_skills:
      - refactor-safely
      - criticality-guardrail
    load_rules:
      - .agents/rules/tests.md
      - .agents/rules/work-criticality-matrix.md
    paths_in_scope:
      - "tests/**"
      - "eng/release/tests/**"
      - "Explore.slnx"
      - ".github/workflows/*test*.yml"
      - ".github/workflows/performance-smoke.yml"
      - ".agents/contract/intents.yaml"
      - ".agents/benchmarks/cold-start-tasks.yaml"
      - ".agents/rules/tests.md"
      - ".omo/rules/tests.md"
      - ".agents/agents/quality-verifier-agent.md"
      - "docs/internal/TESTING.md"
      - "docs/internal/OPERATIONS.md"
      - "docs/internal/GOVERNANCE.md"
      - "docs/internal/AGENTIC_CONTEXT_ENGINEERING.md"
      - "docs/internal/QUICK_REFERENCE.md"
      - "dev/active/**"
    paths_forbidden:
      - "src/**"
      - "schemas/openapi_islamu-event.json"
      - "src/**/Migrations/**"
      - "src/**/*ModelSnapshot.cs"
      - "src/**/*.Designer.cs"
    minimum_tests:
      - Event.Domain.UnitTests
      - Event.Application.UnitTests
      - Event.Architecture.Tests
      - Event.Persistence.IntegrationTests
      - Event.API.IntegrationTests
      - Explore.Blazor.Client.Tests
      - Explore.Blazor.IntegrationTests
      - Explore.Infrastructure.Tests
      - Explore.Secrets.UnitTests
      - Event.Wire.Contracts.UnitTests
      - Explore.GeneratedContracts.Tests
      - Explore.Diagnostic.UnitTests
      - Event.Standalone.IntegrationTests
      - ISLAMU.ReleaseEngineering.Tests
    docs_to_update:
      - docs/internal/TESTING.md
      - docs/internal/OPERATIONS.md
      - docs/internal/GOVERNANCE.md
      - docs/internal/AGENTIC_CONTEXT_ENGINEERING.md
      - docs/internal/QUICK_REFERENCE.md
    unique_acceptance:
      - "Every test cohort is retained, semantically replaced, or deleted with an explicit invariant disposition"
      - "Critical money, state-machine, concurrency, tenant, security, privacy, HAL, BFF, provider, migration, and protocol coverage fails closed until stronger replacement evidence passes"
      - "Every surviving executable project has a documented role, explicit lane ownership, and nonzero execution evidence"
      - "Fast lanes require no hidden Docker, browser, Aspire, broker, or live-provider infrastructure"
      - "Product, API, persistence, authorization, privacy, accessibility, and provider behavior remain unchanged"
    pr_checklist:
      - "Deleted cohorts map to stronger retained public-seam tests, passing semantic replacements, or intentionally removed behavior"
      - "No internal repository or cache call-count mirrors, EF cancellation boilerplate, fixed sleeps, or raw source and prose assurance remain"
      - "Machine-consumed schema and generated-contract tests parse behavior instead of pinning prose or implementation tokens"
      - "All affected project gates execute nonzero tests in Release configuration and the repository Release build passes"
      - "Use `Changelog: skip` with `Changelog-Reason: Internal test architecture and CI rationalization with no product behavior change`"
    forbidden_without_approval:
      - "Deleting or weakening critical coverage without a passing stronger replacement or intentionally removed behavior"
      - "Changing production behavior or editing product source to preserve a brittle test"
      - "Introducing a hidden runtime, Docker, browser, Aspire, broker, or provider prerequisite into a fast lane"
      - "Using test count, runtime, coverage percentage, or mutation score as sufficient deletion evidence"
      - "Adding backward-compatibility tests, mutation wrapper projects, historical source allowlists, or raw source-text assurance"
      - "Editing generated migrations, model snapshots, OpenAPI artifacts, or generated clients"
    related_agents:
      - architect-agent
      - quality-verifier-agent
      - change-reviewer-agent
    criticality:
      tier: domain_state
      required_model_tier: balanced
      verification_depth: extended
      tenancy_scope: system_level
      rollback_strategy: forward_fix_only
      intake_clarification_mode: standard_qa
      exploration_protocol: bounded_caller_callee
      testing_strategy: behavioral_unit_integration
      review_protocol: peer_review
      safety_gates:
        - "invariant_disposition_before_deletion"
        - "critical_coverage_fails_closed"
        - "product_behavior_unchanged"
        - "explicit_nonzero_project_lanes"
      mandatory_reviewers:
        - quality-verifier-agent
    verification_commands:
      - "dotnet build --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --verbosity quiet"

