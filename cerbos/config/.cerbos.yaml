# ============================================================================
# Cerbos Policy Decision Point (PDP) Configuration
# ============================================================================
# 
# This configuration sets up Cerbos as the authorization engine for the
# ISLAMU Event platform. It uses PostgreSQL so the Admin API can publish the
# application-owned policy package during deployment-managed reconciliation.
#
# Key Features:
# - Admin API enabled for PolicySyncService to push role-based policies
# - Mutable PostgreSQL storage for Admin API policy synchronization
# - Audit logging for compliance and debugging
# - Policy compilation caching for performance
#
# Environment Variables:
# - CERBOS_ADMIN_USER: Admin API username (default: cerbos)
# - CERBOS_ADMIN_PASSWORD_HASH: Bcrypt hash of admin password
# - CERBOS_PG_URL: PostgreSQL connection string
#
# ============================================================================

server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"
  
  adminAPI:
    enabled: true
    adminCredentials:
      username: "${CERBOS_ADMIN_USER:cerbos}"
      passwordHash: "${CERBOS_ADMIN_PASSWORD_HASH}"

storage:
  driver: "postgres"

  postgres:
    # PostgreSQL connection string with environment variable support
    url: "${CERBOS_PG_URL:postgres://cerbos_user:cerbos_password@postgres:5432/cerbos?search_path=cerbos&sslmode=disable}"

audit:
  enabled: true
  accessLogsEnabled: true
  decisionLogsEnabled: true
  backend: "local"
  
  local:
    # Local audit log storage path
    storagePath: /tmp/cerbos-audit
    # Retention period for audit logs (7 days)
    retentionPeriod: 168h

schema:
  # Validate principal and resource attributes against JSON schemas in _schemas/.
  # 'warn' logs validation errors without denying access (safe for rollout).
  # Switch to 'reject' in production to enforce schema compliance.
  enforcement: warn

engine:
  # Required only when the API is configured with Cerbos:UsePolicyScope=true for
  # tenant-specific policy overrides. Keeping it enabled is harmless for root
  # bundled policies and protects opt-in scoped deployments from missing links.
  lenientScopeSearch: true

compile:
  # Cache compiled policies for 60 seconds (production performance)
  cacheDuration: 60s
