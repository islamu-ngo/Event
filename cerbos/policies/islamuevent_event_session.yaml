apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event_session"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event_session.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all event sessions within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Session creation is a pre-create check: the session row does not exist yet,
    # so the API authorizes against the parent event id plus tenant/event attrs.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
        - islamuevent_event_owner
        - islamuevent_event_manager
      condition:
        match:
          expr: >
            has(request.resource.attr.authorizationPhase) &&
            request.resource.attr.authorizationPhase == "pre_create"

    # Org admins can manage event sessions for their organization
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin

    # Event owners can manage sessions for their event
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_owner

    # Event managers can manage sessions for their event
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_manager

    # All authenticated users can view event sessions
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
