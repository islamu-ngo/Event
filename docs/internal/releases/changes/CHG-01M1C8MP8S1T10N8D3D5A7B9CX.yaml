# ABOUTME: Public change fragment for bounded Setup composition source formats.
# ABOUTME: Records authoritative parity and fail-closed parser/filesystem policy.
Change-Id: CHG-01M1C8MP8S1T10N8D3D5A7B9CX
Title: "Bounded Setup composition sources"
Type: feat
Scope: self-hosting
Summary: "Setup Core compiles bounded JSON, YAML, and directory sources to byte-identical authoritative v1alpha2 JSON without adding wire identity."
Group: setup-composition
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/SETUP_COMPOSITION.md
    Disposition: documented
    Detail: >-
      Ambiguous YAML grammar, unsafe directory entries, unknown files,
      smuggled authority, and inputs above exact ceilings fail closed;
      no permissive or legacy source mode is retained.
  Security:
    Reference: docs/SECURITY_OVERVIEW.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Syntax-tree-only parsing, deterministic directory revalidation,
      authoritative parity, value-free failures, and no partial output protect
      self-hosted composition.
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
    Detail: >-
      The source compiler introduces no persisted state or data migration.
  Configuration:
    Reference: docs/SETUP_COMPOSITION.md
    Disposition: documented
    Detail: >-
      Standard default bound source bytes, parser structure, paths,
      files, directories, scalar sizes, and normalized nodes.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: >-
      Setup composition is an offline input concern and does not change the
      HTTP API contract.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Operators select one bounded source form and receive deterministic output
      only after complete validation; unsupported filesystem semantics
      disable directory input.
