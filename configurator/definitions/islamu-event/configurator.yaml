            minLength: 1
            required: true
            sensitivity: sensitive
            title: Display name
            type: string
          documents:
            disclosure: guided
            properties:
              tenant.branding:
                disclosure: guided
                properties:
                  payload:
                    disclosure: guided
                    properties:
                      displayName:
                        disclosure: guided
                        maxLength: 500
                        minLength: 1
                        required: true
                        sensitivity: sensitive
                        title: displayName
                        type: string
                    required: true
                    sensitivity: sensitive
                    title: payload
                    type: object
                  schemaVersion:
                    disclosure: guided
                    required: true
                    sensitivity: sensitive
                    title: schemaVersion
                    type: integer
                required: false
                sensitivity: sensitive
                title: tenant.branding
                type: object
            required: true
            sensitivity: sensitive
            title: Tenant documents
            type: object
          legalDocuments:
            disclosure: guided
            properties: {}
            required: true
            sensitivity: sensitive
            title: Tenant legal documents
