apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_instance_setting"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_instance_setting.json
  rules:
    # Ordinary instance-setting reads retain their existing instance-admin authority.
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin
      condition:
        match:
          expr: request.resource.id != "instance.configuration-manifest.export"

    # Whole-instance export requires the closed server-projected export fact.
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin
      condition:
        match:
          all:
            of:
              - expr: request.resource.id == "instance.configuration-manifest.export"
              - expr: request.resource.attr.configurationManifestExport == true

    # Instance admins retain mutation authority for instance settings.
    - actions: ["update", "delete", "lock", "unlock"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin
