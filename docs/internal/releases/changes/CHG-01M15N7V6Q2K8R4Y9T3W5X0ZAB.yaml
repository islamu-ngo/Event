# ABOUTME: Public change fragment for event ticketing lifecycle recovery and deployment convergence.
# ABOUTME: Records security, migration, configuration, OpenAPI, and operator impacts without launch approval.
Change-Id: CHG-01M15N7V6Q2K8R4Y9T3W5X0ZAB
Title: Event ticketing lifecycle adds recovery and deployment convergence
Type: feat
Scope: registration
Summary: >-
  Ticket purchase, participant readiness, transfer, fair return, add-ons, and
  restore recovery now share durable authority, explicit operator controls, and
  a machine-readable deployment capability matrix.
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Restored deployments begin recovery-only and cannot reopen workers or
      sales until consistency, bearer generation, provider ambiguity, and
      idempotency checks converge. No compatibility bypass is retained.
  Security:
    Reference: SECURITY.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Tenant-qualified manifests, HMAC key isolation, capability cancellation,
      credential revocation/reissue, queue fences, fixed-cardinality health, and
      ordered reopening fail closed without exposing bearer or provider data.
  Migration:
    Reference: docs/BACKUP_RESTORE_UPGRADE.md
    Disposition: documented
    Detail: >-
      Generated five-provider migrations add event add-on commerce and
      ticketing recovery checkpoints/reissue intents without rewriting existing
      migration history.
  Configuration:
    Reference: .env.example
    Disposition: documented
    Detail: >-
      Ticketing:Recovery adds disabled-by-default typed revision, floor, health,
      retained-key, RPO, RTO, and manifest-signing-key-reference settings. Key
      material remains Infisical or environment only.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Authoritative OpenAPI and the generated Blazor client add event add-on
      contracts and the read-only ticketing deployment capability matrix.
      Protected delayed payout has no operation.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Operators stop sales, pause Quartz, validate manifests, reconcile unknown
      provider work, rotate bearer authority, reopen workers, and reopen sales
      last. External production restore/takeover approval remains open.
