name: Build and Deploy to Coolify (Production)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      override_reason:
        description: Required only when DEPLOYMENT_FREEZE is true; explain the production override.
        required: false
        type: string
      cerbos_publication_receipt:
        description: Exact operator-signed publication JSON for this revision and production PDP.
        required: true
        type: string
      cerbos_publication_signature:
        description: Base64 RSA-PSS SHA-256 signature over the exact receipt bytes.
        required: true
        type: string
  push:
    branches: [main]
    paths-ignore:
      # AI / tool configuration directories
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      - ".ci/**"
      # BMAD framework
      - "_bmad/**"
      - "_bmad-output/**"
      # Documentation & metadata
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      # Project management (Plane)
      - "event/**"
      # Cerbos policies (has own workflow)
      - "cerbos/**"
      # Local dev infrastructure
      - "docker/**"
      - "docker-compose.yml"
      - "src/Explore.AppHost/**"
      - "tests/Event.Benchmarks/**"
      # Empty / unused directories
      - "amp/**"
      # Test projects (test-only changes don't affect deployed artifacts)
      - "tests/Event.Application.UnitTests/**"
      - "tests/Event.Domain.UnitTests/**"
      - "tests/Event.Architecture.Tests/**"
      - "tests/Event.Persistence.IntegrationTests/**"
      - "tests/Event.API.IntegrationTests/**"
      - "tests/Explore.Infrastructure.Tests/**"
      - "tests/Event.Standalone.IntegrationTests/**"
      - "tests/Shared/**"
      - "tests/Explore.Blazor.Client.Tests/**"
      - "tests/Explore.Blazor.IntegrationTests/**"
      # Markdown & root meta files
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"
      # GitHub config (except this workflow)
      - ".github/**"
      - "!.github/workflows/_container-build.yml"
      - "!.github/workflows/deploy-coolify.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cerbos-publication:
    uses: ./.github/workflows/_cerbos-publication.yml
    with:
      receipt: ${{ inputs.cerbos_publication_receipt || '' }}
      signature: ${{ inputs.cerbos_publication_signature || '' }}

  # JOB 1: Detect Changes
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      both_changed: ${{ steps.check-both.outputs.both_changed }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ui:
              - 'src/Explore.Blazor/**'
              - 'src/Explore.Blazor.Client/**'
              - 'src/Event.Web.BffHosting/**'
              - 'src/Explore.ServiceDefaults/**'
              - 'src/Directory.Build.props'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'Explore.slnx'

            api:
              - 'src/Explore.API/**'
              - 'src/Explore.Application/**'
              - 'src/Explore.Domain/**'
              - 'src/Explore.Infrastructure/**'
              - 'src/Explore.Persistence*/**'
              - 'src/Explore.Diagnostic/**'
              - 'src/Event.MigrationService/**'
              - 'src/Explore.ServiceDefaults/**'
              - 'src/Directory.Build.props'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'Explore.slnx'

      - name: Check if both changed
        id: check-both
        env:
          API_CHANGED: ${{ steps.filter.outputs.api }}
          UI_CHANGED: ${{ steps.filter.outputs.ui }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_MANUAL" == "true" ] || { [ "$API_CHANGED" == "true" ] && [ "$UI_CHANGED" == "true" ]; }; then
            echo "both_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "both_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Dynamic Build Matrix
        id: set-matrix
        env:
          API_CHANGED: ${{ steps.filter.outputs.api }}
          UI_CHANGED: ${{ steps.filter.outputs.ui }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          MATRIX_JSON="[]"

          if [ "$IS_MANUAL" == "true" ] || [ "$API_CHANGED" == "true" ]; then
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq '. + [{"image-name": "islamu-event-api", "dockerfile": "src/Explore.API/Dockerfile", "context": "."}]')
          fi

          if [ "$IS_MANUAL" == "true" ] || [ "$UI_CHANGED" == "true" ]; then
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq '. + [{"image-name": "islamu-event-ui", "dockerfile": "src/Explore.Blazor/Dockerfile", "context": "."}]')
          fi

          echo "matrix=$(echo "$MATRIX_JSON" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  # JOB 2: Run Tests (Unified)
  run-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build-test.yml
    with:
      run-integration-tests: true
      configuration: Release

  # JOB 3: Build & Push
  build-and-push:
    needs: [detect-changes, run-tests]
    if: always() && needs.run-tests.result == 'success' && needs.detect-changes.outputs.matrix != '[]'
    uses: ./.github/workflows/_container-build.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      environment: production
      build-configuration: Release
      metadata-tags: |
        type=raw,value=latest
        type=raw,value=sha-${{ github.sha }}
    secrets:
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

  # JOB 4: Deploy to Production
  deploy:
    needs: [detect-changes, build-and-push, cerbos-publication]
    if: always() && needs.build-and-push.result == 'success' && needs.cerbos-publication.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout local deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Download container build evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-build-*
          path: artifacts/container-build
          merge-multiple: true

      - name: Resolve production container registry configuration
        id: resolve-registry
        shell: bash
        env:
          CONFIGURED_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONFIGURED_REGISTRY_USER: ${{ vars.CONTAINER_REGISTRY_USER }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          trimmed_registry="${CONFIGURED_REGISTRY#"${CONFIGURED_REGISTRY%%[![:space:]]*}"}"
          trimmed_registry="${trimmed_registry%"${trimmed_registry##*[![:space:]]}"}"
          registry="${trimmed_registry,,}"
          trimmed_user="${CONFIGURED_REGISTRY_USER#"${CONFIGURED_REGISTRY_USER%%[![:space:]]*}"}"
          trimmed_user="${trimmed_user%"${trimmed_user##*[![:space:]]}"}"
          registry_user="${trimmed_user,,}"

          if [[ -z "${registry}" || "${registry}" == "ghcr.io" ]]; then
            registry="ghcr.io"
            registry_user="${REPO_OWNER,,}"
          elif [[ -z "${registry_user}" ]]; then
            echo "vars.CONTAINER_REGISTRY_USER is required when vars.CONTAINER_REGISTRY='${registry}'." >&2
            exit 1
          fi

          shopt -s nullglob
          promotion_files=(artifacts/container-build/*-promotion.json)
          if [[ "${#promotion_files[@]}" -eq 0 ]]; then
            echo "No container promotion evidence found under artifacts/container-build." >&2
            exit 1
          fi

          expected_prefix="${registry}/${registry_user}/"
          for promotion_file in "${promotion_files[@]}"; do
            actual_registry="$(jq -r '.registry' "${promotion_file}")"
            actual_repo="$(jq -r '.repository' "${promotion_file}")"
            if [[ "${actual_registry}" != "${registry}" || "${actual_repo}" != "${expected_prefix}"* ]]; then
              echo "Container build promotion evidence '${promotion_file}' targeted '${actual_repo}', which does not match production registry '${expected_prefix}'." >&2
              exit 1
            fi
          done

          {
            echo "registry=${registry}"
            echo "registry-user=${registry_user}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve API deploy image evidence
        id: api-evidence
        if: ${{ needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
        run: dotnet run .ci/scripts/resolve-deploy-image-evidence.cs -- artifacts/container-build islamu-event-api sha-

      - name: Resolve UI deploy image evidence
        id: ui-evidence
        if: ${{ needs.detect-changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' }}
        run: dotnet run .ci/scripts/resolve-deploy-image-evidence.cs -- artifacts/container-build islamu-event-ui sha-

      - name: Download authenticated publication receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cerbos-publication-receipt
          path: artifacts/cerbos-publication

      - name: Recheck publication freshness immediately before deployment
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.CERBOS_PUBLICATION_PUBLIC_KEY_PEM }}
          PDP_ENDPOINT: ${{ vars.CERBOS_PUBLICATION_PDP_ENDPOINT }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLIC_KEY" > "$RUNNER_TEMP/cerbos-publication-public.pem"
          dotnet run .ci/scripts/verify-cerbos-publication.cs -- \
            artifacts/cerbos-publication/receipt.json artifacts/cerbos-publication/receipt.sig \
            "$RUNNER_TEMP/cerbos-publication-public.pem" "$GITHUB_SHA" production \
            "$PDP_ENDPOINT" cerbos/policies

      - name: Trigger Coolify Deployment (API)
        if: ${{ needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: ./.ci/actions/deploy-coolify
        with:
          environment-name: production
          component: API
          coolify-webhook: ${{ secrets.COOLIFY_DEPLOY_API_WEBHOOK }}
          coolify-token: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          smoke-base-url: ${{ vars.PRODUCTION_API_URL }}
          registry: ${{ steps.resolve-registry.outputs.registry }}
          registry-user: ${{ steps.resolve-registry.outputs.registry-user }}
          image-name: islamu-event-api
          immutable-tag-prefix: sha-
          expected-image-digest: ${{ steps.api-evidence.outputs.expected-image-digest }}
          promotion-evidence-path: ${{ steps.api-evidence.outputs.promotion-evidence-path }}
          deployment-freeze: ${{ vars.DEPLOYMENT_FREEZE }}
          override-reason: ${{ inputs.override_reason }}
          require-smoke-check: "true"

      - name: Recheck publication before the UI deployment
        if: ${{ needs.detect-changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.CERBOS_PUBLICATION_PUBLIC_KEY_PEM }}
          PDP_ENDPOINT: ${{ vars.CERBOS_PUBLICATION_PDP_ENDPOINT }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLIC_KEY" > "$RUNNER_TEMP/cerbos-publication-public.pem"
          dotnet run .ci/scripts/verify-cerbos-publication.cs -- \
            artifacts/cerbos-publication/receipt.json artifacts/cerbos-publication/receipt.sig \
            "$RUNNER_TEMP/cerbos-publication-public.pem" "$GITHUB_SHA" production \
            "$PDP_ENDPOINT" cerbos/policies

      - name: Trigger Coolify Deployment (UI)
        if: ${{ needs.detect-changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: ./.ci/actions/deploy-coolify
        with:
          environment-name: production
          component: UI
          coolify-webhook: ${{ secrets.COOLIFY_DEPLOY_UI_WEBHOOK }}
          coolify-token: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          smoke-base-url: ${{ vars.PRODUCTION_UI_URL }}
          registry: ${{ steps.resolve-registry.outputs.registry }}
          registry-user: ${{ steps.resolve-registry.outputs.registry-user }}
          image-name: islamu-event-ui
          immutable-tag-prefix: sha-
          expected-image-digest: ${{ steps.ui-evidence.outputs.expected-image-digest }}
          promotion-evidence-path: ${{ steps.ui-evidence.outputs.promotion-evidence-path }}
          deployment-freeze: ${{ vars.DEPLOYMENT_FREEZE }}
          override-reason: ${{ inputs.override_reason }}
          require-smoke-check: "true"

      - name: Upload Deployment Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-production-evidence
          overwrite: true
          path: artifacts/deploy/**
          if-no-files-found: warn
          retention-days: 90
