# ABOUTME: Validates Cerbos authorization policies on changes to policy files or authorization code.
# ABOUTME: Always reports a status check, compiling policies only when authorization-relevant files change.

name: Cerbos Policy Validation

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cerbos-policy-check:
    name: Cerbos Policy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-policies: ${{ steps.changes.outputs.run-policies }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Cerbos-Relevant Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run-policies=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "Scheduled/manual run: compiling Cerbos policies."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          if [[ -z "$changed_files" ]]; then
            echo "run-policies=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "Could not determine changed files; compiling policies fail-safe."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant_files=""
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            case "$changed_file" in
              cerbos/*|src/Explore.Application/Authorization/*|src/Explore.Infrastructure/Services/CerbosAuthorizationService.cs|src/Explore.Infrastructure/Services/CerbosPrincipalBuilder.cs|src/Explore.Infrastructure/Services/RuntimeAuthorizationProvider.cs|src/Explore.Infrastructure/Services/LocalAuthorizationProvider.cs|.github/workflows/cerbos-policy-check.yml)
                relevant_files="${relevant_files}${changed_file}"$'\n'
                ;;
            esac
          done <<< "$changed_files"

          if [[ -n "$relevant_files" ]]; then
            echo "run-policies=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "Cerbos-relevant files changed; compiling policies."
              echo
              echo '```text'
              printf '%s' "$relevant_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run-policies=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Cerbos Policy Validation"
              echo
              echo "No Cerbos-relevant files changed; required check is intentionally passing without compiling policies."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: No-Op for Non-Cerbos Changes
        if: ${{ steps.changes.outputs.run-policies != 'true' }}
        run: |
          echo "Cerbos Policy Validation no-op: no Cerbos-relevant changes detected."

      - name: Setup Cerbos
        if: ${{ steps.changes.outputs.run-policies == 'true' }}
        uses: cerbos/cerbos-setup-action@272365d3ee2373a3e4a2aecb8cdf3852b452b4c1 # v1
        with:
          version: "v0.53.0"

      - name: Compile Cerbos Policies
        if: ${{ steps.changes.outputs.run-policies == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/cerbos-policy
          cerbos compile cerbos/policies 2>&1 | tee artifacts/cerbos-policy/compile.log

      - name: Run Cerbos Policy Tests
        if: ${{ steps.changes.outputs.run-policies == 'true' && hashFiles('cerbos/tests/**') != '' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/cerbos-policy
          cerbos compile --tests=cerbos/tests cerbos/policies 2>&1 | tee artifacts/cerbos-policy/tests.log

      - name: Upload Cerbos Policy Evidence
        if: ${{ always() && steps.changes.outputs.run-policies == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerbos-policy-evidence
          path: artifacts/cerbos-policy/**
          if-no-files-found: warn
          retention-days: 30

  publish-cerbos-policy-store:
    name: Publish Cerbos Policy Store
    runs-on: ubuntu-latest
    needs: cerbos-policy-check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cerbos-policy-check.outputs.run-policies == 'true' }}
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Publish Cerbos schemas and policies
        shell: bash
        env:
          CERBOS_SERVER: ${{ secrets.CERBOS_SERVER }}
          CERBOS_USERNAME: ${{ secrets.CERBOS_USERNAME }}
          CERBOS_PASSWORD: ${{ secrets.CERBOS_PASSWORD }}
          CERBOS_CA_CERT_PEM: ${{ secrets.CERBOS_CA_CERT_PEM }}
          CERBOSCTL_IMAGE: ghcr.io/cerbos/cerbosctl:0.53.0@sha256:8eda97fa4e108662c7589bb1acbca83df3ae71783f633ca2837c402558d6e68b
        run: |
          set -euo pipefail

          missing=()
          [[ -z "${CERBOS_SERVER:-}" ]] && missing+=("CERBOS_SERVER")
          [[ -z "${CERBOS_USERNAME:-}" ]] && missing+=("CERBOS_USERNAME")
          [[ -z "${CERBOS_PASSWORD:-}" ]] && missing+=("CERBOS_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production Cerbos secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          mkdir -p artifacts/cerbos-policy-publish

          ca_mount=()
          ca_args=()
          if [[ -n "${CERBOS_CA_CERT_PEM:-}" ]]; then
            ca_dir="${RUNNER_TEMP}/cerbos-ca"
            ca_file="${ca_dir}/ca.pem"
            install -m 700 -d "$ca_dir"
            printf '%s\n' "$CERBOS_CA_CERT_PEM" > "$ca_file"
            chmod 600 "$ca_file"
            ca_mount=(-v "${ca_file}:/cerbos-ca/ca.pem:ro")
            ca_args=(--ca-cert=/cerbos-ca/ca.pem)
          fi

          docker run --rm --pull=always \
            -v "${GITHUB_WORKSPACE}/cerbos/policies/_schemas:/schemas:ro" \
            "${ca_mount[@]}" \
            -e CERBOS_SERVER \
            -e CERBOS_USERNAME \
            -e CERBOS_PASSWORD \
            "$CERBOSCTL_IMAGE" \
            "${ca_args[@]}" \
            put schema -R /schemas \
            2>&1 | tee artifacts/cerbos-policy-publish/schema-upload.log

          docker run --rm --pull=always \
            -v "${GITHUB_WORKSPACE}/cerbos/policies:/policies:ro" \
            "${ca_mount[@]}" \
            -e CERBOS_SERVER \
            -e CERBOS_USERNAME \
            -e CERBOS_PASSWORD \
            "$CERBOSCTL_IMAGE" \
            "${ca_args[@]}" \
            put policy -R /policies \
            2>&1 | tee artifacts/cerbos-policy-publish/policy-upload.log

          {
            echo "## Cerbos Policy Store Publish"
            echo
            echo "Published schemas and policies to the production Cerbos Admin API after the main-branch policy validation gate passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cerbos Publish Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerbos-policy-publish-evidence
          path: artifacts/cerbos-policy-publish/**
          if-no-files-found: warn
          retention-days: 90
