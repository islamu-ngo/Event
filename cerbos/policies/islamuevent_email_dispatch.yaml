apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_email_dispatch"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_email_dispatch.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    - actions: ["view", "manage_tenant", "park", "replay", "resolve", "reconcile"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
