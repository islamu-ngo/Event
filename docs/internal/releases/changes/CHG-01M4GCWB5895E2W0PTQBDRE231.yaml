Change-Id: CHG-01M4GCWB5895E2W0PTQBDRE231
Title: "Recheck audience action decisions before HAL disclosure"
Type: fix
Scope: access
Summary: "Retain bounded native download, access and management decisions with audience detail and collection proofs. Invalidate a privately prepared representation when an action outcome changes, even if metadata remains readable; a fresh request can omit the denied affordance. Keep server-derived authority fields out of HTTP JSON and preserve routes and cursors. Ten regression cases are authored and unrun under the implementation-first programme override; complete consumer activation remains open."
