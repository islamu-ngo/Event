        group: Groups
        help: Whether users can self-register groups
        sensitivity: public
        title: groups.self_registration_enabled
        type: boolean
      modules.islamic_enabled:
        disclosure: guided
        group: Modules
        help: Enable Islamic event module
        sensitivity: public
        title: modules.islamic_enabled
        type: boolean
      modules.tech_enabled:
        disclosure: guided
        group: Modules
        help: Enable Tech event module
        sensitivity: public
        title: modules.tech_enabled
        type: boolean
      organizations.self_registration_enabled:
        disclosure: guided
        group: Organizations
        help: Whether users can self-register organizations
        sensitivity: public
        title: organizations.self_registration_enabled
        type: boolean
      organizations.tenant_can_omit_verification:
