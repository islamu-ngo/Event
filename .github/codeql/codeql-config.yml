# ABOUTME: CodeQL configuration excluding generated code and test assemblies.
# ABOUTME: Prevents runner memory exhaustion and timeouts on non-product artifacts.

name: "CodeQL Custom Config"

paths-ignore:
  - '**/Clients/EventApiClient.g.cs'
  - '**/Clients/EventApiTagClients.g.cs'
  - '**/*.g.cs'
  - 'tests/**'
