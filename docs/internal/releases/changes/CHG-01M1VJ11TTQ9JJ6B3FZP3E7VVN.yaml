# ABOUTME: Public change fragment for per-event venue disclosure and consent-backed private homes.
# ABOUTME: Records breaking contract, migration, operator, and privacy impacts of the EventLocation work.
Change-Id: CHG-01M1VJ11TTQ9JJ6B3FZP3E7VVN
Title: Event venues disclose per event instead of per venue
Type: feat
Scope: privacy
Summary: >-
  Each event decides independently what to reveal about a venue. Public visitors,
  registered attendees, and organizers receive separate purpose-specific
  contracts, private homes stay generic until the organizer releases them, and
  erasing an owner queues every affected event for remediation.
Group: event-location-privacy
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      The generic geographic browse routes GET /api/location/by-city/{city} and
      GET /api/location/by-country/{country} are removed with their repository
      reads and generated client methods; they enumerated exact venue addresses,
      including private homes, for any caller holding tenant-wide location view
      and with no disclosure evaluation. The published disclosure-state enum now
      reports the snake_case values the API actually sends instead of CLR names,
      and HAL-wrapped enum properties are typed instead of integer or untyped, so
      generated clients must be regenerated.
  Security:
    Reference: docs/SECURITY-MODEL.md
    Disposition: documented
    Detail: >-
      Public, attendee, and management reads are separate operations with separate
      response contracts. Unknown venues resolve to hidden rather than public, a
      private home's public label stays generic, and exact street, postcode, and
      coordinates require venue policy, governance ceiling, registration
      entitlement, and the server clock passing the reveal instant together.
      Management reads append a PII-free exact-read audit record. Structured
      JSON-LD is built only from the anonymous public projection and carries only
      venue name, city, and country. Private home ownership requires an explicit
      versioned consent acknowledgement from the incoming owner and is never
      inferred from the creating actor.
  Migration:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      ContractEventLocationPhysicalReferences ships for PostgreSQL, SQLite, SQL
      Server, MariaDB, and MySQL. It adds a check constraint to event sessions,
      session groups, agenda items, and session agenda items requiring that a
      physical venue reference is mediated by an event-scoped EventLocation. The
      migration is reversible and adds no columns or data movement.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      LocationPrivacy:Observability:ReviewQueueDegradedThreshold sets the
      remediation backlog size above which readiness degrades. It defaults to 50
      and requires no action to keep current behavior.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Adds the purpose-partitioned EventLocation operations, a management
      collection read, and the two private-home ownership operations; removes the
      geographic browse operations; and corrects enum and HAL nested schema types.
      Regenerate clients from schemas/openapi_islamu-event.json.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      A new event-location-privacy-review readiness check reports the venue
      remediation backlog and degrades above its threshold. The
      Explore.EventLocationPrivacy meter exposes disclosure and correction
      counters plus a review-queue depth gauge; the gauge reports nothing until
      its first probe so an unscraped instance is never mistaken for an empty
      queue. All labels are bounded and carry no tenant, event, venue, or subject
      identity.
