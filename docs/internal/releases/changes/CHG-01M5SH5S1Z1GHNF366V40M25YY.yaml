  Migration:
    Reference: docs/internal/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/internal/OPERATIONS.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/internal/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/configuration-and-operations/troubleshooting-and-health.md
    Disposition: documented
    Detail: Startup and subsequent cleanup failures remain visible together. Diagnose the startup error as well as cleanup; no new configuration, restart, container recreation or data-reset action is introduced.
