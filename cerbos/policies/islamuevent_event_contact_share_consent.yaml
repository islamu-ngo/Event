# Controls who can view and export shared contact emails from consented registrants.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event_contact_share_consent"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event_contact_share_consent.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can view and export shared contacts
    - actions: ["viewsharedcontacts", "exportsharedcontacts"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Org admins can view and export shared contacts for their organisation
    - actions: ["viewsharedcontacts", "exportsharedcontacts"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin
