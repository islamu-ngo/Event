Title: "Bind resource observers to exact machine key and owner coordinates"
Type: fix
Scope: access
Summary: "Prevent machine audience continuations and prepared metadata from transferring between different key IDs, authority tenants or owner coordinates. Resource requests, fresh snapshots and batch qualification retain immutable value-equal machine identity without inheriting the owner's human subject. Native HAL, management, delivery and upload request construction carries those same coordinates. Audience cursor purpose and query version 2 require a first-page refresh. Current machine-source qualification and complete moderation consumer conformance remain open; no moderation profile is activated."
