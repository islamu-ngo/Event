    Reference: docs/internal/API_CHANGELOG.md
    Disposition: documented
    Detail: AccountRequired participation is rejected without permitted public onboarding; capability-removing policy changes conflict instead of rewriting event configuration.
  Security:
    Reference: docs/internal/AUTHORIZATION.md
    Disposition: documented
    Detail: Shared pretransaction policy ownership fences publication and provider changes; verified provider identity and existing-account authority remain independent of visitor signup.
  Migration:
    Reference: docs/internal/ADMISSION_AND_REGISTRATION.md
    Disposition: not-applicable
    Detail: Visitor mode and provider onboarding declarations use the existing governed settings store without a relational schema change.
  Configuration:
    Reference: docs/internal/ADMISSION_AND_REGISTRATION.md
    Disposition: documented
    Detail: Visitor access modes and explicit configurable-provider onboarding policy and HTTPS destinations determine effective public capabilities rather than primary-provider or SMTP inference.
  OpenAPI:
    Reference: docs/internal/API_CHANGELOG.md
    Disposition: documented
    Detail: Existing public, shell, provider and event responses publish typed visitor facts and provider-specific signup affordances through native regenerated contracts.
  Operator:
    Reference: docs/public/documentation/readme/events-and-ticketing/modular-event-aspects.md
