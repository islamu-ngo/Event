# ABOUTME: Public change fragment generated with its collision-resistant commit footer.
# ABOUTME: Records release impact defaults for review before the owning commit is shared.
Change-Id: CHG-01M1AERW60EDH2QA096DZ2849B
Title: "External secret authority cutover"
Type: feat
Scope: self-hosting
Summary: "Self-hosted deployments select one Environment or Infisical authority and no longer persist or mutate private credentials in application settings."
Group: secret-authority-cutover
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Credential fields and mutation routes are removed from storage, SMTP,
      localization, and integration administration contracts. Deployments must
      provision the authoritative external keys; no compatibility aliases remain.
  Security:
    Reference: docs/SECURITY_OVERVIEW.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Runtime resolution is tenant-qualified, metadata-only bindings never
      persist values, selected-provider failures do not fall back, and health,
      logs, API responses, OpenAPI, and UI surfaces expose status without value
      material or provider coordinates.
  Migration:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Generated PostgreSQL, SQLite, SQL Server, MariaDB, and MySQL migrations
      remove inline ciphertext columns and their legacy source branch while
      retaining opaque Environment or Infisical binding metadata.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      SECRET_PROVIDER must explicitly select Environment, Infisical, or
      Development/Testing-only UserSecrets.
      Infisical URL, environment, project, and universal-auth inputs are
      mandatory in Infisical mode; each mode is isolated and Production rejects
      UserSecrets.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Authoritative OpenAPI and the generated Blazor client remove private
      credential properties from storage and SMTP administration contracts.
  Operator:
    Reference: docs/SECRETS.md
    Disposition: documented
    Detail: >-
      Operators provision external keys before rollout, restart consumers that
      cannot reload, wait for replica acknowledgement before revocation, retain
      the previous value through the overlap window, and restore by
      reprovisioning the selected authority before application recovery.
