apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_ai_conversation"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_ai_conversation.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can inspect/manage assistant conversations within their tenant.
    - actions: ["view", "create", "send_message", "confirm_action", "reject_action", "cancel_run", "propose_action"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Authenticated users can reach self-service handlers; handlers enforce ownership.
    - actions: ["view", "create", "send_message", "confirm_action", "reject_action", "cancel_run", "propose_action"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
