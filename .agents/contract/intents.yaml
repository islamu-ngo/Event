# ABOUTME: Canonical intent catalog for the Contribution Contract.
# ABOUTME: Each entry is a machine-readable answer to the 8 contract questions for one category of change.

version: 1

intents:
  - id: add-get-endpoint
    title: "Add a new GET endpoint to the public API"
    category: api
    triggers:
      - "add a new GET endpoint"
      - "expose a new read endpoint"
      - "new query endpoint"
    must_read_docs:
      - docs/internal/API.md
      - docs/internal/QUICK_REFERENCE.md
    load_skills:
      - cqrs-mediatr-guidelines
    load_rules:
      - .agents/rules/api-controllers.md
    paths_in_scope:
      - "src/Explore.API/Controllers/**/*.cs"
      - "src/Explore.Application/Features/**/Queries/**/*.cs"
    minimum_tests:
      - Event.API.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/internal/API_CHANGELOG.md
    unique_acceptance:
      - "Output cache policy applied if appropriate"
      - "HAL link policy updated if response is a resource"
    forbidden_without_approval:
      - "Removing or renaming an existing endpoint"
    related_agents:
      - architect-agent
      - presentation-engineer-agent
      - quality-verifier-agent
      - change-reviewer-agent
    criticality:
      tier: standard
      required_model_tier: economical
      verification_depth: standard
      tenancy_scope: tenant_isolated
      rollback_strategy: forward_fix_only
      intake_clarification_mode: autonomous_defaults
      exploration_protocol: local_surface_only
      testing_strategy: behavioral_unit_integration
      review_protocol: lightweight_self_check
      safety_gates:
        - "output_cache_policy_applied"
        - "hal_self_link_present"
      mandatory_reviewers:
        - presentation-engineer-agent

  - id: add-write-endpoint
