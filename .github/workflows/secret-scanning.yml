name: Secret Scanning

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/gitleaks secret-scanning-results
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo ".tools/${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  .tools/${archive}" | sha256sum -c -
          tar -xzf ".tools/${archive}" -C .tools/gitleaks gitleaks
          .tools/gitleaks/gitleaks version | tee secret-scanning-results/gitleaks-version.txt

      - name: Determine scan range
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          mode="blocking"
          exit_code="1"
          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            mode="advisory"
            exit_code="0"
          fi

          if [[ "$mode" == "blocking" ]]; then
            if [[ -z "$base_sha" ]]; then
              base_sha="HEAD~1"
            fi
            log_opts="${base_sha}..${GITHUB_SHA}"
          else
            log_opts="HEAD"
          fi

          {
            echo "mode=${mode}"
            echo "exit-code=${exit_code}"
            echo "log-opts=${log_opts}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Secret Scanning Scope"
            echo
            echo "Mode: ${mode}"
            echo "Git log range: \`${log_opts}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .tools/gitleaks/gitleaks git . \
            --log-opts "${{ steps.scope.outputs['log-opts'] }}" \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path secret-scanning-results/gitleaks.sarif \
            --exit-code "${{ steps.scope.outputs['exit-code'] }}" \
            --timeout 120 2>&1 | tee secret-scanning-results/gitleaks.txt
          scan_exit=${PIPESTATUS[0]}
          set -e

          {
            echo "## gitleaks"
            echo
            echo "gitleaks completed with exit code ${scan_exit}."
            echo "Blocking mode fails when new leaks are detected; scheduled/manual mode is advisory evidence for legacy history."
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$scan_exit"

      - name: Upload secret scanning evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scanning-evidence
          path: secret-scanning-results/
          retention-days: 30
