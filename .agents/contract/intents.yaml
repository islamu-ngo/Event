    unique_acceptance:
      - "Cosmetic branding, tenant directory operator, instance operator, and organizer merchant remain independent authoritative roles"
      - "Every tenant creation path atomically creates both canonical typed documents and cannot bypass identity readiness when requesting Active"
      - "Activation, public disclosure, paid publication, checkout, and acceptance fail closed with stable payload-free reason codes"
      - "Paid acceptance snapshots exact structured tenant, instance, organizer, provider, policy, and money facts without rewriting history"
      - "HAL, authorization, OpenAPI, generated client, and Blazor affordances converge without local role inference"
      - "Generated migrations cover all five application providers and generated artifacts are never hand-edited"
    pr_checklist:
      - "Failing-first invariant tests cover every direct activation path, cross-tenant mutation, malformed identity, public 503 behavior, paid publication, checkout, and acceptance replay"
      - "Repositories return entities or typed documents, handlers map DTOs, validators are manually instantiated, and tenant filters remain active"
      - "No branding value, literal product name, instance identity, organizer identity, or compatibility alias substitutes for missing tenant identity"
      - "Logs, metrics, traces, health, and ProblemDetails contain only bounded codes and approved identifiers, never legal names, registration identifiers, emails, or URLs"
      - "OpenAPI, contract inventory, generated client, five provider migrations, canonical docs, I-VSD evidence, and release fragment match the shipped contract"
    forbidden_without_approval:
      - "Creating or reactivating an Active tenant outside the shared identity and capacity readiness boundary"
      - "Inferring legal identity from branding, tenant name, instance configuration, organizer data, or payment recipient data"
      - "Adding compatibility aliases, dual reads, dual writes, deprecated prose properties, or old configuration fallbacks"
      - "Hand-editing generated migrations, model snapshots, OpenAPI, contract inventory, or NSwag client output"
      - "Changing OrganizerDirect recipient authority, connected-account fencing, integer money, payment idempotency, or historical acceptance"
