# Maps principal attributes from CerbosPrincipalBuilder to context-aware derived roles.
# Principal structure (from CerbosPrincipalBuilder.BuildAsync):
#   roles: ["islamuevent_authenticated_user"]
#   attr.isInstanceAdmin: bool
#   attr.tenantMemberships: { "<tenantId>": "admin" }
#   attr.orgMemberships: { "<orgId>": "admin" }
# Resource structure (set by AuthorizationBehavior / command handlers):
#   attr.tenantId: string (for tenant-scoped resources)
#   attr.organizationId: string (for org-scoped resources)

apiVersion: "api.cerbos.dev/v1"
description: "Derived roles for Instance > Tenant > Organization hierarchy"
derivedRoles:
  name: islamuevent_explore_admin_roles
  definitions:
    # ========================================
    # HIERARCHY DERIVED ROLES
    # ========================================
    # These match the CerbosPrincipalBuilder output structure.
    # islamuevent_instance_admin: isInstanceAdmin == true
    # islamuevent_tenant_admin: resource's tenantId is in principal's tenantMemberships map
    # islamuevent_org_admin: resource's organizationId is in principal's orgMemberships map

    - name: islamuevent_instance_admin
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: request.principal.attr.isInstanceAdmin == true

    - name: islamuevent_tenant_admin
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.tenantId) &&
            request.resource.attr.tenantId in request.principal.attr.tenantMemberships

    - name: islamuevent_org_admin
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.organizationId) &&
            request.resource.attr.organizationId in request.principal.attr.orgMemberships

    - name: islamuevent_group_admin
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.groupId) &&
            has(request.principal.attr.groupMemberships) &&
            request.resource.attr.groupId in request.principal.attr.groupMemberships

    - name: islamuevent_actor_user_owner
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.userId) &&
            has(request.principal.attr.userId) &&
            request.resource.attr.userId == request.principal.attr.userId &&
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true)

    # ========================================
    # EVENT-SCOPED DERIVED ROLES
    # ========================================
    # These check principal.attr.eventAssignments[resource.attr.eventId].roles
    # for the relevant role master code. The eventAssignments map is hydrated
    # on demand by CerbosPrincipalBuilder.EnrichWithEventAssignmentsAsync.
    # Role codes: event.owner, event.manager, event.registration_manager, event.check_in_staff

    - name: islamuevent_event_owner
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.eventId) &&
            has(request.resource.attr.tenantId) &&
            has(request.principal.attr.eventAssignments) &&
            request.resource.attr.eventId in request.principal.attr.eventAssignments &&
            has(request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId) &&
            request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId == request.resource.attr.tenantId &&
            "event.owner" in request.principal.attr.eventAssignments[request.resource.attr.eventId].roles

    - name: islamuevent_event_manager
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.eventId) &&
            has(request.resource.attr.tenantId) &&
            has(request.principal.attr.eventAssignments) &&
            request.resource.attr.eventId in request.principal.attr.eventAssignments &&
            has(request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId) &&
            request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId == request.resource.attr.tenantId &&
            ("event.owner" in request.principal.attr.eventAssignments[request.resource.attr.eventId].roles ||
             "event.manager" in request.principal.attr.eventAssignments[request.resource.attr.eventId].roles)

    - name: islamuevent_registration_manager
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.eventId) &&
            has(request.resource.attr.tenantId) &&
            has(request.principal.attr.eventAssignments) &&
            request.resource.attr.eventId in request.principal.attr.eventAssignments &&
            has(request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId) &&
            request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId == request.resource.attr.tenantId &&
             "event.registration_manager" in request.principal.attr.eventAssignments[request.resource.attr.eventId].roles &&
             "event_registration:manage" in request.principal.attr.eventAssignments[request.resource.attr.eventId].permissions

    - name: islamuevent_ticket_manager
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.eventId) &&
            has(request.resource.attr.tenantId) &&
            has(request.principal.attr.eventAssignments) &&
            request.resource.attr.eventId in request.principal.attr.eventAssignments &&
            has(request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId) &&
            request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId == request.resource.attr.tenantId &&
            "event:manage-tickets" in request.principal.attr.eventAssignments[request.resource.attr.eventId].permissions

    - name: islamuevent_check_in_staff
      parentRoles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.resource.attr.eventId) &&
            has(request.resource.attr.tenantId) &&
            has(request.principal.attr.eventAssignments) &&
            request.resource.attr.eventId in request.principal.attr.eventAssignments &&
            has(request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId) &&
            request.principal.attr.eventAssignments[request.resource.attr.eventId].tenantId == request.resource.attr.tenantId &&
            ("event.owner" in request.principal.attr.eventAssignments[request.resource.attr.eventId].roles ||
             "event.manager" in request.principal.attr.eventAssignments[request.resource.attr.eventId].roles ||
             "event.check_in_staff" in request.principal.attr.eventAssignments[request.resource.attr.eventId].roles)
