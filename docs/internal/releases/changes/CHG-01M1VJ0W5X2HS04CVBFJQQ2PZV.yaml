# ABOUTME: Public change fragment for provider-native migration and privacy-erasure isolation.
# ABOUTME: Records topology enforcement, migration ownership, and operator recovery impact.
Change-Id: CHG-01M1VJ0W5X2HS04CVBFJQQ2PZV
Title: Provider-native database migration and privacy-erasure isolation
Type: fix
Scope: storage
Summary: >-
  Database bootstrap preserves each provider's migration ownership and rejects
  privacy-erasure authority targets that would weaken recovery isolation.
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
    Detail: >-
      No supported configuration value is removed. ExternalDatabase deployments
      already require a physically separate PostgreSQL authority target.
  Security:
    Reference: docs/PRIVACY_ERASURE.md
    Disposition: documented
    Detail: >-
      Startup rejects unsupported or same-target authority configurations before
      migration I/O, using bounded diagnostics that exclude connection secrets.
  Migration:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      Application, provider adjustments, Data Protection, and the selected
      authority retain distinct provider-native migration owners and histories.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      CoLocated authority remains limited to PostgreSQL and SQLite, while
      ExternalDatabase requires a separate PostgreSQL database.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: No HTTP or OpenAPI contract changes.
  Operator:
    Reference: docs/TROUBLESHOOTING.md
    Disposition: documented
    Detail: >-
      Operators receive topology-specific, secret-safe remediation for startup
      failures and retain truthful backup and restore units.
