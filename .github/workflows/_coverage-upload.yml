name: Coverage Upload (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      flag:
        required: true
        type: string
      artifact:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  upload:
    name: Codecov (${{ inputs.flag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checkout supplies source paths; never execute repository code or consume a package cache here.
    steps:
      - name: Checkout covered sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: artifacts/coverage
      - name: Upload lane coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ github.event_name != 'pull_request' && secrets.CODECOV_TOKEN || github.event.pull_request.head.repo.full_name == github.repository && secrets.CODECOV_TOKEN || '' }}
          directory: artifacts/coverage
          flags: ${{ inputs.flag }}
          name: ${{ inputs.flag }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
