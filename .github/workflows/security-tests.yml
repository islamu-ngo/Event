name: Security Integration Tests

permissions:
  contents: read

on:
  schedule:
    - cron: "45 2 * * *"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Security Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TMPDIR: ${{ runner.temp }}/islamu-security-private
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/islamu-assurance-headless-browsers
      ISLAMU_K6_PATH: ${{ runner.temp }}/islamu-security-tools/k6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare Private Runner Directories
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/islamu-security-tools"
          chmod 700 "$TMPDIR" "$RUNNER_TEMP/islamu-security-tools"
          [[ "$DOCKER_HOST" == unix:///* ]]
          selected_socket="$(readlink --canonicalize-existing -- "${DOCKER_HOST#unix://}")"
          test -S "$selected_socket"
          printf 'DOCKER_HOST=unix://%s\n' "$selected_socket" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build Security Selection
        run: |
          dotnet restore eng/release/src/ISLAMU.ReleaseEngineering/ISLAMU.ReleaseEngineering.csproj --locked-mode
          dotnet build eng/release/src/ISLAMU.ReleaseEngineering/ISLAMU.ReleaseEngineering.csproj --configuration Release --no-restore --verbosity quiet --nologo -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true
          dotnet eng/release/src/ISLAMU.ReleaseEngineering/bin/Release/net10.0/ISLAMU.ReleaseEngineering.dll verify-security-register eng/security/security-control-register.json

      - name: Detect Security-Relevant Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Security Integration Tests"
              echo
              echo "Scheduled/manual run: executing security integration tests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          if [[ -z "$changed_files" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Security Integration Tests"
              echo
              echo "Could not determine changed files; running security integration tests fail-safe."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_paths="$RUNNER_TEMP/security-changed-paths.txt"
          printf '%s\n' "$changed_files" > "$changed_paths"
          selection="$(dotnet eng/release/src/ISLAMU.ReleaseEngineering/bin/Release/net10.0/ISLAMU.ReleaseEngineering.dll select-security-changes "$changed_paths")"
          case "$selection" in
            run-tests=true|run-tests=false) ;;
            *) echo "Security selection returned an invalid result." >&2; exit 1 ;;
          esac
          printf '%s\n' "$selection" >> "$GITHUB_OUTPUT"

          if [[ "$selection" == "run-tests=true" ]]; then
            {
              echo "## Security Integration Tests"
              echo
              echo "Security-relevant files changed; running security integration tests."
              echo
              echo '```text'
              printf '%s\n' "$changed_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Security Integration Tests"
              echo
              echo "No security integration relevant files changed; required check is intentionally passing without running container-backed tests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: No-Op for Non-Security Changes
        if: ${{ steps.changes.outputs.run-tests != 'true' }}
        run: |
          echo "Security Integration Tests no-op: no security-relevant changes detected."

      - name: Restore
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        run: dotnet restore --locked-mode

      - name: Build Registered Security Hosts
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --no-restore --verbosity quiet -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true
          dotnet build tests/Event.Distributed.IntegrationTests/Event.Distributed.IntegrationTests.csproj --configuration Release --no-restore --verbosity quiet -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true

      - name: Prepare Private Execution Prerequisites
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker --host "$DOCKER_HOST" pull quay.io/keycloak/keycloak:26.1.2 > "$TMPDIR/keycloak-provisioning.log" 2>&1
          docker --host "$DOCKER_HOST" pull ghcr.io/cerbos/cerbos:0.53.0 > "$TMPDIR/cerbos-provisioning.log" 2>&1
          dotnet run eng/tools/InstallAssuranceBrowser.cs > "$TMPDIR/browser-provisioning.log" 2>&1
          archive="$RUNNER_TEMP/islamu-security-tools/k6-v2.3.0-linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz \
            --output "$archive" > "$TMPDIR/k6-provisioning.log" 2>&1
          printf '%s  %s\n' 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1 "$archive" | sha256sum --check --status
          member="k6-v2.3.0-linux-amd64/k6"
          members="$(tar --list --gzip --file "$archive")"
          [[ "$members" == $'k6-v2.3.0-linux-amd64/\nk6-v2.3.0-linux-amd64/k6' ]]
          [[ "$(tar --list --verbose --gzip --file "$archive" -- "$member" | cut -c1)" == '-' ]]
          test ! -e "$ISLAMU_K6_PATH"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/islamu-security-tools" \
            --strip-components=1 --no-same-owner --no-same-permissions -- "$member"
          chmod 700 "$ISLAMU_K6_PATH"
          printf '%s  %s\n' e001bbf39ba67424a85c9c8516440ba5c73ecf7a6021be96c76194380c15f260 "$ISLAMU_K6_PATH" | sha256sum --check --status

      - name: Execute Registered Security Profiles
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        id: security_execution_evidence
        shell: bash
        run: |
          set -euo pipefail
          dotnet eng/release/src/ISLAMU.ReleaseEngineering/bin/Release/net10.0/ISLAMU.ReleaseEngineering.dll execute-security-execution "$TMPDIR/public" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"

      - name: Upload Admitted Public Security Evidence
        if: ${{ success() && steps.changes.outputs.run-tests == 'true' && steps.security_execution_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-test-evidence
          path: ${{ runner.temp }}/islamu-security-private/public/
          if-no-files-found: error
          retention-days: 30

      - name: Write Security Test Evidence Summary
        if: ${{ always() && steps.changes.outputs.run-tests == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PACKET_OUTCOME: ${{ steps.security_execution_evidence.outcome }}
        shell: bash
        run: |
          {
            echo "## Security Test Evidence"
            echo
            echo "Artifact: \`security-test-evidence\`"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | ${EVENT_NAME} |"
            echo "| Ref | ${REF_NAME} |"
            echo "| Commit | ${COMMIT_SHA} |"
            echo "| Execution packet production | ${PACKET_OUTCOME:-not-run} |"
            echo "| Execution scope | Registered API, runtime, browser and load profiles; provider, role and authentication remain not-attested unless independently measured |"
            echo "| Execution packet | \`security-execution.v1.json\` in the admitted public artifact, only after every registered profile and owned cleanup pass |"
            echo "| Reliability inventory | docs/TEST_RELIABILITY.md |"
            echo
            echo "Raw test identities, TRX, configuration and process diagnostics stay private and are never uploaded by this workflow. Failure produces no public artifact."
            echo
            echo "The packet identifies the exact tested GITHUB_SHA, including the PR merge SHA when applicable; it does not relabel that object as a release candidate or attest live operational controls."
            echo "Public validation checks structure and digests under the trusted operator/default-branch boundary. Workflow/run metadata does not authenticate CI origin; required GitHub checks remain separate for the exact final candidate."
            echo
            echo "Repeated scheduled failures require an owner/date entry in docs/TEST_RELIABILITY.md before they are treated as accepted baseline noise."
          } >> "$GITHUB_STEP_SUMMARY"
