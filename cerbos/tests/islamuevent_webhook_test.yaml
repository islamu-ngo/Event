name: WebhookPolicyTests
description: "Validates exact outgoing webhook ownership boundaries"

principals:
  instance_admin:
    id: "instance-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "instance-admin"
      isInstanceAdmin: true
      tenantMemberships: {}
      orgMemberships: {}
      groupMemberships: {}

  tenant_admin:
    id: "tenant-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "tenant-admin"
      isInstanceAdmin: false
      tenantMemberships: { "tenant-1": "admin" }
      orgMemberships: {}
      groupMemberships: {}

  org_admin:
    id: "org-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "org-admin"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: { "org-1": "admin" }
      groupMemberships: {}

  group_admin:
    id: "group-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "group-admin"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}
      groupMemberships: { "group-1": "admin" }

  owning_user:
    id: "subject-user-1"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-1"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}
      groupMemberships: {}

  unrelated_user:
    id: "subject-user-2"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-2"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: { "org-other": "admin" }
      groupMemberships: { "group-other": "admin" }

  incoming_worker:
    id: "incoming-worker"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: { "tenant-1": "admin" }
      orgMemberships: {}
      groupMemberships: {}
      is_machine: true
      scopes: ["internal:webhook:process-incoming"]

resources:
  instance_webhook:
    kind: "islamuevent_webhook"
    id: "instance-consumer"
    attr:
      ownerKindId: 5
      ownerId: "instance-1"
      instanceId: "instance-1"
      consumerId: "instance-consumer"

  tenant_webhook:
    kind: "islamuevent_webhook"
    id: "tenant-consumer"
    attr:
      ownerKindId: 1
      ownerId: "tenant-1"
      tenantId: "tenant-1"
      consumerId: "tenant-consumer"

  org_webhook:
    kind: "islamuevent_webhook"
    id: "org-consumer"
    attr:
      ownerKindId: 2
      ownerId: "org-1"
      tenantId: "tenant-1"
      organizationId: "org-1"
      consumerId: "org-consumer"

  group_webhook:
    kind: "islamuevent_webhook"
    id: "group-consumer"
    attr:
      ownerKindId: 3
      ownerId: "group-1"
      tenantId: "tenant-1"
      groupId: "group-1"
      consumerId: "group-consumer"

  user_webhook:
    kind: "islamuevent_webhook"
    id: "user-consumer"
    attr:
      ownerKindId: 4
      ownerId: "user-1"
      tenantId: "tenant-1"
      userId: "user-1"
      consumerId: "user-consumer"

tests:
  - name: "Instance administrator manages instance-owned webhooks"
    input:
      principals: ["instance_admin"]
      resources: ["instance_webhook"]
      actions: ["webhook:view", "webhook:create", "webhook:update", "webhook:manage-provider", "webhook:view-payload", "webhook:bulk-replay"]
    expected:
      - principal: "instance_admin"
        resource: "instance_webhook"
        actions:
          webhook:view: EFFECT_ALLOW
          webhook:create: EFFECT_ALLOW
          webhook:update: EFFECT_ALLOW
          webhook:manage-provider: EFFECT_ALLOW
          webhook:view-payload: EFFECT_ALLOW
          webhook:bulk-replay: EFFECT_ALLOW

  - name: "Tenant administrator manages only tenant-owned webhooks"
    input:
      principals: ["tenant_admin"]
      resources: ["tenant_webhook", "org_webhook", "group_webhook", "user_webhook", "instance_webhook"]
      actions: ["webhook:view", "webhook:update", "webhook:manage-provider", "webhook:view-payload", "webhook:bulk-replay"]
    expected:
      - principal: "tenant_admin"
        resource: "tenant_webhook"
        actions:
          webhook:view: EFFECT_ALLOW
          webhook:update: EFFECT_ALLOW
          webhook:manage-provider: EFFECT_ALLOW
          webhook:view-payload: EFFECT_ALLOW
          webhook:bulk-replay: EFFECT_ALLOW
      - principal: "tenant_admin"
        resource: "org_webhook"
        actions: &tenant_admin_denied
          webhook:view: EFFECT_DENY
          webhook:update: EFFECT_DENY
          webhook:manage-provider: EFFECT_DENY
          webhook:view-payload: EFFECT_DENY
          webhook:bulk-replay: EFFECT_DENY
      - principal: "tenant_admin"
        resource: "group_webhook"
        actions: *tenant_admin_denied
      - principal: "tenant_admin"
        resource: "user_webhook"
        actions: *tenant_admin_denied
      - principal: "tenant_admin"
        resource: "instance_webhook"
        actions: *tenant_admin_denied

  - name: "Organization and group administrators manage only their exact owner"
    input:
      principals: ["org_admin", "group_admin"]
      resources: ["org_webhook", "group_webhook"]
      actions: ["webhook:view", "webhook:create", "webhook:update", "webhook:delete", "webhook:rotate-secret", "webhook:test", "webhook:pause", "webhook:resume", "webhook:open-provider-portal", "webhook:manage-provider", "webhook:view-payload", "webhook:bulk-replay"]
    expected:
      - principal: "org_admin"
        resource: "org_webhook"
        actions: &delegated_allowed
          webhook:view: EFFECT_ALLOW
          webhook:create: EFFECT_ALLOW
          webhook:update: EFFECT_ALLOW
          webhook:delete: EFFECT_ALLOW
          webhook:rotate-secret: EFFECT_ALLOW
          webhook:test: EFFECT_ALLOW
          webhook:pause: EFFECT_ALLOW
          webhook:resume: EFFECT_ALLOW
          webhook:open-provider-portal: EFFECT_ALLOW
          webhook:manage-provider: EFFECT_DENY
          webhook:view-payload: EFFECT_DENY
          webhook:bulk-replay: EFFECT_DENY
      - principal: "org_admin"
        resource: "group_webhook"
        actions: &delegated_denied
          webhook:view: EFFECT_DENY
          webhook:create: EFFECT_DENY
          webhook:update: EFFECT_DENY
          webhook:delete: EFFECT_DENY
          webhook:rotate-secret: EFFECT_DENY
          webhook:test: EFFECT_DENY
          webhook:pause: EFFECT_DENY
          webhook:resume: EFFECT_DENY
          webhook:open-provider-portal: EFFECT_DENY
          webhook:manage-provider: EFFECT_DENY
          webhook:view-payload: EFFECT_DENY
          webhook:bulk-replay: EFFECT_DENY
      - principal: "group_admin"
        resource: "group_webhook"
        actions: *delegated_allowed
      - principal: "group_admin"
        resource: "org_webhook"
        actions: *delegated_denied

  - name: "User manages only their own user-owned webhook"
    input:
      principals: ["owning_user", "unrelated_user"]
      resources: ["user_webhook"]
      actions: ["webhook:view", "webhook:update", "webhook:open-provider-portal", "webhook:manage-provider", "webhook:view-payload"]
    expected:
      - principal: "owning_user"
        resource: "user_webhook"
        actions:
          webhook:view: EFFECT_ALLOW
          webhook:update: EFFECT_ALLOW
          webhook:open-provider-portal: EFFECT_ALLOW
          webhook:manage-provider: EFFECT_DENY
          webhook:view-payload: EFFECT_DENY
      - principal: "unrelated_user"
        resource: "user_webhook"
        actions:
          webhook:view: EFFECT_DENY
          webhook:update: EFFECT_DENY
          webhook:open-provider-portal: EFFECT_DENY
          webhook:manage-provider: EFFECT_DENY
          webhook:view-payload: EFFECT_DENY

  - name: "Incoming processing requires its dedicated machine scope"
    input:
      principals: ["incoming_worker"]
      resources: ["tenant_webhook"]
      actions: ["webhook:process-incoming", "webhook:redrive-incoming", "webhook:update"]
    expected:
      - principal: "incoming_worker"
        resource: "tenant_webhook"
        actions:
          webhook:process-incoming: EFFECT_ALLOW
          webhook:redrive-incoming: EFFECT_DENY
          webhook:update: EFFECT_DENY
