# Event integration; maintain with configurator-integrate and the Configurator CLI.
$schema: urn:islamu:configurator:authoring:v1
applicationVersions:
- 0.0.0-development
entryPoints:
- environment
- configuration-manifest
- tenant-package
- operator-identity
- legal-drafts
fields:
  configuration-manifest.metadata.name:
    activeWhen:
      field: operation
      op: equals
      value: configuration-manifest
    disclosure: guided
    help: $.metadata.name
    required: true
    sensitivity: sensitive
    title: name
    type: string
  configuration-manifest.spec.instance.settings:
    activeWhen:
      field: operation
      op: equals
      value: configuration-manifest
    disclosure: guided
    help: $.spec.instance.settings; only the host portable catalogue is declared.
    properties:
      appearance.default_theme_mode:
        choices:
        - dark
        - light
        - system
        disclosure: guided
        group: Appearance
        help: 'Default theme mode for tenant or instance scope. Allowed values: system, light, dark'
        sensitivity: public
        title: appearance.default_theme_mode
        type: enum
      branding.custom_css_url:
        disclosure: guided
        group: Branding
        help: Default custom CSS URL applied when tenants do not override branding
        maxLength: 2048
        sensitivity: public
        title: branding.custom_css_url
        type: string
      branding.display_name:
        disclosure: guided
        group: Branding
        help: Default brand display name shown when tenants do not override branding
        maxLength: 200
        sensitivity: public
        title: branding.display_name
        type: string
      branding.favicon_url:
        disclosure: guided
        group: Branding
        help: Default favicon URL shown when tenants do not override branding
        maxLength: 2048
        sensitivity: public
        title: branding.favicon_url
        type: string
      branding.logo_url:
        disclosure: guided
        group: Branding
        help: Default logo URL shown when tenants do not override branding
        maxLength: 2048
        sensitivity: public
        title: branding.logo_url
        type: string
      event_resources.allow_unscanned_documents:
        disclosure: guided
        group: EventResources
        help: Whether unscanned documents may be published and accessed.
        sensitivity: public
        title: event_resources.allow_unscanned_documents
        type: boolean
      event_resources.audit_retention_days:
        disclosure: guided
        group: EventResources
        help: Event-resource management audit retention in days, from zero through 90.
        sensitivity: public
        title: event_resources.audit_retention_days
        type: integer
      event_resources.enabled_audiences:
        consequence: Per-item choices and business rules are validated by Event.
        disclosure: guided
        group: EventResources
        help: Enabled event-resource audience kinds.
        itemType: string
        maxItems: 4096
        sensitivity: public
        title: event_resources.enabled_audiences
        type: list
      event_resources.enabled_delivery_types:
        consequence: Per-item choices and business rules are validated by Event.
        disclosure: guided
        group: EventResources
        help: Enabled event-resource delivery types.
        itemType: string
        maxItems: 4096
        sensitivity: public
        title: event_resources.enabled_delivery_types
        type: list
      event_resources.external_origins:
        consequence: Per-item choices and business rules are validated by Event.
        disclosure: guided
        group: EventResources
        help: Explicitly allowed normalized HTTPS origins for external event resources.
        itemType: string
        maxItems: 4096
        sensitivity: public
        title: event_resources.external_origins
        type: list
      event_resources.max_active_resources:
        disclosure: guided
        group: EventResources
        help: Maximum active event resources per event, from zero through 500.
        sensitivity: public
        title: event_resources.max_active_resources
        type: integer
      event_resources.max_upload_bytes:
        disclosure: guided
        group: EventResources
        help: Maximum event-resource upload size in bytes, further bounded by storage ceilings.
        sensitivity: public
        title: event_resources.max_upload_bytes
        type: integer
      event_resources.permitted_file_types:
        consequence: Per-item choices and business rules are validated by Event.
        disclosure: guided
        group: EventResources
