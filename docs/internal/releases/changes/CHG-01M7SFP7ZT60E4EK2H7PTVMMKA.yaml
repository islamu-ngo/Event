Change-Id: CHG-01M7SFP7ZT60E4EK2H7PTVMMKA
Title: "Retain administrator authority on instance management routes"
Type: fix
Scope: access
Summary: "Annotate exact instance administration controller actions with method-level InstanceManagement metadata so authenticated administrators retain access without a public tenant while ordinary and anonymous callers remain rejected."
Group: instance-management-authority
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/SECURITY_OVERVIEW.md
    Disposition: documented
    Detail: "All 47 action methods across the eight /api/admin/instance/* controllers carry method-level [InstanceManagement] metadata without any class-level exemption. Authorization, tenant resolution, and ordinary/anonymous denials remain enforced on every request."
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: "Instance administrators retain access to /api/admin/instance/* management endpoints in both SingleTenant and MultiTenant deployments before a tenant is public, with no new configuration keys or database grants."
