apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_storage_object"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_storage_object.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage storage objects within their tenant
    - actions: ["view", "create", "update", "delete", "download", "presigned_download"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user

    - actions: ["download", "presigned_download"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            has(request.resource.attr.lifecycleState) &&
            request.resource.attr.lifecycleState == "active" &&
            has(request.resource.attr.visibility) &&
            (
              request.resource.attr.visibility in ["public_image", "authenticated_tenant"] ||
              (
                request.resource.attr.visibility == "private_owner" &&
                has(request.resource.attr.createdBy) &&
                has(request.principal.attr.userId) &&
                request.resource.attr.createdBy == request.principal.attr.userId &&
                (!has(request.principal.attr.is_machine) ||
                 request.principal.attr.is_machine == false)
              )
            )
