<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">ISLAMU typographic logo</title><desc id="desc">Typographic logo with Islamic aligned to the left edge and Software aligned to the right edge of ISLAMU.</desc><rect width="100%" height="100%" fill="#fff"/><defs><style>.text-logo{font-family:&apos;Inter&apos;,&apos;Montserrat&apos;,&apos;Avenir Next&apos;,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#000;dominant-baseline:central}</style></defs><text x="260" y="270" class="text-logo" font-size="120" font-weight="300" letter-spacing="4" text-anchor="start">Islamic</text><text x="260" y="460" class="text-logo" font-size="210" font-weight="800" letter-spacing="34" text-anchor="start">ISLAMU</text><text x="1235" y="650" class="text-logo" font-size="120" font-weight="300" letter-spacing="4" text-anchor="end">Software</text></svg>