name: 📚 Documentation Issue
description: Report stale, missing, confusing, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation should stay source-grounded. If you know the code, config, workflow, or command that proves the correction, include it as a source anchor.

        Maintainers triage documentation reports; accepted corrections are tracked in the project's Plane tracker (Intake) as one documentation item. You never need a Plane account or `EVENT-XXX` ID to report or fix a docs issue.
  - type: input
    id: doc-path
    attributes:
      label: Stale or incorrect doc path
      placeholder: docs/internal/CONTRIBUTING.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
      description: Describe the stale claim, missing step, confusing wording, or broken command.
    validations:
      required: true
  - type: textarea
    id: expected-correction
    attributes:
      label: Expected correction
      description: What should the doc say instead?
    validations:
      required: true
  - type: textarea
    id: source-anchor
    attributes:
      label: Source anchor if known
      description: Link or name the code/config/test/workflow/doc that proves the correction.
      placeholder: src/Explore.API/Program.cs, docker-compose.yml, docs/internal/TESTING.md
  - type: dropdown
    id: affected-audience
    attributes:
      label: Affected audience
      multiple: true
      options:
        - Operators
        - Admins
        - Integrators
        - Contributors
        - AI agents
        - End users
    validations:
      required: true
  - type: textarea
    id: docs-impact
    attributes:
      label: Related docs impact
      description: List other docs that may need the same correction, or write "Unknown".
