# ABOUTME: Public change fragment for the server-authoritative ticketing lifecycle.
# ABOUTME: Records security, migration, OpenAPI, and operator impacts for ticketing.
Change-Id: CHG-01M1VJ1GBNXQPSM1W08EWPM9G9
Title: Events gain governed ticket transfers and fair-return waitlists
Type: feat
Scope: ticketing
Summary: >-
  Organizers can govern ticket purchase limits while attendees receive
  readiness checks, credential-rotating transfers, and fair-return waitlist
  allocation through server-authoritative HAL affordances.
Group: event-ticketing-lifecycle
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API.md
    Disposition: not-applicable
    Detail: >-
      The ticketing routes and generated contracts are additive; no existing
      public ticketing operation is removed or renamed.
  Security:
    Reference: docs/SECURITY-MODEL.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Purchase, readiness, transfer, and waitlist authority is tenant-scoped,
      HAL-gated, private/no-store in the BFF, and protected by stable
      idempotency, row fences, credential rotation, and bounded PII-free output.
  Migration:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Regenerated PostgreSQL, SQLite, SQL Server, MariaDB, and MySQL initial
      migrations include purchase governance, readiness, transfer, fair-return
      supply, waitlist, orchestration, and outbox state. Development databases
      based on the prior unapplied initial migration must be recreated.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
    Detail: >-
      The lifecycle introduces no secret, connection, or operator-owned
      configuration keys.
  OpenAPI:
    Reference: docs/API.md
    Disposition: documented
    Detail: >-
      The canonical OpenAPI document, contract inventory, and generated Blazor
      client include purchase-governance, readiness, transfer, and fair-return
      waitlist operations.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Quartz owns fair-return orchestration and exposes bounded health and
      telemetry; operators do not run a separate timer service or manual
      allocation path.
