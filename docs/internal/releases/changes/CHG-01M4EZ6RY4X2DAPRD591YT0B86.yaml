Change-Id: CHG-01M4EZ6RY4X2DAPRD591YT0B86
Title: "Keep management, audit and export metadata private until final delivery"
Type: fix
Scope: access
Summary: "Prevent prepared management pages, audit entries and metadata exports from surviving revocation before serialization. Native management reads return private single-use projections with current row and attachment qualification. Audit disclosure binds retention and earliest entry expiry; exports recheck download decisions before releasing derived links. Native consumers must use Projection.DiscloseAsync instead of Value. HTTP routes and response shapes remain unchanged; moderation activation remains incomplete."
