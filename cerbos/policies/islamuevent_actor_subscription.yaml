apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_actor_subscription"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_actor_subscription.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage subscriptions within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Authenticated users can reach self-service handlers; handlers enforce ownership.
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
