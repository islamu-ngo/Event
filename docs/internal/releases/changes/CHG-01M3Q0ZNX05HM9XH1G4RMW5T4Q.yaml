  Migration:
    Reference: docs/internal/SETUP_ASSISTANT_ARCHITECTURE.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/public/self-hosting/setup-assistant.md
    Disposition: documented
    Detail: Host the static bundle on one origin with WebAssembly MIME types and application-route fallback; no instance configuration is added.
  OpenAPI:
    Reference: docs/internal/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/self-hosting/setup-assistant.md
