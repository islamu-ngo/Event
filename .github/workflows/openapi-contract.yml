# ABOUTME: Validates that governed OpenAPI and generated API client artifacts are current.
# ABOUTME: Regenerates openapi/client outputs for relevant API-surface changes and fails on drift.

name: OpenAPI Contract Guard

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "37 4 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-contract:
    name: OpenAPI Contract Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect OpenAPI-Relevant Changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: running full OpenAPI guard." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base_sha="${{ github.event.merge_group.base_sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          fi

          if [ -z "$base_sha" ]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "${GITHUB_SHA:-HEAD}" || true)"
          relevant_files="$(printf '%s\n' "$changed_files" | grep -E '^(src/Explore\.API/.*\.(cs|csproj|json)$|src/Explore\.Application/.*\.cs$|src/Explore\.Domain/.*\.cs$|tests/Event\.API\.IntegrationTests/.*\.(cs|csproj)$|tests/Explore\.GeneratedContracts\.Tests/.*\.(cs|csproj)$|eng/tools/Explore\.GeneratedContracts/.*|eng/tools/Explore\.ApiContractInventory/.*|src/Explore\.Blazor\.Client/(nswag\.json|Explore\.Blazor\.Client\.csproj|Clients/EventApiClient\.g\.cs)$|schemas/openapi_islamu-event\.json$|docs/(internal/)?API_CONTRACT_INVENTORY\.md$|docs/(internal/)?API_CONTRACT_TEST_DEBT\.md$|docs/(internal/)?API_CHANGELOG\.md$|Directory\.Packages\.props$|dotnet-tools\.json$|global\.json$|\.ci/spectral\.yaml$|\.ci/scripts/validate-api-contract-skip-inventory\.cs$|\.github/workflows/openapi-contract\.yml$)' || true)"

          if [ -n "$relevant_files" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            {
              echo "## OpenAPI Contract Guard"
              echo
              echo "Relevant changes detected; regenerating governed OpenAPI artifacts."
              echo
              echo '```text'
              printf '%s\n' "$relevant_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            {
              echo "## OpenAPI Contract Guard"
              echo
              echo "No OpenAPI-relevant changes detected; guard passed without regeneration."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup .NET
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet restore --locked-mode

      - name: Restore .NET Tools
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet tool restore

      - name: Validate API Contract Skip Inventory
        if: steps.changes.outputs.relevant == 'true'
        env:
          RestorePackagesWithLockFile: "false"
        run: |
          rm -f .ci/scripts/packages.lock.json
          dotnet run .ci/scripts/validate-api-contract-skip-inventory.cs -- .

      - name: Generate OpenAPI Document
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet build src/Explore.API/Explore.API.csproj --configuration Release --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Build API Contract Tests
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet build tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Run Stable OpenAPI Invariants
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet run --project tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --no-build -- --treenode-filter "/*/*/*/OpenApiDocument_*" --minimum-expected-tests 5 --no-progress --report-trx --report-trx-filename openapi-invariants.trx

      - name: Regenerate API Contract Inventory
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet run --project eng/tools/Explore.ApiContractInventory/Explore.ApiContractInventory.csproj --configuration Release --no-build

      - name: Regenerate Blazor API Client
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet build src/Explore.Blazor.Client/Explore.Blazor.Client.csproj --configuration Release --no-restore --verbosity quiet -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Check Generated Contract Drift
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inventory_path="docs/API_CONTRACT_INVENTORY.md"
          if [ -f "docs/internal/API_CONTRACT_INVENTORY.md" ]; then
            inventory_path="docs/internal/API_CONTRACT_INVENTORY.md"
          fi

          git diff -- schemas/openapi_islamu-event.json "$inventory_path" src/Explore.Blazor.Client/Clients/EventApiTagClients.g.cs > artifacts/openapi-contract/generated-contract.diff
          cp schemas/openapi_islamu-event.json artifacts/openapi-contract/openapi.json
          cp "$inventory_path" artifacts/openapi-contract/API_CONTRACT_INVENTORY.md
          cp src/Explore.Blazor.Client/Clients/EventApiTagClients.g.cs artifacts/openapi-contract/EventApiTagClients.g.cs

          if [ -e schemas/openapi.json ] || [ -e src/schemas/openapi_event-api.json ]; then
            echo "Unexpected legacy OpenAPI artifacts exist!" >&2
            exit 1
          fi

          if git diff --quiet -- schemas/openapi_islamu-event.json "$inventory_path" src/Explore.Blazor.Client/Clients/EventApiTagClients.g.cs; then
            {
              echo "## OpenAPI Contract Drift"
              echo
              echo "No generated OpenAPI/client drift detected after regeneration."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## OpenAPI Contract Drift"
              echo
              echo "Generated OpenAPI artifacts are stale. Build Explore.API and Explore.Blazor.Client locally, then commit:"
              echo
              echo "- \`schemas/openapi_islamu-event.json\`"
              echo "- \`$inventory_path\`"
              echo "- \`src/Explore.Blazor.Client/Clients/EventApiTagClients.g.cs\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Generate OpenAPI Breaking-Change Report
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          OASDIFF_VERSION: "1.18.1"
          OASDIFF_LINUX_AMD64_SHA256: "5174ba660d559684e67e8ab44ca6d45919114f8c57de5a1e32b91d4e5347705d"
        run: |
          set -euo pipefail
          mkdir -p artifacts/openapi-contract .tools/oasdiff

          curl -fsSL \
            -o .tools/oasdiff/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_LINUX_AMD64_SHA256}  .tools/oasdiff/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf .tools/oasdiff/oasdiff.tar.gz -C .tools/oasdiff

          base_sha=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base_sha" ]; then
            base_sha="HEAD~1"
          fi

          if ! git show "${base_sha}:schemas/openapi_islamu-event.json" > artifacts/openapi-contract/base-openapi.json 2>/dev/null; then
            if ! git show "${base_sha}:schemas/openapi.json" > artifacts/openapi-contract/base-openapi.json 2>/dev/null; then
              {
                echo "## Advisory OpenAPI Breaking-Change Report"
                echo
                echo "Base OpenAPI artifact was not available at \`${base_sha}\`; advisory oasdiff report was skipped."
              } >> "$GITHUB_STEP_SUMMARY"
              printf 'Base OpenAPI artifact was not available at %s.\n' "$base_sha" > artifacts/openapi-contract/oasdiff-breaking.md
              exit 0
            fi
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          changelog_changed=false
          if printf '%s\n' "$changed_files" | grep -E -qx 'docs/(internal/)?API_CHANGELOG.md'; then
            changelog_changed=true
          fi

          enforce_changelog=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            enforce_changelog=false
          fi

          if .tools/oasdiff/oasdiff breaking \
            --allow-external-refs=false \
            --fail-on ERR \
            --format markdown \
            artifacts/openapi-contract/base-openapi.json \
            schemas/openapi_islamu-event.json \
            > artifacts/openapi-contract/oasdiff-breaking.md; then
            markdown_exit=0
          else
            markdown_exit=$?
          fi

          if .tools/oasdiff/oasdiff breaking \
            --allow-external-refs=false \
            --fail-on ERR \
            --format json \
            artifacts/openapi-contract/base-openapi.json \
            schemas/openapi_islamu-event.json \
            > artifacts/openapi-contract/oasdiff-breaking.json; then
            json_exit=0
          else
            json_exit=$?
          fi

          breaking_detected=false
          if [ "$markdown_exit" -ne 0 ] || [ "$json_exit" -ne 0 ]; then
            breaking_detected=true
          fi

          {
            echo "## OpenAPI Breaking-Change Report"
            echo
            echo "Generated oasdiff reports against base \`${base_sha}\`."
            echo
            echo "- Markdown: \`artifacts/openapi-contract/oasdiff-breaking.md\`"
            echo "- JSON: \`artifacts/openapi-contract/oasdiff-breaking.json\`"
            echo "- Breaking changes detected: \`${breaking_detected}\`"
            echo "- API changelog changed: \`${changelog_changed}\`"
            echo
            echo "Breaking changes fail PR/push/merge-queue runs unless \`docs/API_CHANGELOG.md\` changes in the same diff. Scheduled and manual runs remain evidence-only."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$breaking_detected" = "true" ] && [ "$enforce_changelog" = "true" ] && [ "$changelog_changed" != "true" ]; then
            echo "OpenAPI breaking changes were detected without a docs/API_CHANGELOG.md update." >&2
            exit 1
          fi

      - name: Generate Advisory OpenAPI Spectral Lint Report
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        env:
          SPECTRAL_VERSION: "6.16.0"
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: |
          set -euo pipefail
          mkdir -p artifacts/openapi-contract

          if npx --yes "@stoplight/spectral-cli@${SPECTRAL_VERSION}" lint \
            schemas/openapi_islamu-event.json \
            --quiet \
            --ruleset .ci/spectral.yaml \
            --format json \
            --output artifacts/openapi-contract/spectral-openapi.json; then
            json_exit=0
          else
            json_exit=$?
          fi

          if npx --yes "@stoplight/spectral-cli@${SPECTRAL_VERSION}" lint \
            schemas/openapi_islamu-event.json \
            --quiet \
            --ruleset .ci/spectral.yaml \
            --format markdown \
            --output artifacts/openapi-contract/spectral-openapi.md; then
            markdown_exit=0
          else
            markdown_exit=$?
          fi

          {
            echo "## Advisory OpenAPI Spectral Lint"
            echo
            echo "Generated advisory Spectral reports using \`@stoplight/spectral-cli@${SPECTRAL_VERSION}\`."
            echo
            echo "- Ruleset: \`.ci/spectral.yaml\`"
            echo "- JSON: \`artifacts/openapi-contract/spectral-openapi.json\` (exit ${json_exit})"
            echo "- Markdown: \`artifacts/openapi-contract/spectral-openapi.md\` (exit ${markdown_exit})"
            echo
            echo "Findings are retained for review but are not blocking until the lint policy is promoted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify OpenAPI Determinism
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet build src/Explore.API/Explore.API.csproj --configuration Release --no-restore --verbosity quiet -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Verify API Contract Inventory Determinism
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet run --project eng/tools/Explore.ApiContractInventory/Explore.ApiContractInventory.csproj --configuration Release --no-build

      - name: Verify Client Determinism
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet build src/Explore.Blazor.Client/Explore.Blazor.Client.csproj --configuration Release --no-restore --verbosity quiet -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Check Deterministic Second Run
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inventory_path="docs/API_CONTRACT_INVENTORY.md"
          if [ -f "docs/internal/API_CONTRACT_INVENTORY.md" ]; then
            inventory_path="docs/internal/API_CONTRACT_INVENTORY.md"
          fi

          git diff -- schemas/openapi_islamu-event.json "$inventory_path" src/Explore.Blazor.Client/Clients/EventApiTagClients.g.cs > artifacts/openapi-contract/determinism.diff

          if [ -e schemas/openapi.json ] || [ -e src/schemas/openapi_event-api.json ]; then
            echo "Unexpected legacy OpenAPI artifacts exist after deterministic rebuild: schemas/openapi.json or src/schemas/openapi_event-api.json" >&2
            exit 1
          fi

          if git diff --quiet -- schemas/openapi_islamu-event.json "$inventory_path" src/Explore.Blazor.Client/Clients/EventApiTagClients.g.cs; then
            {
              echo "## OpenAPI Determinism"
              echo
              echo "Second regeneration run produced zero diff."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## OpenAPI Determinism"
              echo
              echo "Second regeneration run produced drift; inspect \`determinism.diff\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload OpenAPI Guard Artifacts
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-contract-guard
          path: |
            artifacts/openapi-contract/**
            **/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30
