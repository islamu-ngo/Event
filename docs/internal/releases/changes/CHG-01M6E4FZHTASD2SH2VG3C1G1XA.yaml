Change-Id: CHG-01M6E4FZHTASD2SH2VG3C1G1XA
Title: "Keep recognition cleanup under its original transaction owners"
Type: fix
Scope: privacy
Summary: "Run recognition expiry and lifecycle cleanup once under their original native owners instead of allowing provider retries to reject or replay manual transactions."
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/PRIVACY_ERASURE.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/PRIVACY_ERASURE.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Enter a zero-retry execution scope before acquiring retained-authority and
      primary transactions. Reject replaying outer scopes, preserve borrowed
      SQLite ownership and never infer success from an uncertain commit.
  Migration:
    Reference: docs/internal/BACKUP_RESTORE_UPGRADE.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/internal/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/privacy-erasure.md
    Disposition: documented
    Detail: >-
      Independent stores do not form one atomic transaction. Preserve retained
      authority when investigating uncertain completion. Expired purge receipts
      remain removable without contacting an unavailable external authority.
