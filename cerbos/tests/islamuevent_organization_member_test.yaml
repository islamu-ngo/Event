name: OrganizationMemberPolicyTests
description: "Validates organization_member resource policies across admin hierarchy levels"

principals:
  islamuevent_instance_admin:
    id: "user-instance-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: true
      tenantMemberships: {}
      orgMemberships: {}

  islamuevent_tenant_admin:
    id: "user-tenant-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-1": "admin"
      orgMemberships: {}

  islamuevent_org_admin:
    id: "user-org-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships:
        "org-1": "admin"

  regular_user:
    id: "user-regular"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

resources:
  member_in_org1:
    kind: "islamuevent_organization_member"
    id: "member-1"
    attr:
      tenantId: "tenant-1"
      organizationId: "org-1"
      userId: "user-1"

tests:
  - name: "Instance admin has full access to org members"
    input:
      principals: ["islamuevent_instance_admin"]
      resources: ["member_in_org1"]
      actions: ["view", "create", "update", "delete", "manage_members"]
    expected:
      - principal: "islamuevent_instance_admin"
        resource: "member_in_org1"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          manage_members: EFFECT_ALLOW

  - name: "Tenant admin can manage org members within their tenant"
    input:
      principals: ["islamuevent_tenant_admin"]
      resources: ["member_in_org1"]
      actions: ["view", "create", "update", "delete", "manage_members"]
    expected:
      - principal: "islamuevent_tenant_admin"
        resource: "member_in_org1"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          manage_members: EFFECT_ALLOW

  - name: "Org admin can manage members and use manage_members action"
    input:
      principals: ["islamuevent_org_admin"]
      resources: ["member_in_org1"]
      actions: ["view", "create", "update", "delete", "manage_members"]
    expected:
      - principal: "islamuevent_org_admin"
        resource: "member_in_org1"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          manage_members: EFFECT_ALLOW

  - name: "Regular user cannot view or manage org members"
    input:
      principals: ["regular_user"]
      resources: ["member_in_org1"]
      actions: ["view", "create", "update", "delete", "manage_members"]
    expected:
      - principal: "regular_user"
        resource: "member_in_org1"
        actions:
          view: EFFECT_DENY
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          manage_members: EFFECT_DENY
