Title: "Retain native instance authority when exporting moderation definitions"
Type: fix
Scope: access
Summary: "Allow the selected configuration-import owner to export governed definitions only while its original human credential and persisted instance-administrator authority remain valid, without retargeting the request tenant or widening database permissions."
