name: Workflow Security

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.25.2"

jobs:
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect workflow-security-relevant changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          base_sha=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            base_sha="${{ github.event.merge_group.base_sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          if [[ -z "$changed_files" ]]; then
            echo "run-scan=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine changed files; running workflow security validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant_files=""
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .github/workflows/*|.ci/*|.github/dependabot.yml|docs/CI_CD_GOVERNANCE.md|src/Explore.API/Dockerfile|src/Explore.Blazor/Dockerfile|src/Event.Standalone/Dockerfile)
                relevant_files="${relevant_files}${changed_file}"$'\n'
                ;;
            esac
          done <<< "$changed_files"

          if [[ -n "$relevant_files" ]]; then
            echo "run-scan=true" >> "$GITHUB_OUTPUT"
            {
              echo "Workflow security validation will run for:"
              echo '```'
              printf '%s' "$relevant_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run-scan=false" >> "$GITHUB_OUTPUT"
            echo "No workflow security inputs changed; reporting intentional no-op pass." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup .NET
        if: ${{ steps.changes.outputs.run-scan == 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate action pin maintenance policy
        if: ${{ steps.changes.outputs.run-scan == 'true' }}
        env:
          RestorePackagesWithLockFile: "false"
        shell: bash
        run: |
          set -euo pipefail
          dotnet run .ci/scripts/validate-action-pins.cs -- .github/workflows
          dotnet run .ci/scripts/validate-dependabot-policy.cs -- .github/dependabot.yml
          dotnet run .ci/scripts/validate-dockerfile-base-images.cs -- src/Explore.API/Dockerfile src/Explore.Blazor/Dockerfile
          dotnet run .ci/scripts/validate-workflow-cache-policy.cs -- .github/workflows
          dotnet run .ci/scripts/validate-deploy-workflow-contract.cs

      - name: Install actionlint
        if: ${{ steps.changes.outputs.run-scan == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/actionlint workflow-security-results
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo ".tools/${archive}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  .tools/${archive}" | sha256sum -c -
          tar -xzf ".tools/${archive}" -C .tools/actionlint actionlint
          .tools/actionlint/actionlint -version | tee workflow-security-results/actionlint-version.txt

      - name: Run actionlint
        if: ${{ steps.changes.outputs.run-scan == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          .tools/actionlint/actionlint -format '{{json .}}' .github/workflows/*.yml > workflow-security-results/actionlint.json
          .tools/actionlint/actionlint .github/workflows/*.yml | tee workflow-security-results/actionlint.txt
          {
            echo "## actionlint"
            echo "Workflow syntax and GitHub Actions expression linting passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install zizmor
        if: ${{ steps.changes.outputs.run-scan == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .tools/zizmor-venv
          .tools/zizmor-venv/bin/python -m pip install --upgrade pip
          .tools/zizmor-venv/bin/python -m pip install "zizmor==${ZIZMOR_VERSION}"
          .tools/zizmor-venv/bin/zizmor --version | tee workflow-security-results/zizmor-version.txt

      - name: Run zizmor
        if: ${{ steps.changes.outputs.run-scan == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .tools/zizmor-venv/bin/zizmor --offline --min-severity medium --format sarif .github/workflows > workflow-security-results/zizmor.sarif
          sarif_exit=$?
          .tools/zizmor-venv/bin/zizmor --offline --min-severity medium .github/workflows > workflow-security-results/zizmor.txt
          text_exit=$?
          set -e
          {
            echo "## zizmor"
            echo "zizmor completed with SARIF exit code ${sarif_exit} and text exit code ${text_exit}."
            echo "Medium-or-higher workflow security findings fail this check."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$sarif_exit" -ne 0 || "$text_exit" -ne 0 ]]; then
            exit 1
          fi

      - name: No-Op for Non-Workflow Changes
        if: ${{ steps.changes.outputs.run-scan != 'true' }}
        shell: bash
        run: |
          {
            echo "## Workflow Security"
            echo "No workflow security inputs changed. The required check is intentionally passing without scanning."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow security evidence
        if: ${{ always() && steps.changes.outputs.run-scan == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-security-evidence
          path: workflow-security-results/
          retention-days: 30
