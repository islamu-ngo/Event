Title: "Recheck current user ownership before machine resource disclosure"
Type: fix
Scope: access
Summary: "User-owned machine resource requests now require a current nondeleted user and active, nondeleted membership in the credential's exact tenant. Fresh source reads before preparation and terminal delivery reject owner or membership removal even when the same API key remains active. Preserve distinct machine identity and repair coordinate-switch fixtures to use real qualified alternative owners. Other owner kinds and complete moderation consumer registration remain open."
