    Detail: "Retain original human, tenant, command and physical-transaction custody through provider settlement. Accept Event revision successors only from successful native saves; reject changed authority and unrelated Event business writes."
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
