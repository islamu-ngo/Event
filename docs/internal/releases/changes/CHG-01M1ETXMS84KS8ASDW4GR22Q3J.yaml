# ABOUTME: Public change fragment for authority-qualified provider account keys.
# ABOUTME: Records the breaking removal of mutable-attribute and raw-key matching.
Change-Id: CHG-01M1ETXMS84KS8ASDW4GR22Q3J
Title: "Authority-qualified provider account keys"
Type: feat
Scope: self-hosting
Summary: "Provider accounts are matched only by an authority-qualified key: normalized OIDC issuer with exact subject, or an authoritative verified ATProto DID."
Group: headless-instance-onboarding
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/SECURITY-MODEL.md
    Disposition: documented
    Detail: >-
      Email, username, role, handle, and session-id matching are removed, and
      no raw-key fallback path remains. Accounts that were previously resolved
      by a mutable attribute must be re-linked through their authority.
  Security:
    Reference: docs/SECURITY_OVERVIEW.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Account resolution binds to an issuer-scoped immutable identifier, which
      closes cross-authority collisions and rebound-handle impersonation.
      Failures stay value-free and never echo the presented identifier.
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: documented
    Detail: >-
      Existing links are re-keyed to the authority-qualified form; links that
      lack a normalized issuer and subject or a verified DID are not carried
      forward and must be established again by their owner.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Each configured provider must supply its authority identity so keys can
      be qualified; providers without one are rejected at startup.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Provider identity is described by the qualified key contract; the change
      is pre-release breaking and generated clients must be regenerated.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Confirm provider issuer identities before upgrading, then verify that
      administrator sign-in resolves to the expected account.
