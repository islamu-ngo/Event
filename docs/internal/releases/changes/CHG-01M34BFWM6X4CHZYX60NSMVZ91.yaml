# Records the reviewed Keycloak repair operation HTTP contract.
# Documents receipt authority, credential nonretention, and manual recovery.
Change-Id: CHG-01M34BFWM6X4CHZYX60NSMVZ91
Title: require approved receipts for Keycloak repairs
Type: feat
Scope: onboarding
Summary: Replace broad Keycloak bootstrap and sync repair requests with private, receipt-bound operator operations.
Group: keycloak-operator-safety
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/API_CHANGELOG.md
    Disposition: documented
    Detail: Keycloak repairs use approved operation receipts instead of unrestricted bootstrap or sync requests.
  Security:
    Reference: docs/internal/SECURITY-MODEL.md
    Disposition: documented
    Detail: Every request rechecks setup-or-instance-administrator authority; advanced-form credentials are request-scoped and receipts contain no credentials.
  Migration:
    Reference: docs/internal/BACKUP_RESTORE_UPGRADE.md
    Disposition: not-applicable
    Detail: This HTTP operation contract adds no migration in this phase.
  Configuration:
    Reference: docs/internal/CONFIGURATION.md
    Disposition: not-applicable
    Detail: The routes use existing selected Keycloak deployment binding and add no configuration key.
  OpenAPI:
    Reference: docs/internal/API.md
    Disposition: documented
    Detail: Seven private routes expose connection, inspect, plan, receipt, apply, inspect-only reconciliation, and cancellation operations.
  Operator:
    Reference: docs/public/documentation/readme/configuration-and-operations/authentication-providers.md
    Disposition: documented
    Detail: Receipts expire after 15 minutes; unknown or partial outcomes require inspection, with no automatic retry or rollback.
