# ABOUTME: Public change fragment for the ATProtocol Jetstream v2 federated ingestion migration.
# ABOUTME: Records configuration, operator, migration, and security impacts of the v2 consumer.
Change-Id: CHG-01M1VJ10ET59QH3KZKDTTKZJ9W
Title: Federated event ingestion runs on Jetstream v2
Type: feat
Scope: federation
Summary: >-
  Community calendar events and RSVPs are ingested through the Jetstream v2
  consumer, which resumes on sequence numbers, recovers from an expired cursor,
  retires records when an upstream account is deleted, and reports its own
  ingestion latency and connectivity.
Group: federation-jetstream-v2
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: No public API, HAL relation, or generated-client surface changes.
  Security:
    Reference: docs/SECURITY-MODEL.md
    Disposition: documented
    Detail: >-
      Records sourced from the sealed archive are used only to decide which
      repositories to reconcile; content is still fetched from the PDS and
      verified against its signed commit and Merkle search tree, because archive
      rows carry no signed commit chain. Deleted upstream accounts have their
      inbound records tombstoned and hidden, and locally authored outbound
      records are never affected by a remote account signal.
  Migration:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      The persisted consumer cursor now stores a Jetstream v2 sequence number
      instead of a microsecond timestamp. The two are different number spaces, so
      an existing cursor value must be reset to zero before the consumer starts;
      no schema change is required.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Atproto:Jetstream:Endpoint defaults to the unversioned v2 host and must not
      point at a numbered v1 instance. Optional EnableCompression,
      ArchiveProbeMaximumBlocks, and ArchiveProbeDownloadConcurrency settings
      bound transport compression and sealed-archive scanning.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: No operations, schemas, or generated client methods change.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Readiness now degrades when ingestion is enabled but holds no open
      subscription beyond its reconnect budget, instead of reporting healthy
      whenever the capability is configured. Operators can watch
      atproto.jetstream.ingest_latency, atproto.jetstream.connected, and
      atproto.jetstream.cursor, and a consumer dropped as too slow is logged at
      error level rather than retried silently.
