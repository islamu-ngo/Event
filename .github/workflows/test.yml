name: "Build & Test"

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-build-test-changes:
    name: Detect Build/Test-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
      run-app-tests: ${{ steps.changes.outputs.run-app-tests }}
      run-domain-tests: ${{ steps.changes.outputs.run-domain-tests }}
      run-architecture-tests: ${{ steps.changes.outputs.run-architecture-tests }}
      run-setup-tests: ${{ steps.changes.outputs.run-setup-tests }}
      run-infrastructure-tests: ${{ steps.changes.outputs.run-infrastructure-tests }}
      run-blazor-tests: ${{ steps.changes.outputs.run-blazor-tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "eng/release/**/packages.lock.json"

      - name: Build Native Selection
        run: |
          dotnet restore eng/release/src/ISLAMU.ReleaseEngineering/ISLAMU.ReleaseEngineering.csproj --locked-mode
          dotnet build eng/release/src/ISLAMU.ReleaseEngineering/ISLAMU.ReleaseEngineering.csproj --configuration Release --no-restore --verbosity quiet --nologo

      - name: Detect Build/Test-Relevant Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="HEAD~1"
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" && -n "$MERGE_GROUP_BASE_SHA" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          changed_paths="$RUNNER_TEMP/build-test-changed-paths.txt"
          if ! git diff --name-only --no-renames "$base_sha" "$GITHUB_SHA" > "$changed_paths"; then
            : > "$changed_paths"
          fi
          selection="$(dotnet eng/release/src/ISLAMU.ReleaseEngineering/bin/Release/net10.0/ISLAMU.ReleaseEngineering.dll select-build-test-changes "$changed_paths")"
          declare -A decisions=()
          any_lane=false
          while IFS='=' read -r key value; do
            case "$key" in
              run-tests|run-app-tests|run-domain-tests|run-architecture-tests|run-setup-tests|run-infrastructure-tests|run-blazor-tests) ;;
              *) echo "Invalid native selection key" >&2; exit 1 ;;
            esac
            if [[ "$value" != true && "$value" != false ]] || [[ -v "decisions[$key]" ]]; then
              echo "Invalid or duplicate native selection decision" >&2
              exit 1
            fi
            decisions[$key]="$value"
            if [[ "$key" != run-tests && "$value" == true ]]; then any_lane=true; fi
          done <<< "$selection"
          if [[ "${#decisions[@]}" != 7 || "${decisions[run-tests]}" != "$any_lane" ]]; then
            echo "Incomplete or inconsistent native selection" >&2
            exit 1
          fi
          printf '%s\n' "$selection" >> "$GITHUB_OUTPUT"
          {
            echo "## Build & Test Native Routing"
            echo
            echo '```text'
            printf '%s\n' "$selection"
            echo '```'
            echo "Only known public Markdown can skip; ambiguous detection runs every lane."
          } >> "$GITHUB_STEP_SUMMARY"

  run-tests:
    needs: detect-build-test-changes
    uses: ./.github/workflows/_build-test.yml
    secrets:
      CODECOV_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CODECOV_TOKEN || github.event.pull_request.head.repo.full_name == github.repository && secrets.CODECOV_TOKEN || '' }}
    with:
      collect-coverage: true
      run-fast-tests: ${{ needs.detect-build-test-changes.outputs.run-tests == 'true' }}
      run-app-tests: ${{ needs.detect-build-test-changes.outputs.run-app-tests == 'true' }}
      run-domain-tests: ${{ needs.detect-build-test-changes.outputs.run-domain-tests == 'true' }}
      run-architecture-tests: ${{ needs.detect-build-test-changes.outputs.run-architecture-tests == 'true' }}
      run-setup-tests: ${{ needs.detect-build-test-changes.outputs.run-setup-tests == 'true' }}
      run-infrastructure-tests: ${{ needs.detect-build-test-changes.outputs.run-infrastructure-tests == 'true' }}
      run-blazor-tests: ${{ needs.detect-build-test-changes.outputs.run-blazor-tests == 'true' }}
      run-integration-tests: false
      configuration: Release
