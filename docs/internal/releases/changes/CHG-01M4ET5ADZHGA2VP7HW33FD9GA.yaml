Title: "Recheck resource authority before releasing private preparations"
Type: fix
Scope: access
Summary: "Recheck current native resource and attachment authority in a fresh transaction before releasing prepared file content or redirect destinations. Discard private preparations after revocation, changed provider input or failed qualification; retain cancellation, deadlines and single-use ownership without activating incomplete moderation coverage."
