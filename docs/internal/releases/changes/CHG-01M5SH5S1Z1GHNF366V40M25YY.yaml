Title: "Bind serving inputs and retain startup failures"
Type: fix
Scope: self-hosting
Summary: "Bind private assurance observations to owning projects and explicitly selected asset manifests while retaining original startup failures alongside independent host cleanup failures."
Group: managed-serving-inputs
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/API_CHANGELOG.md
    Disposition: not-applicable
