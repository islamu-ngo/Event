      events.organization_submission_enabled:
        disclosure: guided
        group: Events
        help: Whether organizations are allowed to submit events
        sensitivity: public
        title: events.organization_submission_enabled
        type: boolean
      events.require_approval:
        disclosure: guided
        group: Events
        help: Whether events require admin approval before publishing
        sensitivity: public
        title: events.require_approval
        type: boolean
      events.user_submission_enabled:
        disclosure: guided
        group: Events
        help: Whether tenant users are allowed to submit events
        sensitivity: public
        title: events.user_submission_enabled
        type: boolean
      footer.lock_tenant_copyright:
        disclosure: guided
        group: Footer
        help: When true, tenants cannot override the footer copyright text
