Title: "Keep authorization current during membership and tenant-status changes"
Type: fix
Scope: access
Summary: "Coordinate membership removal and tenant-status transitions in C# before observing authorization or beginning a transaction, retaining the original owner's custody through atomic settlement."
Group: human-source-producer-coordination
