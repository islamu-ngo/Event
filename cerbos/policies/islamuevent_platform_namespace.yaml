apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_platform_namespace"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_platform_namespace.json
  rules:
    # Instance admins are the only role that can write to the platform namespace
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # All authenticated users can view platform namespace definitions
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user

    # Explicit deny for tenant/org admins attempting to write to platform namespace.
    # This rule is defensive — Cerbos is default-deny — but makes the intent explicit.
    - actions: ["create", "update", "delete"]
      effect: EFFECT_DENY
      derivedRoles:
        - islamuevent_tenant_admin
        - islamuevent_org_admin
