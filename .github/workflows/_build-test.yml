# ABOUTME: Reusable build/test workflow for Release restore, audit, format, build, and project test lanes.
# ABOUTME: Supports intentional no-op execution so required caller checks remain always present.

name: "Build & Test (Reusable)"

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      run-integration-tests:
        required: false
        type: boolean
        default: false
      run-fast-tests:
        required: false
        type: boolean
        default: true
      run-app-tests:
        required: false
        type: boolean
        default: true
      run-domain-tests:
        required: false
        type: boolean
        default: true
      run-architecture-tests:
        required: false
        type: boolean
        default: true
      run-setup-tests:
        required: false
        type: boolean
        default: true
      run-infrastructure-tests:
        required: false
        type: boolean
        default: true
      run-blazor-tests:
        required: false
        type: boolean
        default: true
      run-secrets-tests:
        required: false
        type: boolean
        default: true
      configuration:
        required: false
        type: string
        default: "Release"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CONFIGURATION: ${{ inputs.configuration }}

    steps:
      - name: No-Op for Non-Code Changes
        if: ${{ ! inputs.run-fast-tests }}
        run: |
          {
            echo "## Fast Build/Test"
            echo
            echo "No build/test-relevant changes were detected by the caller workflow."
            echo "This required check is intentionally passing without restore, build, or test execution."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ inputs.run-fast-tests }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        if: ${{ inputs.run-fast-tests }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        if: ${{ inputs.run-fast-tests }}
        run: dotnet restore --locked-mode

      - name: Check Setup Assistant Ratchets
        if: ${{ inputs.run-fast-tests }}
        run: |
          dotnet run eng/setup-assistant/GenerateSetupAssistantRatchets.cs -- --check
          dotnet run --project eng/setup-assistant/EnvironmentCatalogueGenerator/EnvironmentCatalogueGenerator.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore -- --check
          dotnet run --project eng/setup-assistant/SetupCliCommandSchemaGenerator/SetupCliCommandSchemaGenerator.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore -- --check

      - name: Restore .NET Tools
        if: ${{ inputs.run-fast-tests }}
        run: dotnet tool restore

      - name: NuGet Security Audit
        if: ${{ inputs.run-fast-tests }}
        env:
          RestorePackagesWithLockFile: "false"
        run: |
          mkdir -p artifacts/dependencies
          dotnet list Explore.slnx package --vulnerable --include-transitive --format json --output-version 1 --no-restore > artifacts/dependencies/nuget-vulnerabilities.json
          rm -f .ci/scripts/packages.lock.json
          NUGET_VULNERABILITY_SUMMARY_PATH="artifacts/dependencies/nuget-vulnerability-summary.md" dotnet run .ci/scripts/validate-nuget-vulnerabilities.cs -- artifacts/dependencies/nuget-vulnerabilities.json

      - name: Dependency License Policy Audit
        if: ${{ inputs.run-fast-tests }}
        env:
          RestorePackagesWithLockFile: "false"
        run: |
          rm -f .ci/scripts/packages.lock.json
          dotnet run .ci/scripts/validate-dependency-license-policy.cs -- .

      - name: Audited Terminal.Gui Package Gate
        if: ${{ inputs.run-fast-tests && inputs.run-setup-tests }}
        env:
          RestorePackagesWithLockFile: "false"
        run: bash eng/release/dependencies/terminal-gui/BuildTerminalGuiPackage.sh --check

      - name: Linting Check
        if: ${{ inputs.run-fast-tests }}
        run: dotnet format whitespace --verify-no-changes --verbosity minimal

      - name: Build
        if: ${{ inputs.run-fast-tests }}
        run: |
          set -o pipefail
          mkdir -p artifacts/build
          dotnet build --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false 2>&1 | tee artifacts/build/fast-build.log

      - name: Setup Project Gates
        if: ${{ inputs.run-fast-tests && inputs.run-setup-tests }}
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/Event.Setup.Core.Tests/Event.Setup.Core.Tests.csproj \
            tests/Event.SetupAssistant.Tests/Event.SetupAssistant.Tests.csproj \
            tests/Event.SetupAssistant.Browser.Tests/Event.SetupAssistant.Browser.Tests.csproj \
            tests/Event.SetupAssistant.Desktop.Tests/Event.SetupAssistant.Desktop.Tests.csproj \
            tests/Event.SetupAssistant.Cli.Tests/Event.SetupAssistant.Cli.Tests.csproj \
            tests/Event.SetupAssistant.Terminal.Tests/Event.SetupAssistant.Terminal.Tests.csproj
          do
            dotnet build "$project" --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal
            dotnet test --project "$project" --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --minimum-expected-tests 1 --no-progress
          done
          dotnet test --project tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
            --treenode-filter "/*/*/*SetupLiveAuthoritySecurityTests/*" \
            --minimum-expected-tests 35 --maximum-parallel-tests 1 --no-progress \
            --report-trx --report-trx-filename SetupLiveAuthoritySecurityTests.trx

      - name: Unit Tests — Application
        if: ${{ inputs.run-fast-tests && inputs.run-app-tests }}
        id: test_application
        run: dotnet test --project tests/Event.Application.UnitTests/Event.Application.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Application.UnitTests.trx

      - name: Unit Tests — Domain
        if: ${{ inputs.run-fast-tests && inputs.run-domain-tests }}
        id: test_domain
        run: dotnet test --project tests/Event.Domain.UnitTests/Event.Domain.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Domain.UnitTests.trx

      - name: Architecture Tests
        if: ${{ inputs.run-fast-tests && inputs.run-architecture-tests }}
        id: test_architecture
        run: dotnet test --project tests/Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Architecture.Tests.trx

      - name: Unit Tests — Secrets
        if: ${{ inputs.run-fast-tests && inputs.run-secrets-tests }}
        id: test_secrets
        run: dotnet test --project tests/Explore.Secrets.UnitTests/Explore.Secrets.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Secrets.UnitTests.trx

      - name: Unit Tests — Infrastructure
        if: ${{ inputs.run-fast-tests && inputs.run-infrastructure-tests }}
        id: test_infrastructure
        run: dotnet test --project tests/Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Infrastructure.Tests.trx --treenode-filter "/*/*/*/*[Category!=Runtime]" --minimum-expected-tests 1

      - name: Blazor Client Tests
        if: ${{ inputs.run-fast-tests && inputs.run-blazor-tests }}
        id: test_blazor_client
        run: dotnet test --project tests/Explore.Blazor.Client.Tests/Explore.Blazor.Client.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Blazor.Client.Tests.trx

      - name: Blazor Integration Tests
        if: ${{ inputs.run-fast-tests && inputs.run-blazor-tests }}
        id: test_blazor_integration
        run: dotnet test --project tests/Explore.Blazor.IntegrationTests/Explore.Blazor.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Blazor.IntegrationTests.trx

      - name: Wire Contract Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_wire_contracts
        run: dotnet test --project tests/Event.Wire.Contracts.UnitTests/Event.Wire.Contracts.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Wire.Contracts.UnitTests.trx

      - name: Generated Contract Tooling Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_generated_contracts
        run: dotnet test --project tests/Explore.GeneratedContracts.Tests/Explore.GeneratedContracts.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.GeneratedContracts.Tests.trx

      - name: Diagnostic Command Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_diagnostic
        run: dotnet test --project tests/Explore.Diagnostic.UnitTests/Explore.Diagnostic.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Diagnostic.UnitTests.trx

      - name: Standalone Host Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_standalone
        run: dotnet test --project tests/Event.Standalone.IntegrationTests/Event.Standalone.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Standalone.IntegrationTests.trx

      - name: Upload Test Results
        if: ${{ always() && inputs.run-fast-tests }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-fast
          path: |
            '**/TestResults/**/*.trx'
            artifacts/build/fast-build.log
            artifacts/dependencies/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write Test Evidence Summary
        if: ${{ always() && inputs.run-fast-tests }}
        env:
          APPLICATION_OUTCOME: ${{ steps.test_application.outcome }}
          DOMAIN_OUTCOME: ${{ steps.test_domain.outcome }}
          ARCHITECTURE_OUTCOME: ${{ steps.test_architecture.outcome }}
          SECRETS_OUTCOME: ${{ steps.test_secrets.outcome }}
          INFRASTRUCTURE_OUTCOME: ${{ steps.test_infrastructure.outcome }}
          BLAZOR_CLIENT_OUTCOME: ${{ steps.test_blazor_client.outcome }}
          BLAZOR_INTEGRATION_OUTCOME: ${{ steps.test_blazor_integration.outcome }}
          WIRE_OUTCOME: ${{ steps.test_wire_contracts.outcome }}
          GENERATED_OUTCOME: ${{ steps.test_generated_contracts.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.test_diagnostic.outcome }}
          STANDALONE_OUTCOME: ${{ steps.test_standalone.outcome }}
        run: |
          {
            echo "## Fast Test Evidence"
            echo
            echo "TRX/build artifact: \`test-results-fast\`"
            echo "Build log: \`artifacts/build/fast-build.log\`"
            echo
            echo "| Project | Step outcome |"
            echo "|---|---|"
            echo "| Event.Application.UnitTests | ${APPLICATION_OUTCOME:-not-run} |"
            echo "| Event.Domain.UnitTests | ${DOMAIN_OUTCOME:-not-run} |"
            echo "| Event.Architecture.Tests | ${ARCHITECTURE_OUTCOME:-not-run} |"
            echo "| Explore.Secrets.UnitTests | ${SECRETS_OUTCOME:-not-run} |"
            echo "| Explore.Infrastructure.Tests | ${INFRASTRUCTURE_OUTCOME:-not-run} |"
            echo "| Explore.Blazor.Client.Tests | ${BLAZOR_CLIENT_OUTCOME:-not-run} |"
            echo "| Explore.Blazor.IntegrationTests | ${BLAZOR_INTEGRATION_OUTCOME:-not-run} |"
            echo "| Event.Wire.Contracts.UnitTests | ${WIRE_OUTCOME:-not-run} |"
            echo "| Explore.GeneratedContracts.Tests | ${GENERATED_OUTCOME:-not-run} |"
            echo "| Explore.Diagnostic.UnitTests | ${DIAGNOSTIC_OUTCOME:-not-run} |"
            echo "| Event.Standalone.IntegrationTests | ${STANDALONE_OUTCOME:-not-run} |"
            echo
            echo "Inspect the uploaded \`test-results-fast\` artifact for project-specific TRX files and build/analyzer warning output."
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Integration Tests
    if: ${{ inputs.run-fast-tests && inputs.run-integration-tests }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CONFIGURATION: ${{ inputs.configuration }}
      PrivacyErasure__Authority__Topology: EmbeddedSqlite
      PrivacyErasureAuthorityEmbedded__WriterReplicaCount: "1"
      PrivacyErasureAuthorityEmbedded__BusyTimeoutSeconds: "30"

    services:
      postgres:
        image: postgres:16.14@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: event_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Configure Embedded Authority File
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/database/integration
          echo "PrivacyErasureAuthorityEmbedded__Path=${RUNNER_TEMP}/privacy-erasure-authority-integration.db" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Build
        run: |
          set -o pipefail
          mkdir -p artifacts/build
          dotnet build --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false 2>&1 | tee artifacts/build/integration-build.log

      - name: Persistence Integration Tests
        id: test_persistence_integration
        run: dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Persistence.IntegrationTests.trx
        env:
          Database__Provider: PostgreSql
          Database__Host: localhost
          Database__Port: "5432"
          Database__Database: event_test
          Database__TlsMode: Disabled
          Database__TrustServerCertificate: "false"
          Database__Runtime__Username: postgres
          Database__Runtime__Password: password

      - name: API Integration Tests
        id: test_api_integration
        shell: bash
        run: |
          set -euo pipefail
          SETUP_SECRET="$(openssl rand -hex 32)"
          KEYCLOAK_BLAZOR_CLIENT_SECRET="$(openssl rand -hex 32)"
          export SETUP_SECRET KEYCLOAK_BLAZOR_CLIENT_SECRET
          echo "::add-mask::$SETUP_SECRET"
          echo "::add-mask::$KEYCLOAK_BLAZOR_CLIENT_SECRET"
          dotnet test --project tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.API.IntegrationTests.trx
        env:
          Database__Provider: PostgreSql
          Database__Host: localhost
          Database__Port: "5432"
          Database__Database: event_test
          Database__TlsMode: Disabled
          Database__TrustServerCertificate: "false"
          Database__Runtime__Username: postgres
          Database__Runtime__Password: password

      - name: Infrastructure Email Runtime Tests
        id: test_infrastructure_email
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/runtime
          dotnet test --project tests/Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Infrastructure.Tests.Email.trx --treenode-filter "/*/*/*/*[Category=Email]" --minimum-expected-tests 1 2>&1 | tee artifacts/runtime/infrastructure-email.log

      - name: Infrastructure RabbitMQ Runtime Tests
        id: test_infrastructure_rabbitmq
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/runtime
          dotnet test --project tests/Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Infrastructure.Tests.RabbitMQ.trx --treenode-filter "/*/*/*/*[Category=RabbitMQ]" --minimum-expected-tests 1 2>&1 | tee artifacts/runtime/infrastructure-rabbitmq.log

      - name: Capture Runtime Container Diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime/docker

          docker ps -a > artifacts/runtime/docker/containers.txt || true
          docker images > artifacts/runtime/docker/images.txt || true

          while read -r container_id container_name; do
            [ -n "$container_id" ] || continue
            safe_name="${container_name//[^A-Za-z0-9_.-]/-}"
            docker logs "$container_id" > "artifacts/runtime/docker/${safe_name}.log" 2>&1 || true
          done < <(docker ps -a --format '{{.ID}} {{.Names}}' || true)

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration
          path: |
            '**/TestResults/**/*.trx'
            artifacts/build/integration-build.log
            artifacts/runtime/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write Integration Test Evidence Summary
        if: always()
        env:
          PERSISTENCE_OUTCOME: ${{ steps.test_persistence_integration.outcome }}
          API_OUTCOME: ${{ steps.test_api_integration.outcome }}
          INFRASTRUCTURE_EMAIL_OUTCOME: ${{ steps.test_infrastructure_email.outcome }}
          INFRASTRUCTURE_RABBITMQ_OUTCOME: ${{ steps.test_infrastructure_rabbitmq.outcome }}
        run: |
          {
            echo "## Integration Test Evidence"
            echo
            echo "TRX/build artifact: \`test-results-integration\`"
            echo "Build log: \`artifacts/build/integration-build.log\`"
            echo
            echo "| Project | Step outcome |"
            echo "|---|---|"
            echo "| Event.Persistence.IntegrationTests | ${PERSISTENCE_OUTCOME:-not-run} |"
            echo "| Event.API.IntegrationTests | ${API_OUTCOME:-not-run} |"
            echo "| Explore.Infrastructure.Tests Email | ${INFRASTRUCTURE_EMAIL_OUTCOME:-not-run} |"
            echo "| Explore.Infrastructure.Tests RabbitMQ | ${INFRASTRUCTURE_RABBITMQ_OUTCOME:-not-run} |"
            echo
            echo "Inspect the uploaded \`test-results-integration\` artifact for project-specific TRX files, runtime command logs, container diagnostics, and build/analyzer warning output."
          } >> "$GITHUB_STEP_SUMMARY"

  database-provider-matrix:
    name: Database Provider (${{ matrix.provider }})
    if: ${{ inputs.run-fast-tests && inputs.run-integration-tests }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: PostgreSql
            engine_image: postgres:16.14@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
            database: event_mdb
            port: "5432"
            username: event
            password: EventCi2026_Strong
            tls_mode: Disabled
            trust_server_certificate: "false"
            server_flavor: ""
            server_version: ""
            email_dispatch_mode: Quartz
            health_options: >-
              --health-cmd "pg_isready -U event -d event_mdb"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 20
          - provider: Sqlite
            engine_image: host file-backed SQLite
            database: artifacts/database/Sqlite/event-mdb.sqlite3
            port: ""
            username: ""
            password: ""
            tls_mode: Prefer
            trust_server_certificate: "false"
            server_flavor: ""
            server_version: ""
            email_dispatch_mode: Quartz
            health_options: ""
          - provider: SqlServer
            engine_image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04@sha256:b1395aa51b4ec39981883560f1379ea9eba2a1c0719bf8e6477902769316bb79
            database: event_mdb
            port: "1433"
            username: sa
            password: EventCi2026_Strong
            tls_mode: Required
            trust_server_certificate: "true"
            server_flavor: ""
            server_version: ""
            email_dispatch_mode: HostedService
            health_options: >-
              --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P EventCi2026_Strong -Q 'SELECT 1' -b -o /dev/null"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 30
              --health-start-period 20s
          - provider: MariaDb
            engine_image: mariadb:11.4.12@sha256:a6ee0e234c527de59d6a1924703e5512e7a762c74616a443ec9c729b3a9c5154
            database: event_mdb
            port: "3306"
            username: event
            password: EventCi2026_Strong
            tls_mode: Disabled
            trust_server_certificate: "false"
            server_flavor: MariaDb
            server_version: 11.4.12
            email_dispatch_mode: HostedService
            health_options: >-
              --health-cmd "healthcheck.sh --connect --innodb_initialized"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 20
          - provider: MySql
            engine_image: mysql:8.4.6@sha256:c296d65ee6ab3ce2f608c1d1b2bdd3c08b087a5834101d76a6db2e00875216cc
            database: event_mdb
            port: "3306"
            username: event
            password: EventCi2026_Strong
            tls_mode: Disabled
            trust_server_certificate: "false"
            server_flavor: MySql
            server_version: 8.4.6
            email_dispatch_mode: HostedService
            health_options: >-
              --health-cmd "MYSQL_PWD=\"$MYSQL_PASSWORD\" mysqladmin --protocol=tcp --host=127.0.0.1 --user=\"$MYSQL_USER\" --silent status"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 20

    env:
      DOTNET_CONFIGURATION: ${{ inputs.configuration }}
      DOTNET_ENVIRONMENT: Production
      Database__Provider: ${{ matrix.provider }}
      Database__Host: ${{ matrix.provider != 'Sqlite' && 'localhost' || '' }}
      Database__Port: ${{ matrix.port }}
      Database__Database: ${{ matrix.database }}
      Database__TlsMode: ${{ matrix.tls_mode }}
      Database__TrustServerCertificate: ${{ matrix.trust_server_certificate }}
      Database__ServerFlavor: ${{ matrix.server_flavor }}
      Database__ServerVersion: ${{ matrix.server_version }}
      Database__Runtime__Username: ${{ matrix.username }}
      Database__Runtime__Password: ${{ matrix.password }}
      Database__Migrator__Username: ${{ matrix.username }}
      Database__Migrator__Password: ${{ matrix.password }}
      PrivacyErasure__Authority__Topology: EmbeddedSqlite
      PrivacyErasureAuthorityEmbedded__WriterReplicaCount: "1"
      PrivacyErasureAuthorityEmbedded__BusyTimeoutSeconds: "30"
      EmailDispatchProcessor__Mode: ${{ matrix.email_dispatch_mode }}

    services:
      database:
        image: ${{ matrix.provider == 'PostgreSql' && 'postgres:16.14@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4' || matrix.provider == 'SqlServer' && 'mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04@sha256:b1395aa51b4ec39981883560f1379ea9eba2a1c0719bf8e6477902769316bb79' || matrix.provider == 'MariaDb' && 'mariadb:11.4.12@sha256:a6ee0e234c527de59d6a1924703e5512e7a762c74616a443ec9c729b3a9c5154' || matrix.provider == 'MySql' && 'mysql:8.4.6@sha256:c296d65ee6ab3ce2f608c1d1b2bdd3c08b087a5834101d76a6db2e00875216cc' || '' }}
        env:
          POSTGRES_USER: ${{ matrix.username }}
          POSTGRES_PASSWORD: ${{ matrix.password }}
          POSTGRES_DB: ${{ matrix.database }}
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ matrix.password }}
          MARIADB_DATABASE: ${{ matrix.database }}
          MARIADB_USER: ${{ matrix.username }}
          MARIADB_PASSWORD: ${{ matrix.password }}
          MARIADB_ROOT_PASSWORD: ${{ matrix.password }}
          MYSQL_DATABASE: ${{ matrix.database }}
          MYSQL_USER: ${{ matrix.username }}
          MYSQL_PASSWORD: ${{ matrix.password }}
          MYSQL_ROOT_PASSWORD: ${{ matrix.password }}
        ports:
          - 5432:5432
          - 1433:1433
          - 3306:3306
        options: ${{ matrix.health_options }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Configure Isolated SQLite Files
        shell: bash
        run: |
          set -euo pipefail
          echo "PrivacyErasureAuthorityEmbedded__Path=${RUNNER_TEMP}/privacy-erasure-authority.db" >> "$GITHUB_ENV"
          if [ "${{ matrix.provider }}" = "Sqlite" ]; then
            echo "Database__Database=${RUNNER_TEMP}/event-mdb.sqlite3" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build Migration And Behavior Projects
        run: |
          dotnet build src/Event.MigrationService/Event.MigrationService.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false
          dotnet build tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Create SQL Server Database
        if: ${{ matrix.provider == 'SqlServer' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.database.id }}" /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "$Database__Migrator__Password" \
            -Q "IF DB_ID(N'event_mdb') IS NULL CREATE DATABASE [event_mdb]" -b

      - name: Apply Clean And Idempotent Migrations
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/database/${{ matrix.provider }}"
          dotnet run --project src/Event.MigrationService/Event.MigrationService.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --no-launch-profile \
            2>&1 | tee "artifacts/database/${{ matrix.provider }}/migration-clean.log"
          dotnet run --project src/Event.MigrationService/Event.MigrationService.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --no-launch-profile \
            2>&1 | tee "artifacts/database/${{ matrix.provider }}/migration-idempotent.log"

      - name: Verify Embedded Authority File Isolation
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PrivacyErasureAuthorityEmbedded__Path"
          stat --printf='authority-bytes=%s\n' "$PrivacyErasureAuthorityEmbedded__Path" \
            > "artifacts/database/${{ matrix.provider }}/sqlite-files.txt"
          if [ "${{ matrix.provider }}" = "Sqlite" ]; then
            test -s "$Database__Database"
            test "$Database__Database" != "$PrivacyErasureAuthorityEmbedded__Path"
            stat --printf='primary-bytes=%s\n' "$Database__Database" \
              >> "artifacts/database/${{ matrix.provider }}/sqlite-files.txt"
          fi

      - name: Run Provider Runtime Smoke
        id: runtime_smoke
        run: >-
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj
          --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal --
          --treenode-filter "/*/*/PrimaryDatabaseRuntimeSmokeTests/*"
          --minimum-expected-tests 1 --no-progress --maximum-parallel-tests 1
          --report-trx --report-trx-filename Event.Persistence.IntegrationTests.${{ matrix.provider }}.Smoke.trx

      - name: Run Provider Behavior Contract
        id: behavior_contract
        run: >-
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj
          --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal --
          --treenode-filter "/*/*/PrimaryDatabaseProviderBehaviorContractTests/*"
          --minimum-expected-tests 2 --no-progress --maximum-parallel-tests 1
          --report-trx --report-trx-filename Event.Persistence.IntegrationTests.${{ matrix.provider }}.Behavior.trx

      - name: Run Secret Binding Provider Contract
        id: secret_binding_contract
        run: >-
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj
          --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal --
          --treenode-filter "/*/*/SecretBindingProviderContractTests/*"
          --minimum-expected-tests 1 --no-progress --maximum-parallel-tests 1
          --report-trx --report-trx-filename Event.Persistence.IntegrationTests.${{ matrix.provider }}.SecretBinding.trx

      - name: Capture Database Service Diagnostics
        if: ${{ always() && matrix.provider != 'Sqlite' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/database/${{ matrix.provider }}"
          docker ps -a > "artifacts/database/${{ matrix.provider }}/containers.txt" || true
          docker logs "${{ job.services.database.id }}" > "artifacts/database/${{ matrix.provider }}/service.log" 2>&1 || true

      - name: Upload Provider Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-provider-${{ matrix.provider }}
          path: |
            '**/TestResults/**/*.trx'
            artifacts/database/${{ matrix.provider }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Write Provider Evidence Summary
        if: always()
        env:
          MIGRATION_OUTCOME: ${{ steps.migrations.outcome }}
          RUNTIME_SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior_contract.outcome }}
        run: |
          {
            echo "## Database Provider: ${{ matrix.provider }}"
            echo
            echo "- Engine image: \`${{ matrix.engine_image }}\`"
            echo "- TLS mode: \`${{ matrix.tls_mode }}\`; trust server certificate: \`${{ matrix.trust_server_certificate }}\`"
            echo "- Email dispatch mode: \`${{ matrix.email_dispatch_mode }}\`"
            echo "- Clean + idempotent migrations: \`${MIGRATION_OUTCOME:-not-run}\`"
            echo "- Runtime smoke: \`${RUNTIME_SMOKE_OUTCOME:-not-run}\`"
            echo "- Behavior contract: \`${BEHAVIOR_OUTCOME:-not-run}\`"
            echo "- Evidence artifact: \`database-provider-${{ matrix.provider }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
