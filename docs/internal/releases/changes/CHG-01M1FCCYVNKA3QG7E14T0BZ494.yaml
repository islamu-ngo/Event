# ABOUTME: Public change fragment for the fail-closed Setup Live control-plane foundation.
# ABOUTME: Records ephemeral enrollment and write-only binding contracts without release activation.
Change-Id: CHG-01M1FCCYVNKA3QG7E14T0BZ494
Title: "Fail-closed Setup Live control-plane foundation"
Type: feat
Scope: self-hosting
Summary: "Setup Live adds tenant-scoped ephemeral enrollment and write-only secret binding while every release capability remains disabled."
Group: setup-assistant-live-control-plane
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Private Setup Live contracts require fresh target-bound authority,
      generation fencing, UUIDv7 operation identities, and server HAL
      affordances; no compatibility adapter is provided.
  Security:
    Reference: docs/SECRETS.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Capabilities remain in memory, provider coordinates and raw values are
      never returned, and binding failure cannot fall back to another source.
  Migration:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      Setup Live is not an application-data or secret migration mechanism and
      remains unavailable as a deployable target.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      The generated release manifest keeps target, enrollment, readiness,
      write, and saved-profile capabilities false.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: "Authoritative private API and generated-client contracts are recorded."
  Operator:
    Reference: docs/TROUBLESHOOTING.md
    Disposition: documented
    Detail: >-
      Recovery revokes enrollment, clears client memory, repairs the selected
      authority, and creates fresh authority without secret readback.
