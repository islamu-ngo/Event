Change-Id: CHG-01M7SFP866A6PYJ9Z6WFHRYFQ7
Title: "Read instance provider-configuration secret bindings via global contract"
Type: fix
Scope: onboarding
Summary: "Route instance-scoped provider-configuration secret binding lookups through an independent Global-pool reader backed by PostgresProviderConfigurationContract instead of direct Runtime secret_bindings table reads."
Group: provider-configuration-secret-reader
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/SECURITY_OVERVIEW.md
    Disposition: documented
    Detail: "Instance-scoped keys in ProviderConfigurationState.SecretKeys read from PostgresProviderConfigurationContract via IProviderConfigurationSecretBindingReader on the independent Global pool. Direct Runtime access to secret_bindings stays denied (PostgreSQL 42501), and tenant-scoped or other secret keys remain isolated."
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: "Unauthenticated provider-configuration discovery endpoints read saved Keycloak and Google client binding references via the Global reader without granting Runtime direct table access to secret_bindings."
