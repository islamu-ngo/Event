      `update`, `delete`. `read` is public. `create`/`update`/`delete` require role
      `AnnouncementManager`. Ensure `cerbos-policy-check` workflow passes and that
      `AuthorizationParityTests` reflects the new resource.
    expected_must_reads:
      - "AGENTS.md"
      - "docs/QUICK_REFERENCE.md"
      - "docs/SECURITY-MODEL.md"
      - "docs/AUTHORIZATION.md"
      - ".agents/skills/auth-patterns/SKILL.md"
    expected_paths_in_scope:
      - "cerbos/**/*.yaml"
      - "Event.Architecture.Tests/**/*AuthorizationParityTests*.cs"
    expected_verification_commands:
      - "dotnet build --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --verbosity quiet"
    acceptance_criteria:
      - "New Cerbos resource policy YAML validates against Cerbos schema."
      - "`read` is allowed for anonymous callers."
      - "`create`/`update`/`delete` require role `AnnouncementManager`."
      - "`AuthorizationParityTests` lists the new resource."
      - "No existing policies weakened."

  - id: external-infrastructure-bootstrap
    intent_id: external-infrastructure-bootstrap
    summary: |
      Add a setup-time bootstrap flow for an existing external identity provider without storing admin credentials.
    prompt: |
      Add a setup-time bootstrap flow for an existing Keycloak deployment. The operator provides
      a Keycloak base URL, target realm, Blazor client ID/secret, and a one-time temporary admin
      credential. The server must patch or create only ISLAMU-owned clients/scopes, persist only
      runtime OIDC configuration, refresh BFF auth schemes after success, and never store the
      temporary admin credential or raw Keycloak Admin API responses.
    expected_must_reads:
      - "AGENTS.md"
      - "docs/QUICK_REFERENCE.md"
      - "docs/SECURITY-MODEL.md"
      - "docs/SECRETS.md"
      - "docs/CONFIGURATION.md"
      - "docs/SELF_HOSTING.md"
      - ".agents/rules/api-controllers.md"
      - ".agents/rules/blazor-server.md"
      - ".agents/skills/auth-patterns/SKILL.md"
      - ".agents/skills/blazor-bff-patterns/SKILL.md"
      - ".agents/skills/clean-architecture-rules/SKILL.md"
    expected_paths_in_scope:
      - "docker-compose.yml"
      - "docker/**"
      - "Explore.Application/Contracts/Services/**/*.cs"
      - "Explore.Application/DTOs/Onboarding/**/*.cs"
      - "Explore.Application/Features/InstanceOnboarding/**/*.cs"
      - "Explore.Infrastructure/Services/**/*.cs"
      - "Explore.API/Controllers/**/*Onboarding*.cs"
      - "Explore.Blazor/**/*.cs"
      - "Explore.Blazor.Client/**/*.razor"
      - "docs/SELF_HOSTING.md"
      - "docs/CONFIGURATION.md"
      - "docs/SECRETS.md"
      - "docs/TROUBLESHOOTING.md"
    expected_verification_commands:
      - "dotnet build --configuration Release --verbosity quiet"
      - "dotnet test --project Event.Application.UnitTests/Event.Application.UnitTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project Explore.Blazor.IntegrationTests/Explore.Blazor.IntegrationTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project Explore.Blazor.Client.Tests/Explore.Blazor.Client.Tests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --verbosity quiet"
    acceptance_criteria:
      - "Application owns DTOs, commands, validators, and service contracts; Infrastructure owns provider HTTP/Admin API details."
      - "The one-time admin credential is passed only through the active request/job and is never persisted or returned."
      - "BFF setup-secret forwarding strips browser-supplied privileged headers and forwards only trusted resolver output."
      - "Provider mutation is additive/idempotent and does not delete existing realms, users, groups, or unrelated clients."
      - "Auth schemes refresh only after successful runtime OIDC configuration persistence."
      - "Docs describe secret ownership, rerun behavior, backup requirements, and safe troubleshooting evidence."

  - id: webhook-delivery-redesign
    intent_id: webhook-delivery-redesign
    summary: |
      Redesign webhook delivery across all layers without compatibility shims or new messaging infrastructure.
    prompt: |
      Implement the approved webhook delivery redesign across Domain, Application, Persistence,
      Infrastructure, API/HAL, the Blazor BFF/client, generated contracts, and operational docs.
      PostgreSQL `bytea` exact bytes must be the stored, hashed, signed, idempotency, and transmitted
      authority; normalized webhook lookups must expose stable Id, Code, and Name values. Remove the
      obsolete compatibility fields and legacy request authority instead of adding aliases, dual writes,
      or fallbacks. Do not introduce Redis, RabbitMQ, Kafka, CDC, or another proxy. Verify every changed
      layer and prove that UI actions follow server-issued HAL links only.
    expected_must_reads:
      - "AGENTS.md"
      - "docs/QUICK_REFERENCE.md"
      - "docs/ARCHITECTURE.md"
      - "docs/WEBHOOKS.md"
      - "docs/SECURITY-MODEL.md"
      - "docs/API.md"
      - "docs/BLAZOR.md"
      - "dev/active/webhook-delivery-redesign/webhook-delivery-redesign-context.md"
      - "dev/active/webhook-delivery-redesign/webhook-delivery-redesign-plan.md"
      - "dev/active/webhook-delivery-redesign/webhook-delivery-redesign-tasks.md"
      - ".agents/rules/domain.md"
      - ".agents/rules/application-layer.md"
      - ".agents/rules/efcore-persistence.md"
      - ".agents/rules/efcore-migrations.md"
      - ".agents/rules/api-controllers.md"
      - ".agents/rules/api-hateoas.md"
      - ".agents/rules/blazor-server.md"
      - ".agents/rules/blazor-client.md"
      - ".agents/skills/clean-architecture-rules/SKILL.md"
      - ".agents/skills/outbox-pattern/SKILL.md"
      - ".agents/skills/auth-patterns/SKILL.md"
    expected_paths_in_scope:
      - "src/Explore.Domain/**/*Webhook*.cs"
      - "src/Explore.Application/**/Webhooks/**/*.cs"
      - "src/Explore.Persistence/**/*Webhook*.cs"
      - "src/Explore.Persistence/Migrations/**/*.cs"
      - "src/Explore.Infrastructure/**/*Webhook*.cs"
      - "src/Explore.API/**/*Webhook*.cs"
      - "src/Explore.Blazor/**/*Webhook*.cs"
      - "src/Explore.Blazor.Client/**/*Webhook*"
      - "src/Explore.Blazor.Client/Clients/EventApiClient.g.cs"
      - "tests/**/*Webhook*.cs"
      - "schemas/openapi_islamu-event.json"
      - "schemas/islamu-event.md"
      - "docs/WEBHOOKS.md"
      - "dev/active/webhook-delivery-redesign/**"
    expected_paths_forbidden:
      - "dev/next/**"
      - "dev/report/**"
      - "src/Explore.Application/Features/ControlPlane/**"
      - "src/Explore.API/Hateoas/**/*ControlPlane*.cs"
      - "src/Explore.Blazor.Client/**/*ControlPlane*"
    expected_verification_commands:
      - "dotnet build --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.Domain.UnitTests/Event.Domain.UnitTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.Application.UnitTests/Event.Application.UnitTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Explore.Blazor.IntegrationTests/Explore.Blazor.IntegrationTests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Explore.Blazor.Client.Tests/Explore.Blazor.Client.Tests.csproj --configuration Release --verbosity quiet"
      - "dotnet test --project tests/Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --verbosity quiet"
    acceptance_criteria:
      - "The request classifies as `webhook-delivery-redesign`, not a single-layer endpoint, migration, or UI intent."
      - "Stored, hashed, signed, idempotency, and transmitted payload bytes are identical; a one-byte change conflicts."
      - "Webhook lookup DTOs expose normalized Id, Code, and Name values with enum, seeder, migration, and database parity."
      - "Removed compatibility fields, aliases, fallback authority, and dual writes are absent rather than deprecated."
      - "Inbound settlement and durable effects are transactional, tenant-bound, idempotent, and recoverable after interruption."
      - "Ambiguous provider acceptance reconciles through proven lookup or stops for manual action; it never guesses success."
      - "Repositories return entities, handlers map DTOs, validators are manually instantiated, and tenant filters stay active."
      - "API authorization emits HAL affordances and Blazor renders operational actions only when those links are present."
      - "Cross-layer verification executes nonzero tests without adding new webhook messaging infrastructure."

