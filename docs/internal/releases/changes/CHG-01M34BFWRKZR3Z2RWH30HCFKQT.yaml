# Records create-only Keycloak provisioning and deployment credential ownership.
# Documents removal of broad synchronization and application-managed rotation.
Change-Id: CHG-01M34BFWRKZR3Z2RWH30HCFKQT
Title: make Keycloak provisioning create-only
Type: feat
Scope: onboarding
Summary: Replace broad Keycloak lifecycle endpoints with reviewed create-only operations and deployment-owned credential guidance.
Group: keycloak-operator-onboarding
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/API_CHANGELOG.md
    Disposition: documented
    Detail: Legacy Keycloak bootstrap, realm-wide sync and application-managed secret rotation routes are removed; runtime credentials remain deployment-owned.
  Security:
    Reference: docs/internal/AUTHENTICATION.md
    Disposition: documented
    Detail: Fresh absence checks, exact receipt bindings and captured provider identities prevent resource adoption, replay and broad mutation.
  Migration:
    Reference: docs/internal/BACKUP_RESTORE_UPGRADE.md
    Disposition: not-applicable
    Detail: The operation model reuses the existing credential-free receipt storage and requires no schema migration.
  Configuration:
    Reference: docs/internal/CONFIGURATION.md
    Disposition: documented
    Detail: PublicBaseUrl supplies trusted callback derivation and the selected secret authority remains the only BFF credential source.
  OpenAPI:
    Reference: docs/internal/API_CHANGELOG.md
    Disposition: documented
    Detail: Planning requires a closed intent and the retired bootstrap, sync and rotation routes and DTOs are removed.
  Operator:
    Reference: docs/public/documentation/readme/configuration-and-operations/authentication-providers.md
    Disposition: documented
    Detail: Operators coordinate secret rotation externally, restart replicas, inspect the binding and verify a fresh sign-in.
