name: Performance Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "50 4 * * 4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare private execution directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/islamu-performance-private"
          TMPDIR="$(readlink --canonicalize-existing -- "$RUNNER_TEMP/islamu-performance-private")"
          mkdir -p "$TMPDIR/artifacts"
          chmod 700 "$TMPDIR" "$TMPDIR/artifacts"
          test "$(stat -c %u "$TMPDIR")" = "$(id -u)"
          test ! -L "$TMPDIR"
          [[ "$DOCKER_HOST" == unix:///* ]]
          socket="$(readlink --canonicalize-existing -- "${DOCKER_HOST#unix://}")"
          test -S "$socket"
          {
            printf 'TMPDIR=%s\n' "$TMPDIR"
            printf 'DOCKER_HOST=unix://%s\n' "$socket"
          } >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build benchmarks
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/Event.Benchmarks/Event.Benchmarks.csproj \
            --configuration Release --no-restore --verbosity quiet --nologo -m:1 -nr:false \
            -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true

      - name: Cache the declared PostgreSQL image
        shell: bash
        run: |
          set -euo pipefail
          docker --host "$DOCKER_HOST" pull postgres:18-alpine > "$TMPDIR/postgres-provision.log" 2>&1

      - name: Run BenchmarkDotNet dry smoke suite
        id: performance_smoke
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          ISLAMU_TEST_RUN_ID="$(openssl rand -hex 16)"
          ISLAMU_TEST_ROOT="$TMPDIR/islamu-assurance/$ISLAMU_TEST_RUN_ID"
          mkdir -p "$ISLAMU_TEST_ROOT"
          chmod 700 "$TMPDIR/islamu-assurance" "$ISLAMU_TEST_ROOT"
          printf '%s' "$ISLAMU_TEST_RUN_ID" > "$ISLAMU_TEST_ROOT/.islamu-test-owner"
          chmod 600 "$ISLAMU_TEST_ROOT/.islamu-test-owner"

          cleanup() {
            containers="$(docker --host "$DOCKER_HOST" ps -aq --filter "label=islamu.assurance.owner=$ISLAMU_TEST_RUN_ID" 2>/dev/null || true)"
            if [[ -n "$containers" ]]; then
              docker --host "$DOCKER_HOST" rm -f $containers >/dev/null 2>&1 || true
            fi
            rm -rf -- "$ISLAMU_TEST_ROOT"
          }
          trap cleanup EXIT

          unset DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH
          export ISLAMU_TEST_RUN_ID ISLAMU_TEST_ROOT
          export SECRET_PROVIDER=Environment
          export AUTHENTICATION_PROVIDER=Local
          export AUTHORIZATION_PROVIDER=Local
          export DEPLOYMENT_MODE=MultiTenant
          export IDENTITY_DATABASE_TOPOLOGY=colocated
          export DOTNET_ENVIRONMENT=Testing
          export ASPNETCORE_ENVIRONMENT=Testing

          for purpose in \
            RUNTIME MIGRATOR GLOBAL INSTANCE_KEY_READ INSTANCE_KEY_WRITE \
            INSTANCE_KEY_ISSUANCE PLATFORM_KEY_REPORT \
            EMAIL_POLICY_INSTANCE_MUTATION EMAIL_POLICY_TENANT_MUTATION \
            LOCAL_IDENTITY_WRITER; do
            username="bench_$(openssl rand -hex 12)"
            password="$(openssl rand -base64 48 | tr -d '\n')"
            printf '::add-mask::%s\n' "$username"
            printf '::add-mask::%s\n' "$password"
            export "DATABASE_${purpose}_USERNAME=$username"
            export "DATABASE_${purpose}_PASSWORD=$password"
          done

          for key in \
            INSTANCE_BOOTSTRAP_LOCAL_PASSWORD \
            ISLAMU_TEST_REPLACEMENT_PASSWORD \
            AUTHENTICATION_LOCAL_JWT_KEY; do
            secret_value="$(openssl rand -base64 48 | tr -d '\n')"
            printf '::add-mask::%s\n' "$secret_value"
            export "$key=$secret_value"
          done

          dotnet run --project tests/Event.Benchmarks/Event.Benchmarks.csproj \
            --configuration Release --no-build -- \
            --filter "*ApiEndpointPostgreSqlBenchmarks*" "*EfCoreQueryBenchmarks*" \
            --job Dry --inProcess --stopOnFirstError \
            --exporters json markdown --artifacts "$TMPDIR/artifacts"

      - name: Write Performance Smoke Summary
        if: always()
        shell: bash
        env:
          PERFORMANCE_OUTCOME: ${{ steps.performance_smoke.outcome }}
        run: |
          {
            echo "## Performance Smoke Evidence"
            echo
            echo "Direct BenchmarkDotNet dry smoke execution: ${PERFORMANCE_OUTCOME}."
            echo "Dry execution validates benchmark wiring and functional execution; it is not a statistical capacity baseline."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Performance Smoke Results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-smoke-evidence
          path: ${{ env.TMPDIR }}/artifacts/results/
          if-no-files-found: warn
          retention-days: 30
