Title: "Isolate inventory expiry work by its original tenant"
Type: fix
Scope: access
Summary: "Discover bounded identity-only fleet pointers through Global authority, then construct each hold-expiry execution graph inside a fresh immutable tenant Runtime scope."
Group: inventory-hold-expiry-tenant-authority
