apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_custom_property_governance"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_custom_property_governance.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can view governance reports within their tenant
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
