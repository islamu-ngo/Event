Title: "Enforce adopted canonical resource-read protection"
Type: feat
Scope: access
Summary: "Evaluate explicitly adopted ReadResource protection using current canonical human or service provenance, exact credential binding revisions, policy and qualification generations, and persisted sanctions. Installation alone preserves native resource authorization; retiring activation support does not erase existing sanctions. Recheck the same moderation facts before the single-use private response handoff, and never treat unrestricted moderation as a native permission grant. Complete consumer registration and lifecycle activation remain separate open gates."
