      - cqrs-mediatr-guidelines
      - auth-patterns
    load_rules:
      - .agents/rules/api-controllers.md
    paths_in_scope:
      - "src/Explore.API/Controllers/**/*.cs"
      - "src/Explore.Application/Features/**/Commands/**/*.cs"
    minimum_tests:
      - Event.API.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/internal/API_CHANGELOG.md
    unique_acceptance:
      - "Rate limiter policy applied"
      - "Idempotency considered"
      - "HAL link policy updated to expose/hide this affordance"
    forbidden_without_approval:
      - "Removing [Authorize] from a write endpoint"
    related_agents:
      - architect-agent
      - presentation-engineer-agent
      - backend-engineer-agent
      - security-privacy-agent
      - quality-verifier-agent
      - change-reviewer-agent
    criticality:
      tier: security
      required_model_tier: advanced
      verification_depth: exhaustive
      tenancy_scope: tenant_isolated
      rollback_strategy: forward_fix_only
      intake_clarification_mode: mandatory_grill_me
      exploration_protocol: exhaustive_graph_blast_radius
      testing_strategy: adversarial_concurrency_invariant_breakers
      review_protocol: anonymized_epistemic_mad
      safety_gates:
        - "authorize_attribute_enforced"
        - "rate_limiting_policy_applied"
        - "idempotency_considered"
      mandatory_reviewers:
        - security-privacy-agent
        - quality-verifier-agent

