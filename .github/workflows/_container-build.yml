name: "Container Build (Reusable)"

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      push-mode:
        required: false
        type: string
        default: "tagged"
      metadata-tags:
        required: false
        type: string
        default: ""
      environment:
        required: false
        type: string
        default: ""
      build-configuration:
        required: false
        type: string
        default: "Release"
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      registry:
        required: false
        type: string
        default: "atcr.io"
      registry-user:
        required: true
        type: string
    secrets:
      ATCR_PASSWORD:
        required: false
    outputs:
      digest:
        description: "Immutable OCI index digest (sha256:...) built and pushed to both registries."
        value: ${{ jobs.build.outputs.digest }}
      atcr-reference:
        description: "Canonical ATCR registry/repository@sha256:... reference."
        value: ${{ jobs.build.outputs.atcr-reference }}
      ghcr-reference:
        description: "Canonical GHCR registry/repository@sha256:... reference."
        value: ${{ jobs.build.outputs.ghcr-reference }}

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

jobs:
  build:
    name: Build ${{ inputs.image-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}

    outputs:
      digest: ${{ steps.refs.outputs.digest }}
      atcr-reference: ${{ steps.refs.outputs.atcr-reference }}
      ghcr-reference: ${{ steps.refs.outputs.ghcr-reference }}

    steps:
      - name: Validate container build inputs
        id: validate
        shell: bash
        env:
          PUSH_MODE: ${{ inputs.push-mode }}
          METADATA_TAGS: ${{ inputs.metadata-tags }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ inputs.registry-user }}
          IMAGE_NAME: ${{ inputs.image-name }}
          ATCR_SECRET_PRESENT: ${{ secrets.ATCR_PASSWORD != '' }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          case "${PUSH_MODE}" in
            tagged)
              if [[ -z "${METADATA_TAGS//[[:space:]]/}" ]]; then
                echo "metadata-tags is required when push-mode=tagged." >&2
                exit 1
              fi
              ;;
            digest-only)
              if [[ -n "${METADATA_TAGS//[[:space:]]/}" ]]; then
                echo "metadata-tags must be empty when push-mode=digest-only; release staging assigns no registry tags." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported push-mode '${PUSH_MODE}'. Expected 'tagged' or 'digest-only'." >&2
              exit 1
              ;;
          esac

          if [[ "${ATCR_SECRET_PRESENT}" != "true" ]]; then
            echo "ATCR_PASSWORD secret is required for container builds." >&2
            exit 1
          fi

          ghcr_owner="${REPO_OWNER,,}"
          echo "ghcr-owner=${ghcr_owner}" >> "$GITHUB_OUTPUT"
          echo "atcr-repository=${REGISTRY}/${REGISTRY_USER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ghcr-repository=ghcr.io/${ghcr_owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc5e6b4a696749961609132104084f7069c9 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ATcr
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ secrets.ATCR_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tagged mode)
        if: ${{ inputs.push-mode == 'tagged' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.validate.outputs.atcr-repository }}
            ${{ steps.validate.outputs.ghcr-repository }}
          tags: ${{ inputs.metadata-tags }}

      - name: Build and push (tagged mode)
        if: ${{ inputs.push-mode == 'tagged' }}
        id: build-tagged
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=${{ inputs.build-configuration }}

      - name: Build and stage by digest only (no registry tags)
        if: ${{ inputs.push-mode == 'digest-only' }}
        id: build-digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: |
            type=image,name=${{ steps.validate.outputs.atcr-repository }},push=true,push-by-digest=true,name-canonical=true
            type=image,name=${{ steps.validate.outputs.ghcr-repository }},push=true,push-by-digest=true,name-canonical=true
          build-args: |
            BUILD_CONFIGURATION=${{ inputs.build-configuration }}

      - name: Resolve canonical digest references
        id: refs
        shell: bash
        env:
          TAGGED_DIGEST: ${{ steps.build-tagged.outputs.digest }}
          DIGEST_ONLY_DIGEST: ${{ steps.build-digest.outputs.digest }}
          ATCR_REPOSITORY: ${{ steps.validate.outputs.atcr-repository }}
          GHCR_REPOSITORY: ${{ steps.validate.outputs.ghcr-repository }}
        run: |
          set -euo pipefail
          digest="${TAGGED_DIGEST:-${DIGEST_ONLY_DIGEST}}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Container build did not produce a valid sha256 OCI index digest: '${digest}'." >&2
            exit 1
          fi

          atcr_ref="${ATCR_REPOSITORY}@${digest}"
          ghcr_ref="${GHCR_REPOSITORY}@${digest}"
          {
            echo "digest=${digest}"
            echo "atcr-reference=${atcr_ref}"
            echo "ghcr-reference=${ghcr_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Record image digest evidence (tagged mode)
        if: ${{ inputs.push-mode == 'tagged' }}
        shell: bash
        env:
          RestorePackagesWithLockFile: "false"
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          DIGEST: ${{ steps.refs.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          METADATA: ${{ steps.build-tagged.outputs.metadata }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/container
          dotnet run .ci/scripts/write-container-digest-evidence.cs

          {
            echo "## Container image digest"
            echo
            echo "Image: \`${IMAGE_NAME}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```text'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record digest-only staging evidence
        if: ${{ inputs.push-mode == 'digest-only' }}
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          DIGEST: ${{ steps.refs.outputs.digest }}
          ATCR_REF: ${{ steps.refs.outputs.atcr-reference }}
          GHCR_REF: ${{ steps.refs.outputs.ghcr-reference }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/container

          jq -n \
            --arg imageName "${IMAGE_NAME}" \
            --arg dockerfile "${DOCKERFILE}" \
            --arg context "${CONTEXT}" \
            --arg pushMode "digest-only" \
            --arg digest "${DIGEST}" \
            --arg atcrReference "${ATCR_REF}" \
            --arg ghcrReference "${GHCR_REF}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              imageName: $imageName,
              dockerfile: $dockerfile,
              context: $context,
              pushMode: $pushMode,
              digest: $digest,
              tags: [],
              atcrReference: $atcrReference,
              ghcrReference: $ghcrReference,
              github: {
                repository: $repository,
                sha: $sha,
                ref: $ref,
                runId: $runId,
                runAttempt: $runAttempt
              }
            }' > "artifacts/container/${IMAGE_NAME}-digest.json"

          docker buildx imagetools inspect "${ATCR_REF}" > "artifacts/container/${IMAGE_NAME}-atcr-oci-inspect.txt"

          {
            echo "## Container image digest-only staging"
            echo
            echo "Image: \`${IMAGE_NAME}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Canonical tagless references:"
            echo "- \`${ATCR_REF}\`"
            echo "- \`${GHCR_REF}\`"
            echo
            echo "No mutable or version registry tags were assigned."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export SBOM and provenance registry evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_REF: ${{ steps.refs.outputs.ghcr-reference }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/container

          docker buildx imagetools inspect "$IMAGE_REF" > "artifacts/container/${IMAGE_NAME}-oci-inspect.txt"
          docker buildx imagetools inspect --raw "$IMAGE_REF" > "artifacts/container/${IMAGE_NAME}-oci-index.json"

          {
            echo "## SBOM/provenance registry evidence"
            echo
            echo "Image reference: \`${IMAGE_REF}\`"
            echo
            echo "Retained artifacts:"
            echo
            echo "- \`artifacts/container/${IMAGE_NAME}-oci-inspect.txt\`"
            echo "- \`artifacts/container/${IMAGE_NAME}-oci-index.json\`"
            echo
            echo "These files preserve the registry manifest/index evidence for the Buildx SBOM and provenance attestations generated during the build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record immutable deployment tag promotion evidence (tagged mode)
        if: ${{ inputs.push-mode == 'tagged' }}
        shell: bash
        env:
          RestorePackagesWithLockFile: "false"
          IMAGE_NAME: ${{ inputs.image-name }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ inputs.registry-user }}
          DIGEST: ${{ steps.refs.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/container

          dotnet run .ci/scripts/write-image-promotion-evidence.cs

          promotion_tags_file="artifacts/container/${IMAGE_NAME}-promotion-tags.txt"
          while IFS= read -r tag_ref; do
            if [[ -z "${tag_ref}" ]]; then
              continue
            fi

            safe_tag="$(printf '%s' "${tag_ref}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
            inspect_file="artifacts/container/${IMAGE_NAME}-promotion-${safe_tag}.txt"
            docker buildx imagetools inspect "${tag_ref}" > "${inspect_file}"

            if ! grep -F "${DIGEST}" "${inspect_file}" >/dev/null; then
              echo "Immutable deployment tag ${tag_ref} did not resolve to built digest ${DIGEST}."
              exit 1
            fi
          done < "${promotion_tags_file}"

          {
            echo "## Immutable deployment tag promotion"
            echo
            echo "Built digest: \`${DIGEST}\`"
            echo
            echo "Primary registry immutable tags:"
            echo '```text'
            cat "${promotion_tags_file}"
            echo '```'
            echo
            echo "Each listed tag was inspected in the primary registry and verified to resolve to the built digest."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Trivy SARIF evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.ghcr-reference }}
          format: sarif
          output: artifacts/container/${{ inputs.image-name }}-trivy.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.ghcr-reference }}
          format: table
          output: artifacts/container/${{ inputs.image-name }}-trivy.txt
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate GHCR artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.validate.outputs.ghcr-repository }}
          subject-digest: ${{ steps.refs.outputs.digest }}
          push-to-registry: true

      - name: Verify GHCR artifact attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_REF: ${{ steps.refs.outputs.ghcr-reference }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/_container-build.yml
        run: |
          set -euo pipefail
          mkdir -p artifacts/container

          verification_file="artifacts/container/${IMAGE_NAME}-attestation-verification.json"
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --deny-self-hosted-runners \
            --format json > "${verification_file}"

          {
            echo "## Container attestation verification"
            echo
            echo "Image reference: \`${IMAGE_REF}\`"
            echo
            echo "Signer workflow: \`${SIGNER_WORKFLOW}\`"
            echo
            echo "Verification evidence: \`${verification_file}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate evidence checksum manifest
        shell: bash
        env:
          RestorePackagesWithLockFile: "false"
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          dotnet run .ci/scripts/write-artifact-checksums.cs -- artifacts/container "artifacts/container/${IMAGE_NAME}-checksums.sha256"

          {
            echo "## Container evidence checksums"
            echo
            echo "Checksum manifest: \`artifacts/container/${IMAGE_NAME}-checksums.sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload container build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-build-${{ inputs.image-name }}
          path: artifacts/container/**
          if-no-files-found: warn
          retention-days: 90
