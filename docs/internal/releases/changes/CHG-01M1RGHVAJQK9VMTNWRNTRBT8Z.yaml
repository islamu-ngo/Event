# ABOUTME: Records the stateless registration checkout handoff and its security boundary.
# ABOUTME: Declares ticket replay, hosting key-ring, and operator impacts without payment schema changes.
Change-Id: CHG-01M1RGHVAJQK9VMTNWRNTRBT8Z
Title: Registration checkout no longer requires Redis ticket storage
Type: feat
Scope: registration
Summary: >-
  Registration checkout carries its destination in a bounded protected cookie
  instead of storing per-ticket state in Redis or standalone memory.
Group: stateless-payment-checkout-tickets
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/PAYMENTS.md
    Disposition: documented
    Detail: >-
      Previously issued nonce tickets must be reissued. Copied tickets and older
      issues remain replayable until five-minute expiry instead of being consumed
      or revoked on the server.
  Security:
    Reference: docs/internal/PAYMENTS.md
    Disposition: documented
    Detail: >-
      Authenticated Data Protection, audience and dedicated-session binding,
      exact expiry, same-origin checks, and the destination allowlist remain
      enforced. HTTP 303 deletes the browser cookie but is not server-side revocation.
  Migration:
    Reference: docs/internal/PAYMENTS.md
    Disposition: not-applicable
    Detail: No database schema or payment settlement change is required.
  Configuration:
    Reference: docs/internal/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Redis is optional for ticket storage. Replicas must still share Data Protection
      keys and an application name; selecting Redis for keys retains that dependency.
  OpenAPI:
    Reference: docs/internal/PAYMENTS.md
    Disposition: not-applicable
    Detail: The checkout response contract and generated API clients are unchanged.
  Operator:
    Reference: docs/internal/HOSTING_ARCHITECTURE.md
    Disposition: documented
    Detail: >-
      Split BFF and Combined hosts retain their existing key-ring composition.
      Operators must preserve shared key material and reissue in-flight nonce tickets.
