# ABOUTME: Public change fragment for semantics-first record contracts and trusted request authority.
# ABOUTME: Records breaking API, security, migration, configuration, OpenAPI, and operator impacts.
Change-Id: CHG-01M1VJ17RD9AT6PNN1X0093958
Title: Immutable contracts use records without trusting body authority
Type: refactor
Scope: architecture
Summary: >-
  Handwritten immutable requests, DTOs, payload snapshots, and presentation
  snapshots use value-oriented record contracts, while generated, persisted
  lifecycle, framework-populated, and editable state keeps class semantics.
  Current tenant authority is supplied by the server rather than request bodies.
Group: records-adoption
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Eight create/import request bodies no longer accept tenantId. Integrations
      must omit that member; unsupported authority fields fail with validation
      ProblemDetails and no compatibility alias or reader is provided.
  Security:
    Reference: docs/GOVERNANCE.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Controllers derive the current tenant and user from the authenticated
      principal, ITenantContext, an authoritative route or persisted resource,
      or a purpose-bound trusted adapter. Legitimate target identifiers remain
      independently authorized and tenant-checked.
  Migration:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: >-
      No database schema, persisted value, EF migration, or model snapshot
      changes are required. This is a source and wire-contract migration only.
  Configuration:
    Reference: docs/GOVERNANCE.md
    Disposition: not-applicable
    Detail: >-
      No runtime setting, secret, environment variable, or provider
      configuration changes are introduced.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      The eight body schemas omit tenantId and affected authenticated writes
      publish complete ProblemDetails metadata. Routes, HAL relations, and all
      776 operation IDs remain stable; regenerate clients from the committed
      OpenAPI document.
  Operator:
    Reference: docs/BLAZOR.md
    Disposition: documented
    Detail: >-
      Regenerate typed clients before deploying callers compiled against the
      removed tenantId members. No database, configuration, or infrastructure
      rollout step is required.
