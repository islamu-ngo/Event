# ABOUTME: Breaking public change fragment for structured legal-identity authority.
# ABOUTME: Records tenant, instance, paid acceptance, configuration, and migration impacts.
Change-Id: CHG-01M15E1S6RWXNQ30FB9QAVX6HX
Title: Legal identity becomes structured and responsibility-specific
Type: feat
Scope: registration
Summary: >-
  Tenant directory, instance platform, and organizer merchant identities are
  separated across provisioning, public disclosure, administration, and paid
  buyer acceptance.
Group: branding-legal-identity-authority
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Branding-derived disclaimer prose and flattened paid operator fields are
      removed. Clients must consume structured directoryOperator,
      instanceOperator, organizerMerchant, tenantDirectoryOperator, and
      paymentOperations contracts without compatibility aliases.
  Security:
    Reference: docs/AUTHORIZATION.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Tenant identity writes remain authenticated, exact-tenant bound,
      optimistic-concurrency protected, and HAL-gated; anonymous contracts
      expose normalized public facts only and fail closed without a complete
      tenant identity.
  Migration:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      The five merged application-provider Init migrations are preserved.
      Generated AddLegalIdentityAuthority corrective migrations add immutable
      acceptance template, exact organizer recipient lineage, tenant directory
      document/revision, instance identity, payment operations, and normalized
      line evidence without rewriting migration history.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Instance operator identity moves to required
      Instance:OperatorIdentity configuration. Payments:CheckoutGovernance
      retains payment operations only.
  OpenAPI:
    Reference: docs/API.md
    Disposition: documented
    Detail: >-
      Authoritative OpenAPI and the generated Blazor client expose HAL-gated tenant
      identity administration, structured public operators, and grouped paid
      acceptance.
  Operator:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      Operators must configure general instance identity before runtime startup
      and complete each tenant directory identity before activation and public
      or paid readiness.
