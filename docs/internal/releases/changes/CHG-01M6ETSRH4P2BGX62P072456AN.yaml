Change-Id: CHG-01M6ETSRH4P2BGX62P072456AN
Title: "Persist and bind original recognition capture material"
Type: fix
Scope: privacy
Summary: "Persist original recognition capture, reconcile lost append acknowledgements against retained proof, and allow tenant enrollment to save only its original qualified continuity binding."
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/PRIVACY_ERASURE.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/PRIVACY_ERASURE.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Preserve original material identities, source validation, key-lifecycle
      enlistment and transaction ownership. Existing material receipts retain
      their early completion path and are never regenerated by this change.
      Binding requires the exact retained fact and original settlement deadline;
      pre-append key and restore-floor checks remain mandatory.
      Recovery reauthenticates the committed fact under a fresh native gate.
      Tenant continuity references remain bound to the exact object, original
      transaction and qualification deadline; tenant read filters stay intact.
  Migration:
    Reference: docs/internal/BACKUP_RESTORE_UPGRADE.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/internal/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/privacy-erasure.md
    Disposition: documented
    Detail: >-
      Pending recognition requests use the existing reconciliation flow. No
      schema, key, permission or retention-setting adjustment is required.
