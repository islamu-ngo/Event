Change-Id: CHG-01M4FZEH69JCJYBX2CQ527KRY7
Title: "Recheck current instance ownership before machine resource disclosure"
Type: fix
Scope: access
Summary: "InstanceAdmin-owned machine resource requests now require global ownership, a current nondeleted user and a current platform-scoped platform.admin assignment. Fresh bounded reads before preparation and terminal delivery reject owner deletion or assignment removal even when the same API key remains active. Ownership qualification does not grant the machine its owner's human administrator permissions. Organization, group and tenant qualification and complete moderation consumer registration remain open."
