Change-Id: CHG-01M7REPGSY2GJQASK9WYDQJKTR
Title: "Mediate PostgreSQL email recipient reads and policy contracts"
Type: fix
Scope: notifications
Summary: "Add a dedicated-owner SECURITY DEFINER recipient resolution function and repair native PostgreSQL email delivery policy admission, source-function variable ambiguity, and store-type drift."
Group: email-delivery-native-contracts
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: "Reprovision development-native PostgreSQL profiles before starting this revision. Existing installations without the stamped email mutation policies or email_delivery_recipient function and dedicated owner role fail closed rather than being silently repaired."
  Security:
    Reference: docs/internal/SECURITY_OVERVIEW.md
    Disposition: documented
    Detail: "Email recipient resolution runs through a SECURITY DEFINER function owned by a dedicated NOLOGIN role with column-scoped SELECT grants only. Delivery logins receive EXECUTE only and no direct users or user_pii table access; evidence rows and secrets are never returned."
  Migration:
    Reference: docs/internal/SECURITY_OVERVIEW.md
    Disposition: documented
    Detail: "The native installer creates the dedicated recipient owner role, grants minimal column reads, stamps email policy mutation policies, and derives override return types from the EF model."
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/documentation/readme/security-and-identity/authentication.md
    Disposition: documented
    Detail: "Initialize a fresh development-native PostgreSQL profile. No new operator credentials or configuration keys are introduced."
