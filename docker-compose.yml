  StorageReconciliation__Enabled: ${STORAGE_RECONCILIATION_ENABLED:-true}
  StorageReconciliation__DryRun: ${STORAGE_RECONCILIATION_DRY_RUN:-true}
  StorageReconciliation__QuarantineMissingObjects: ${STORAGE_RECONCILIATION_QUARANTINE_MISSING_OBJECTS:-false}
  StorageReconciliation__QuarantineOrphanLocalFiles: ${STORAGE_RECONCILIATION_QUARANTINE_ORPHAN_LOCAL_FILES:-false}
  StorageReconciliation__DeleteQuarantinedObjects: ${STORAGE_RECONCILIATION_DELETE_QUARANTINED_OBJECTS:-false}

services:
  privacy-erasure-authority-volume-init:
    image: busybox:1.37.0-musl
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown 1654:1654 /app/data && chmod 700 /app/data"]
    volumes:
      - privacy_erasure_authority_data:/app/data

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  privacy-erasure-db:
    profiles: ["privacy-erasure-external"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_ERASURE_MIGRATOR_USERNAME:-privacy_erasure_migrator}
      POSTGRES_PASSWORD: ${DATABASE_ERASURE_MIGRATOR_PASSWORD:-}
      POSTGRES_DB: ${DATABASE_ERASURE_NAME:-islamu_event_privacy_erasure}
    volumes:
      - privacy_erasure_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  event-migrationservice:
    build:
      context: .
      dockerfile: src/Event.MigrationService/Dockerfile
    environment:
      <<: [*secrets-env, *database-env, *database-migrator-env, *privacy-erasure-migrator-env, *local-identity-migrator-env]
      CONFIGURATION_MANIFEST_MODE: ${CONFIGURATION_MANIFEST_MODE:-Off}
      CONFIGURATION_MANIFEST_PATH: ${CONFIGURATION_MANIFEST_PATH:-/etc/islamu-event/bootstrap/configuration-manifest.json}
    volumes:
      - privacy_erasure_authority_data:/app/data
      - type: bind
        source: ${CONFIGURATION_MANIFEST_HOST_DIRECTORY:-./deploy/bootstrap}
        target: /etc/islamu-event/bootstrap
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      privacy-erasure-authority-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      privacy-erasure-db:
        condition: service_healthy
        required: false

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:${MAILPIT_TAG:-latest}
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - mailpit_data:/data
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  keycloak-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      POSTGRES_DB: ${KEYCLOAK_DB_DATABASE:-keycloak}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KC_HOSTNAME: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}
      KC_HOSTNAME_URL: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    volumes:
      # Repository-owned realm export. Keycloak imports JSON files from this
      # directory on startup; existing realms are not overwritten automatically.
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.1.2
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ISLAMU}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_BLAZOR_CLIENT_ID: ${KEYCLOAK_BLAZOR_CLIENT_ID:-islamu-event-blazor}
      KEYCLOAK_BLAZOR_CLIENT_SECRET: ${KEYCLOAK_BLAZOR_CLIENT_SECRET:-}
      KEYCLOAK_API_CLIENT_ID: islamu-event-api
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-}
      KEYCLOAK_BLAZOR_REDIRECT_URIS: ${KEYCLOAK_BLAZOR_REDIRECT_URIS:-}
      KEYCLOAK_BLAZOR_WEB_ORIGINS: ${KEYCLOAK_BLAZOR_WEB_ORIGINS:-}
      KEYCLOAK_BLAZOR_LOGOUT_REDIRECT_URIS: ${KEYCLOAK_BLAZOR_LOGOUT_REDIRECT_URIS:-}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-false}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-false}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-false}
      KEYCLOAK_SMTP_REPLY_TO: ${KEYCLOAK_SMTP_REPLY_TO:-}
      KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME: ${KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME:-}
      KEYCLOAK_SMTP_ENVELOPE_FROM: ${KEYCLOAK_SMTP_ENVELOPE_FROM:-}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
    volumes:
      - ./docker/keycloak/keycloak-init.sh:/opt/keycloak/bin/keycloak-init.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak/bin/keycloak-init.sh"]

  islamu-event-api:
    build:
      context: .
      dockerfile: src/Explore.API/Dockerfile
    environment:
      <<: [*keycloak-env, *authentication-selection-env, *local-identity-runtime-env, *s3-env, *local-storage-env, *secrets-env, *database-env, *database-runtime-env, *privacy-erasure-runtime-env, *api-runtime-env, *instance-operator-identity-env, *payment-operations-env, *payment-api-env, *ai-env, *geocoding-env, *mcp-env, *smtp-env, *email-dispatch-rabbitmq-env, *web-push-env, *reporting-env, *webhooks-env, *listmonk-env]
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      Keycloak__MetadataAddress: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}/.well-known/openid-configuration
      Keycloak__Authority: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}
      ConnectionStrings__cache: ${REDIS_CONNECTION_STRING:-redis:6379}
      AUTHORIZATION_PROVIDER: ${AUTHORIZATION_PROVIDER:-}
      Cerbos__GrpcEndpoint: ${CERBOS_GRPC_ENDPOINT:-http://cerbos:3593}
      Cerbos__HttpEndpoint: ${CERBOS_HTTP_ENDPOINT:-http://cerbos:3592}
      Cerbos__UseTls: ${CERBOS_USE_TLS:-false}
      Cerbos__PlaintextMode: ${CERBOS_PLAINTEXT_MODE:-true}
      Cerbos__PolicyPackagePath: /app/cerbos/policies
      Cerbos__AdminApi__Endpoints__0: ${CERBOS_HTTP_ENDPOINT:-http://cerbos:3592}
      Cerbos__AdminPasswordHash: ${CERBOS_ADMIN_PASSWORD_HASH:-}
      CERBOS_ADMIN_USERNAME: ${CERBOS_ADMIN_USERNAME:-}
      CERBOS_ADMIN_PASSWORD: ${CERBOS_ADMIN_PASSWORD:-}
    ports:
      - "${API_HTTP_PORT:-7039}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "minio.localhost:host-gateway"
    volumes:
      - ./cerbos/policies:/app/cerbos/policies:ro
      - setup_data:/app/bootstrap
      - local_storage_data:/app/storage-data/local
      - privacy_erasure_authority_data:/app/data
    deploy:
      replicas: 1
    depends_on:
      privacy-erasure-authority-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      event-migrationservice:
        condition: service_completed_successfully
        required: false
      privacy-erasure-db:
        condition: service_healthy
        required: false
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
        required: false
      svix:
        condition: service_healthy
        required: false
      weblate:
        condition: service_started
        required: false
      coop:
        condition: service_started
        required: false
      osprey:
        condition: service_started
        required: false

  islamu-event-ui:
    build:
      context: .
      dockerfile: src/Explore.Blazor/Dockerfile
    environment:
      <<: [*keycloak-env, *authentication-selection-env, *secrets-env, *database-env, *database-runtime-env]
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      API_ENDPOINT: ${API_ENDPOINT:-http://islamu-event-api:8080/}
      Keycloak__Authority: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}
      Keycloak__MetadataAddress: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}/.well-known/openid-configuration
      Keycloak__Realm: ${KEYCLOAK_REALM:-ISLAMU}
      Keycloak__ClientId: ${KEYCLOAK_BLAZOR_CLIENT_ID:-islamu-event-blazor}
      Keycloak__ClientSecret: ${KEYCLOAK_BLAZOR_CLIENT_SECRET:-}
      Bff__AdminHosts__0: ${CONTROL_PLANE_PUBLIC_ORIGIN:-http://admin.localhost:7002}
      ConnectionStrings__cache: ${REDIS_CONNECTION_STRING:-redis:6379}
    ports:
      - "${UI_HTTP_PORT:-7002}:8080"
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "minio.localhost:host-gateway"
    depends_on:
      islamu-event-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        required: false

  minio:
    image: ghcr.io/coollabsio/minio:latest
    profiles: ["storage"] # Opt-in only
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      MINIO_SERVER_URL: ${STORAGE_S3_PUBLIC_ENDPOINT:-http://minio.localhost:9005}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9005}:9000"
      - "${MINIO_CONSOLE_PORT:-9006}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    profiles: ["storage"] # Only runs if storage is enabled
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_S3_ACCESS_KEY_ID:-} ${STORAGE_S3_SECRET_ACCESS_KEY:-};
      mc mb --ignore-existing local/${STORAGE_S3_BUCKET_NAME:-explore};
      mc anonymous set public local/${STORAGE_S3_BUCKET_NAME:-explore};
      "

  cerbos-db:
    image: postgres:18-alpine
    profiles: ["authz"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CERBOS_POSTGRES_USER:-cerbos_user}
      POSTGRES_PASSWORD: ${CERBOS_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${CERBOS_POSTGRES_DB:-cerbos}
    volumes:
      - cerbos_data:/var/lib/postgresql
      # Repository-owned Cerbos PostgreSQL schema used by local infrastructure.
      - ./cerbos/init/cerbos-schema.sql:/docker-entrypoint-initdb.d/cerbos-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.53.0
    profiles: ["authz"] # Opt-in only (use: docker compose --profile authz up)
    restart: unless-stopped
    command: ["server", "--config=/config/.cerbos.yaml"]
    environment:
      CERBOS_ADMIN_USER: ${CERBOS_ADMIN_USERNAME:-cerbos}
      CERBOS_ADMIN_PASSWORD_HASH: ${CERBOS_ADMIN_PASSWORD_HASH:-}
      CERBOS_PG_URL: ${CERBOS_PG_URL:-}
    volumes:
      # Repository-owned Cerbos runtime config and bundled policies/schemas.
      - ./cerbos/config/.cerbos.yaml:/config/.cerbos.yaml:ro
      - ./cerbos/policies:/policies:ro
    ports:
      - "${CERBOS_HTTP_PORT:-3592}:3592"
      - "${CERBOS_GRPC_PORT:-3593}:3593"
    depends_on:
      cerbos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3592/_cerbos/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  cerbos-policy-sync:
    image: ghcr.io/cerbos/cerbosctl:0.53.0
    profiles: ["authz"]
    depends_on:
      cerbos:
        condition: service_healthy
    environment:
      CERBOS_USERNAME: ${CERBOS_ADMIN_USERNAME:-cerbos}
      CERBOS_PASSWORD: ${CERBOS_ADMIN_PASSWORD:-}
    volumes:
      # Sync the same repository policy bundle that local Cerbos reads from disk.
      - ./cerbos/policies:/policies:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cerbosctl --server=http://cerbos:3592 put policy --recursive /policies &&
        cerbosctl --server=http://cerbos:3592 put schema --recursive /policies/_schemas &&
        cerbosctl --server=http://cerbos:3592 store reload --wait

  svix-db:
    image: postgres:13.4
    profiles: ["webhooks"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SVIX_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SVIX_DB_PASSWORD:-}
      POSTGRES_DB: ${SVIX_DB_DATABASE:-postgres}
    volumes:
      - svix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  svix:
    image: svix/svix-server:${SVIX_TAG:-v1.96.1}
    profiles: ["webhooks"]
    restart: unless-stopped
    environment:
      WAIT_FOR: "true"
      SVIX_DB_DSN: ${SVIX_DB_DSN:-postgresql://postgres:postgres@svix-db:5432/postgres}
      SVIX_REDIS_DSN: ${SVIX_REDIS_DSN:-redis://redis:6379}
      SVIX_QUEUE_TYPE: ${SVIX_QUEUE_TYPE:-redis}
      SVIX_CACHE_TYPE: ${SVIX_CACHE_TYPE:-redis}
      SVIX_JWT_SECRET: ${SVIX_JWT_SECRET:-}
    ports:
      - "${SVIX_HTTP_PORT:-8071}:8071"
    depends_on:
      svix-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "svix-server healthcheck http://localhost:8071"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  weblate-db:
    image: postgres:18-alpine
    profiles: ["localization"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WEBLATE_POSTGRES_USER:-weblate}
      POSTGRES_PASSWORD: ${WEBLATE_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${WEBLATE_POSTGRES_DB:-weblate}
    volumes:
      - weblate_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  weblate:
    image: ${WEBLATE_IMAGE:-weblate/weblate:latest}
    profiles: ["localization"]
    restart: unless-stopped
    environment:
      WEBLATE_SITE_DOMAIN: ${WEBLATE_SITE_DOMAIN:-localhost:8083}
      WEBLATE_ADMIN_NAME: ${WEBLATE_ADMIN_NAME:-Admin}
      WEBLATE_ADMIN_EMAIL: ${WEBLATE_ADMIN_EMAIL:-admin@openislamu.org}
      WEBLATE_ADMIN_PASSWORD: ${WEBLATE_ADMIN_PASSWORD:-}
      POSTGRES_HOST: weblate-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${WEBLATE_POSTGRES_USER:-weblate}
      POSTGRES_PASSWORD: ${WEBLATE_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${WEBLATE_POSTGRES_DB:-weblate}
      VALKEY_HOST: redis
      VALKEY_PORT: "6379"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - weblate_data:/app/data
    ports:
      - "${WEBLATE_HTTP_PORT:-8083}:8080"
    depends_on:
      weblate-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  coop:
    image: ${COOP_IMAGE:-ghcr.io/roostorg/coop-server:latest}
    profiles: ["moderation"]
    restart: unless-stopped
    environment:
      NODE_ENV: ${COOP_NODE_ENV:-development}
      OTEL_SERVICE_NAME: ${COOP_OTEL_SERVICE_NAME:-coop}
      PORT: "8080"
      UI_URL: ${COOP_UI_URL:-http://localhost:3001}
      SESSION_SECRET: ${COOP_SESSION_SECRET:-}
      DATABASE_HOST: coop-db
      DATABASE_READ_ONLY_HOST: coop-db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${COOP_DATABASE_USER:-coop}
      DATABASE_PASSWORD: ${COOP_DATABASE_PASSWORD:-}
      DATABASE_NAME: ${COOP_DATABASE_NAME:-coop}
      WAREHOUSE_ADAPTER: ${COOP_WAREHOUSE_ADAPTER:-noop}
      ANALYTICS_ADAPTER: ${COOP_ANALYTICS_ADAPTER:-noop}
      SCYLLA_HOSTS: ${COOP_SCYLLA_HOSTS:-coop-scylla}
      SCYLLA_USERNAME: ${COOP_SCYLLA_USERNAME:-cassandra}
      SCYLLA_PASSWORD: ${COOP_SCYLLA_PASSWORD:-}
      SCYLLA_LOCAL_DATACENTER: ${COOP_SCYLLA_LOCAL_DATACENTER:-datacenter1}
      SCYLLA_SSL: ${COOP_SCYLLA_SSL:-false}
      REDIS_USE_CLUSTER: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${COOP_HTTP_PORT:-8082}:8080"
    depends_on:
      coop-migrations:
        condition: service_completed_successfully
      coop-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  coop-migrations:
    image: ${COOP_MIGRATIONS_IMAGE:-ghcr.io/roostorg/coop-migrations:latest}
    profiles: ["moderation"]
    restart: "no"
    environment:
      DATABASE_HOST: coop-db
      DATABASE_READ_ONLY_HOST: coop-db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${COOP_DATABASE_USER:-coop}
      DATABASE_PASSWORD: ${COOP_DATABASE_PASSWORD:-}
      DATABASE_NAME: ${COOP_DATABASE_NAME:-coop}
      API_SERVER_DATABASE_HOST: coop-db
      API_SERVER_DATABASE_PORT: "5432"
      API_SERVER_DATABASE_USER: ${COOP_DATABASE_USER:-coop}
      API_SERVER_DATABASE_PASSWORD: ${COOP_DATABASE_PASSWORD:-}
      API_SERVER_DATABASE_NAME: ${COOP_DATABASE_NAME:-coop}
      SCYLLA_HOSTS: ${COOP_SCYLLA_HOSTS:-coop-scylla}
      SCYLLA_USERNAME: ${COOP_SCYLLA_USERNAME:-cassandra}
      SCYLLA_PASSWORD: ${COOP_SCYLLA_PASSWORD:-}
      SCYLLA_LOCAL_DATACENTER: ${COOP_SCYLLA_LOCAL_DATACENTER:-datacenter1}
      SCYLLA_SSL: ${COOP_SCYLLA_SSL:-false}
    entrypoint: ["sh", "-c", "npm run db:create -- --db api-server-pg --env staging && npm run db:update -- --db api-server-pg --env staging"]
    depends_on:
      coop-db:
        condition: service_healthy

  coop-client:
    image: ${COOP_CLIENT_IMAGE:-ghcr.io/roostorg/coop-client:latest}
    profiles: ["moderation"]
    restart: unless-stopped
    volumes:
      - ./src/Explore.AppHost/Config/coop/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${COOP_CLIENT_HTTP_PORT:-3001}:80"
    depends_on:
      coop:
        condition: service_started

  coop-db:
    image: postgres:18-alpine
    profiles: ["moderation"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${COOP_DATABASE_USER:-coop}
      POSTGRES_PASSWORD: ${COOP_DATABASE_PASSWORD:-}
      POSTGRES_DB: ${COOP_DATABASE_NAME:-coop}
    volumes:
      - coop_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COOP_DATABASE_USER:-coop} -d ${COOP_DATABASE_NAME:-coop}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  formbricks-postgres:
    image: pgvector/pgvector:pg18
    profiles: ["formbricks"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FORMBRICKS_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${FORMBRICKS_DATABASE_PASSWORD:-}
      POSTGRES_DB: ${FORMBRICKS_DATABASE_NAME:-formbricks}
    volumes:
      - formbricks_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORMBRICKS_DATABASE_USER:-postgres} -d ${FORMBRICKS_DATABASE_NAME:-formbricks}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  formbricks-redis:
    image: valkey/valkey@sha256:12ba4f45a7c3e1d0f076acd616cb230834e75a77e8516dde382720af32832d6d
    profiles: ["formbricks"]
    restart: unless-stopped
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - formbricks_redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  formbricks-migrate:
    image: ghcr.io/formbricks/formbricks:5.2.2@sha256:d6f635714a9c29620203ba29762f4746f5def86c346d6ad95fefa66adc21fd5e
    profiles: ["formbricks"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["node /home/nextjs/validate-env.mjs && node packages/database/dist/scripts/apply-migrations.js"]
    environment:
      <<: *formbricks-env
    depends_on:
      formbricks-postgres:
        condition: service_healthy

  formbricks-hub-migrate:
    image: ghcr.io/formbricks/hub:latest@sha256:4dc0c4f26cf999b3bf4a26d7b09634fc65ae23cbb30c9ad82042da019d231458
    profiles: ["formbricks"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ['goose -dir /app/migrations postgres "$$DATABASE_URL" up && river migrate-up --database-url "$$DATABASE_URL"']
    environment:
      DATABASE_URL: postgresql://${FORMBRICKS_DATABASE_USER:-postgres}:${FORMBRICKS_DATABASE_PASSWORD:-}@formbricks-postgres:5432/${FORMBRICKS_DATABASE_NAME:-formbricks}?sslmode=disable
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully

  formbricks-hub:
    image: ghcr.io/formbricks/hub:latest@sha256:4dc0c4f26cf999b3bf4a26d7b09634fc65ae23cbb30c9ad82042da019d231458
    profiles: ["formbricks"]
    restart: unless-stopped
    environment:
      API_KEY: ${FORMBRICKS_HUB_API_KEY:-}
      DATABASE_URL: postgresql://${FORMBRICKS_DATABASE_USER:-postgres}:${FORMBRICKS_DATABASE_PASSWORD:-}@formbricks-postgres:5432/${FORMBRICKS_DATABASE_NAME:-formbricks}?sslmode=disable
    depends_on:
      formbricks-hub-migrate:
        condition: service_completed_successfully

  formbricks-cube:
    image: cubejs/cube:v1.6.6
    profiles: ["formbricks"]
    restart: unless-stopped
    command: ["sh", "-c", "test -n \"$$CUBEJS_API_SECRET\" && exec cubejs server"]
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: formbricks-postgres
      CUBEJS_DB_NAME: ${FORMBRICKS_DATABASE_NAME:-formbricks}
      CUBEJS_DB_USER: ${FORMBRICKS_DATABASE_USER:-postgres}
      CUBEJS_DB_PASS: ${FORMBRICKS_DATABASE_PASSWORD:-}
      CUBEJS_DB_PORT: "5432"
      CUBEJS_API_SECRET: ${FORMBRICKS_CUBEJS_API_SECRET:-}
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/readyz',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      formbricks-hub-migrate:
        condition: service_completed_successfully
      formbricks-postgres:
        condition: service_healthy

  formbricks:
    image: ghcr.io/formbricks/formbricks:5.2.2@sha256:d6f635714a9c29620203ba29762f4746f5def86c346d6ad95fefa66adc21fd5e
    profiles: ["formbricks"]
    restart: unless-stopped
    ports:
      - "${FORMBRICKS_HTTP_PORT:-3005}:3000"
    environment:
      <<: *formbricks-env
      SKIP_STARTUP_MIGRATION: "true"
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
      formbricks-postgres:
        condition: service_healthy
      formbricks-redis:
        condition: service_healthy
      formbricks-cube:
        condition: service_healthy
      formbricks-hub:
        condition: service_started

  osprey:
    image: ${OSPREY_IMAGE:-ghcr.io/roostorg/osprey/osprey-coordinator:latest}
    profiles: ["osprey"]
    restart: unless-stopped
    environment:
      RUST_LOG: ${OSPREY_RUST_LOG:-info}
      OSPREY_COORDINATOR_BIDI_STREAM_PORT: "19950"
      OSPREY_COORDINATOR_SYNC_ACTION_PORT: "19951"
      POD_IP: ${OSPREY_POD_IP:-osprey}
    ports:
      - "${OSPREY_BIDI_STREAM_PORT:-19950}:19950"
      - "${OSPREY_SYNC_ACTION_PORT:-19951}:19951"

volumes:
  setup_data:
  postgres_data:
  privacy_erasure_authority_data:
  privacy_erasure_postgres_data:
  redis_data:
  keycloak_data:
  mailpit_data:
  local_storage_data:
  minio_data:
  cerbos_data:
  svix_postgres_data:
  weblate_data:
  weblate_postgres_data:
  coop_postgres_data:
  formbricks_postgres_data:
  formbricks_redis_data:
