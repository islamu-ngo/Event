Change-Id: CHG-01M4G0JYQX0600H9WQH37TAQMF
Title: "Recheck active credential tenancy before machine resource disclosure"
Type: fix
Scope: access
Summary: "Every tenant-bound machine resource request now requires a current active credential tenant through a bounded fresh Tenant and TenantStatus entity read, independent of the resource tenant. Suspended, archived, purged or unavailable authority tenants prevent terminal delivery even when the same API key remains active. Tenant-owned credentials must name their exact authority tenant. Organization and group owner qualification and complete moderation consumer registration remain open."
