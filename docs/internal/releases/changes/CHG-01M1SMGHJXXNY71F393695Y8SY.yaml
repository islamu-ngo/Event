    Detail: This capability uses existing settings and secret binding storage without a schema change.
  Configuration:
    Reference: docs/internal/CONFIGURATION.md
    Disposition: documented
    Detail: email.delivery_enabled defaults false and tenant SMTP delegation retains explicit instance governance.
  OpenAPI:
    Reference: docs/internal/CONFIGURATION.md
