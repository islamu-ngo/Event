name: Release Impact Check

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Metadata-only release-impact check: trusted base checkout, read-only token, no PR-head code execution.
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-impact:
    name: Release Impact Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Trusted Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate Release Impact Metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RestorePackagesWithLockFile: "false"
        run: dotnet run .ci/scripts/validate-release-impact-pr.cs -- "$GITHUB_EVENT_PATH"
