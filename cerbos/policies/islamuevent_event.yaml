# Events are org-scoped: owners, event teams, and org admins edit; platform admins moderate.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event.json
  rules:
    - actions: ["approve-publish"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin
        - islamuevent_tenant_admin
      condition:
        match:
          expr: >
            has(request.resource.attr.tenantId) &&
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true)

    - actions: ["view", "view-management", "moderate-light", "moderate-heavy", "unmoderate"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    - actions: ["view", "view-management", "moderate-light", "moderate-heavy", "unmoderate", "manage-public-actions"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Org admins can manage events for their organization
    - actions: ["view", "view-management", "create", "update", "delete", "publish", "manage-team", "manage-owner", "transfer-ownership", "manage-finance", "manage-public-actions"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin

    - actions: ["view", "view-management", "update", "delete", "publish", "manage-team", "manage-owner", "transfer-ownership", "manage-finance", "manage-public-actions"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_actor_user_owner

    # Event creation is a pre-create check: the event actor does not exist yet.
    # The CreateEventCommand handler still enforces tenant user-submission policy
    # and organization/group EventCreate membership before persisting the event.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            has(request.resource.attr.authorizationPhase) &&
            request.resource.attr.authorizationPhase == "pre_create" &&
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true)

    # Event owners have full control over their event
    - actions: ["view", "view-management", "update", "delete", "publish", "manage-team", "manage-owner", "transfer-ownership", "manage-finance", "manage-public-actions"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_owner

    # Event managers can edit and publish their event
    - actions: ["view", "view-management", "update", "publish", "manage-public-actions"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_manager

    - actions: ["manage-registrations", "manage-registration-workflow", "manage-registration-channels", "view-registration-provider-health"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_registration_manager
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true)

    - actions: ["manage-registrations", "manage-registration-workflow", "manage-registration-channels", "view-registration-provider-health"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true) &&
            ((has(request.resource.attr.organizerUserId) &&
              has(request.principal.attr.userId) &&
              request.resource.attr.organizerUserId == request.principal.attr.userId) ||
             (has(request.resource.attr.organizerOrganizationId) &&
              has(request.principal.attr.eventCreateOrganizations) &&
              request.resource.attr.organizerOrganizationId in request.principal.attr.eventCreateOrganizations) ||
              (has(request.resource.attr.organizerGroupId) &&
               has(request.principal.attr.eventCreateGroups) &&
               request.resource.attr.organizerGroupId in request.principal.attr.eventCreateGroups))

    - actions: ["manage-tickets"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_ticket_manager
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            (!has(request.principal.attr.is_machine) || request.principal.attr.is_machine != true)

    - actions: ["manage-tickets"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            (!has(request.principal.attr.is_machine) || request.principal.attr.is_machine != true) &&
            ((has(request.resource.attr.organizerUserId) &&
              has(request.principal.attr.userId) &&
              request.resource.attr.organizerUserId == request.principal.attr.userId) ||
             (has(request.resource.attr.organizerOrganizationId) &&
              has(request.principal.attr.eventCreateOrganizations) &&
              request.resource.attr.organizerOrganizationId in request.principal.attr.eventCreateOrganizations) ||
             (has(request.resource.attr.organizerGroupId) &&
              has(request.principal.attr.eventCreateGroups) &&
              request.resource.attr.organizerGroupId in request.principal.attr.eventCreateGroups))

    - actions: ["event_check_in:view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_check_in_staff
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            request.resource.attr.eventId in request.principal.attr.eventAssignments &&
            ("event_check_in:view" in request.principal.attr.eventAssignments[request.resource.attr.eventId].permissions ||
             "event_check_in:manage" in request.principal.attr.eventAssignments[request.resource.attr.eventId].permissions)

    - actions: ["event_check_in:manage"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_check_in_staff
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            request.resource.attr.eventId in request.principal.attr.eventAssignments &&
            "event_check_in:manage" in request.principal.attr.eventAssignments[request.resource.attr.eventId].permissions

    - actions: ["manage-paid-event-commerce"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            has(request.resource.attr.organizerActorId) &&
            (!has(request.principal.attr.is_machine) || request.principal.attr.is_machine != true) &&
            ((has(request.resource.attr.organizerUserId) &&
              !has(request.resource.attr.organizerOrganizationId) &&
              !has(request.resource.attr.organizerGroupId) &&
              has(request.principal.attr.userId) &&
              request.resource.attr.organizerUserId == request.principal.attr.userId) ||
             (has(request.resource.attr.organizerOrganizationId) &&
              !has(request.resource.attr.organizerUserId) &&
              !has(request.resource.attr.organizerGroupId) &&
              has(request.principal.attr.eventFinanceOrganizations) &&
              request.resource.attr.organizerOrganizationId in request.principal.attr.eventFinanceOrganizations) ||
             (has(request.resource.attr.organizerGroupId) &&
              !has(request.resource.attr.organizerUserId) &&
              !has(request.resource.attr.organizerOrganizationId) &&
              has(request.principal.attr.eventFinanceGroups) &&
              request.resource.attr.organizerGroupId in request.principal.attr.eventFinanceGroups))

    # All authenticated users can view public events
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
