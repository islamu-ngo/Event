# Group members are org-scoped: org admins manage membership, all authenticated can view and join.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_group_member"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_group_member.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all group members within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Org admins can manage group members for their organization
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin

    # All authenticated users can view and create (join) group memberships
    - actions: ["view", "create"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
