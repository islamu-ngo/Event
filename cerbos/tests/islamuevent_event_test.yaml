# Tests the 3-level admin hierarchy: islamuevent_instance_admin > islamuevent_tenant_admin > islamuevent_org_admin > islamuevent_authenticated_user.

name: EventPolicyTests
description: "Validates event resource policies across all admin hierarchy levels"

principals:
  islamuevent_instance_admin:
    id: "user-instance-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: true
      tenantMemberships: {}
      orgMemberships: {}

  islamuevent_tenant_admin:
    id: "user-tenant-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-1": "admin"
      orgMemberships: {}

  islamuevent_org_admin:
    id: "user-org-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships:
        "org-1": "admin"
      eventCreateOrganizations: ["org-1"]

  regular_user:
    id: "user-regular"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-regular"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

  owning_user:
    id: "user-owner"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-owner"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

  verified_organizer_user:
    id: "user-other-organizer"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-other-organizer"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

  finance_organizer_org_controller:
    id: "user-finance-org"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-finance-org"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}
      eventFinanceOrganizations: ["org-1"]

  finance_organizer_group_controller:
    id: "user-finance-group"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-finance-group"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}
      groupMemberships: {}
      eventFinanceGroups: ["group-1"]

  machine_user:
    id: "api-key-machine"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}
      is_machine: true

  unrelated_islamuevent_tenant_admin:
    id: "user-unrelated-tenant"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-other": "admin"
      orgMemberships: {}

  unrelated_islamuevent_org_admin:
    id: "user-unrelated-org"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships:
        "org-other": "admin"

resources:
  event_in_tenant1_org1:
    kind: "islamuevent_event"
    id: "event-1"
    attr:
      tenantId: "tenant-1"
      actorId: "actor-1"
      organizerActorId: "actor-1"
      organizationId: "org-1"

  event_user_owned:
    kind: "islamuevent_event"
    id: "event-user-owned"
    attr:
      tenantId: "tenant-1"
      eventId: "event-user-owned"
      actorId: "actor-user-owned"
      userId: "user-owner"

  event_user_owned_with_verified_organizer:
    kind: "islamuevent_event"
    id: "event-user-owned-verified"
    attr:
      tenantId: "tenant-1"
      eventId: "event-user-owned-verified"
      actorId: "actor-user-owned"
      organizerActorId: "actor-verified-organizer"
      userId: "user-owner"
      organizerUserId: "user-owner"

  event_user_owned_by_different_organizer:
    kind: "islamuevent_event"
    id: "event-user-owned-different-organizer"
    attr:
      tenantId: "tenant-1"
      eventId: "event-user-owned-different-organizer"
      actorId: "actor-user-owned"
      organizerActorId: "actor-other-organizer"
      userId: "user-owner"
      organizerUserId: "user-other-organizer"

  event_publisher_org1_verified_organizer_org1:
    kind: "islamuevent_event"
    id: "event-publisher-org1-verified-organizer-org1"
    attr:
      tenantId: "tenant-1"
      eventId: "event-publisher-org1-verified-organizer-org1"
      actorId: "actor-publisher-org-1"
      organizationId: "org-1"
      organizerActorId: "actor-verified-organizer-org-1"
      organizerOrganizationId: "org-1"

  event_verified_organizer_group1:
    kind: "islamuevent_event"
    id: "event-verified-organizer-group1"
    attr:
      tenantId: "tenant-1"
      eventId: "event-verified-organizer-group1"
      actorId: "actor-publisher-group-1"
      groupId: "group-1"
      organizerActorId: "actor-verified-organizer-group-1"
      organizerGroupId: "group-1"

  event_ambiguous_verified_organizer:
    kind: "islamuevent_event"
    id: "event-ambiguous-verified-organizer"
    attr:
      tenantId: "tenant-1"
      eventId: "event-ambiguous-verified-organizer"
      actorId: "actor-ambiguous"
      organizerActorId: "actor-ambiguous-organizer"
      organizerUserId: "user-owner"
      organizerOrganizationId: "org-1"

  event_pre_create:
    kind: "islamuevent_event"
    id: "create"
    attr:
      tenantId: "tenant-1"
      authorizationPhase: "pre_create"

tests:
  - name: "Instance admin can view and moderate events without edit authority"
    input:
      principals: ["islamuevent_instance_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "view-management", "update", "delete", "moderate-light", "moderate-heavy", "unmoderate", "manage-registrations", "manage-tickets"]
    expected:
      - principal: "islamuevent_instance_admin"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          view-management: EFFECT_ALLOW
          update: EFFECT_DENY
          delete: EFFECT_DENY
          moderate-light: EFFECT_ALLOW
          moderate-heavy: EFFECT_ALLOW
          unmoderate: EFFECT_ALLOW
          manage-registrations: EFFECT_DENY
          manage-tickets: EFFECT_DENY

  - name: "Tenant admin can view and moderate events in their tenant without edit authority"
    input:
      principals: ["islamuevent_tenant_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "view-management", "update", "delete", "moderate-light", "moderate-heavy", "unmoderate", "manage-registrations", "manage-tickets"]
    expected:
      - principal: "islamuevent_tenant_admin"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          view-management: EFFECT_ALLOW
          update: EFFECT_DENY
          delete: EFFECT_DENY
          moderate-light: EFFECT_ALLOW
          moderate-heavy: EFFECT_ALLOW
          unmoderate: EFFECT_ALLOW
          manage-registrations: EFFECT_DENY
          manage-tickets: EFFECT_DENY

  - name: "Org admin can manage events for their organization"
    input:
      principals: ["islamuevent_org_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "view-management", "create", "update", "delete", "moderate-light", "moderate-heavy", "unmoderate", "manage-registrations", "manage-tickets"]
    expected:
      - principal: "islamuevent_org_admin"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          view-management: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          moderate-light: EFFECT_DENY
          moderate-heavy: EFFECT_DENY
          unmoderate: EFFECT_DENY
          manage-registrations: EFFECT_DENY
          manage-tickets: EFFECT_DENY

  - name: "Organization controller of verified organizer can manage registrations"
    input:
      principals: ["islamuevent_org_admin"]
      resources: ["event_publisher_org1_verified_organizer_org1"]
      actions: ["manage-registrations", "manage-tickets"]
    expected:
      - principal: "islamuevent_org_admin"
        resource: "event_publisher_org1_verified_organizer_org1"
        actions:
          manage-registrations: EFFECT_ALLOW
          manage-tickets: EFFECT_ALLOW

  - name: "Regular user can only view events"
    input:
      principals: ["regular_user"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "view-management", "create", "update", "delete", "claim-organizer", "manage-public-actions", "view-organizer-claims", "review-organizer-claim"]
    expected:
      - principal: "regular_user"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          view-management: EFFECT_DENY
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          claim-organizer: EFFECT_DENY
          manage-public-actions: EFFECT_DENY
          view-organizer-claims: EFFECT_DENY
          review-organizer-claim: EFFECT_DENY

  - name: "Tenant curator can review claims while instance admin cannot access tenant claim evidence"
    input:
      principals: ["islamuevent_tenant_admin", "islamuevent_instance_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["manage-public-actions", "view-organizer-claims", "review-organizer-claim", "claim-organizer"]
    expected:
      - principal: "islamuevent_tenant_admin"
        resource: "event_in_tenant1_org1"
        actions:
          manage-public-actions: EFFECT_ALLOW
          view-organizer-claims: EFFECT_DENY
          review-organizer-claim: EFFECT_DENY
          claim-organizer: EFFECT_DENY
      - principal: "islamuevent_instance_admin"
        resource: "event_in_tenant1_org1"
        actions:
          manage-public-actions: EFFECT_DENY
          view-organizer-claims: EFFECT_DENY
          review-organizer-claim: EFFECT_DENY
          claim-organizer: EFFECT_DENY

  - name: "Machine caller cannot submit organizer claims"
    input:
      principals: ["machine_user"]
      resources: ["event_in_tenant1_org1"]
      actions: ["claim-organizer", "manage-registrations", "manage-tickets"]
    expected:
      - principal: "machine_user"
        resource: "event_in_tenant1_org1"
        actions:
          claim-organizer: EFFECT_DENY
          manage-registrations: EFFECT_DENY
          manage-tickets: EFFECT_DENY

  - name: "Paid event commerce requires exact human organizer finance authority"
    input:
      principals: ["owning_user", "finance_organizer_org_controller", "finance_organizer_group_controller", "islamuevent_instance_admin", "islamuevent_tenant_admin", "machine_user"]
      resources: ["event_user_owned_with_verified_organizer", "event_publisher_org1_verified_organizer_org1", "event_verified_organizer_group1", "event_user_owned", "event_ambiguous_verified_organizer"]
      actions: ["manage-paid-event-commerce"]
    expected:
      - principal: "owning_user"
        resource: "event_user_owned_with_verified_organizer"
        actions:
          manage-paid-event-commerce: EFFECT_ALLOW
      - principal: "finance_organizer_org_controller"
        resource: "event_publisher_org1_verified_organizer_org1"
        actions:
          manage-paid-event-commerce: EFFECT_ALLOW
      - principal: "finance_organizer_group_controller"
        resource: "event_verified_organizer_group1"
        actions:
          manage-paid-event-commerce: EFFECT_ALLOW
      - principal: "owning_user"
        resource: "event_user_owned"
        actions:
          manage-paid-event-commerce: EFFECT_DENY
      - principal: "owning_user"
        resource: "event_ambiguous_verified_organizer"
        actions:
          manage-paid-event-commerce: EFFECT_DENY
      - principal: "islamuevent_instance_admin"
        resource: "event_user_owned_with_verified_organizer"
        actions:
          manage-paid-event-commerce: EFFECT_DENY
      - principal: "islamuevent_tenant_admin"
        resource: "event_publisher_org1_verified_organizer_org1"
        actions:
          manage-paid-event-commerce: EFFECT_DENY
      - principal: "machine_user"
        resource: "event_user_owned_with_verified_organizer"
        actions:
          manage-paid-event-commerce: EFFECT_DENY

  - name: "Only the verified organizer actor controller receives participation management"
    input:
      principals: ["owning_user", "verified_organizer_user"]
      resources: ["event_user_owned", "event_user_owned_with_verified_organizer", "event_user_owned_by_different_organizer"]
      actions: ["manage-registrations"]
    expected:
      - principal: "owning_user"
        resource: "event_user_owned"
        actions:
          manage-registrations: EFFECT_DENY
      - principal: "owning_user"
        resource: "event_user_owned_with_verified_organizer"
        actions:
          manage-registrations: EFFECT_ALLOW
      - principal: "owning_user"
        resource: "event_user_owned_by_different_organizer"
        actions:
          manage-registrations: EFFECT_DENY
      - principal: "verified_organizer_user"
        resource: "event_user_owned_by_different_organizer"
        actions:
          manage-registrations: EFFECT_ALLOW

  - name: "Owning user can manage user-owned events"
    input:
      principals: ["owning_user", "regular_user"]
      resources: ["event_user_owned"]
      actions: ["view", "view-management", "update", "delete", "publish", "moderate-light", "moderate-heavy", "unmoderate"]
    expected:
      - principal: "owning_user"
        resource: "event_user_owned"
        actions:
          view: EFFECT_ALLOW
          view-management: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          publish: EFFECT_ALLOW
          moderate-light: EFFECT_DENY
          moderate-heavy: EFFECT_DENY
          unmoderate: EFFECT_DENY
      - principal: "regular_user"
        resource: "event_user_owned"
        actions:
          view: EFFECT_ALLOW
          view-management: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          publish: EFFECT_DENY
          moderate-light: EFFECT_DENY
          moderate-heavy: EFFECT_DENY
          unmoderate: EFFECT_DENY

  - name: "Regular user can pass event pre-create gate but machine caller cannot"
    input:
      principals: ["regular_user", "machine_user"]
      resources: ["event_pre_create"]
      actions: ["create"]
    expected:
      - principal: "regular_user"
        resource: "event_pre_create"
        actions:
          create: EFFECT_ALLOW
      - principal: "machine_user"
        resource: "event_pre_create"
        actions:
          create: EFFECT_DENY

  - name: "Unrelated tenant admin cannot manage events in different tenant"
    input:
      principals: ["unrelated_islamuevent_tenant_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view-management", "create", "update", "delete", "moderate-light", "moderate-heavy", "unmoderate"]
    expected:
      - principal: "unrelated_islamuevent_tenant_admin"
        resource: "event_in_tenant1_org1"
        actions:
          view-management: EFFECT_DENY
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          moderate-light: EFFECT_DENY
          moderate-heavy: EFFECT_DENY
          unmoderate: EFFECT_DENY

  - name: "Unrelated org admin cannot manage events in different org"
    input:
      principals: ["unrelated_islamuevent_org_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["create", "update", "delete"]
    expected:
      - principal: "unrelated_islamuevent_org_admin"
        resource: "event_in_tenant1_org1"
        actions:
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: "Approval publish is reserved to matching tenant or instance moderation authority"
    input:
      principals: ["islamuevent_instance_admin", "islamuevent_tenant_admin", "islamuevent_org_admin", "owning_user", "machine_user", "unrelated_islamuevent_tenant_admin"]
      resources: ["event_in_tenant1_org1", "event_user_owned"]
      actions: ["approve-publish"]
    expected:
      - principal: "islamuevent_instance_admin"
        resource: "event_in_tenant1_org1"
        actions:
          approve-publish: EFFECT_ALLOW
      - principal: "islamuevent_instance_admin"
        resource: "event_user_owned"
        actions:
          approve-publish: EFFECT_ALLOW
      - principal: "islamuevent_tenant_admin"
        resource: "event_in_tenant1_org1"
        actions:
          approve-publish: EFFECT_ALLOW
      - principal: "islamuevent_tenant_admin"
        resource: "event_user_owned"
        actions:
          approve-publish: EFFECT_ALLOW
      - principal: "islamuevent_org_admin"
        resource: "event_in_tenant1_org1"
        actions:
          approve-publish: EFFECT_DENY
      - principal: "owning_user"
        resource: "event_user_owned"
        actions:
          approve-publish: EFFECT_DENY
      - principal: "machine_user"
        resource: "event_in_tenant1_org1"
        actions:
          approve-publish: EFFECT_DENY
      - principal: "unrelated_islamuevent_tenant_admin"
        resource: "event_in_tenant1_org1"
        actions:
          approve-publish: EFFECT_DENY
