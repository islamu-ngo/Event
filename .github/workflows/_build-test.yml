name: "Build & Test (Reusable)"

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
    inputs:
      collect-coverage:
        required: false
        type: boolean
        default: false
      run-integration-tests:
        required: false
        type: boolean
        default: false
      run-fast-tests:
        required: false
        type: boolean
        default: true
      run-app-tests:
        required: false
        type: boolean
        default: true
      run-domain-tests:
        required: false
        type: boolean
        default: true
      run-architecture-tests:
        required: false
        type: boolean
        default: true
      run-setup-tests:
        required: false
        type: boolean
        default: true
      run-infrastructure-tests:
        required: false
        type: boolean
        default: true
      run-blazor-tests:
        required: false
        type: boolean
        default: true
      run-secrets-tests:
        required: false
        type: boolean
        default: true
      configuration:
        required: false
        type: string
        default: "Release"

jobs:
  setup-unproved-hosts:
    name: Setup restricted-save refusal (${{ matrix.os }})
    if: ${{ inputs.run-fast-tests && inputs.run-setup-tests }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify refusal without claiming native protection
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Event.Setup.Artifacts.Tests/Event.Setup.Artifacts.Tests.csproj --locked-mode
          dotnet restore tests/Event.SetupAssistant.Cli.Tests/Event.SetupAssistant.Cli.Tests.csproj --locked-mode
          dotnet test --project tests/Event.Setup.Artifacts.Tests/Event.Setup.Artifacts.Tests.csproj \
            --configuration Release --no-restore --verbosity quiet -- \
            --treenode-filter "/*/*/*ProtectedArtifactWriterTests/(HostAvailabilityDoesNotInferWindowsOrMacProtection|RestrictedAndUnknownBytesNeverReachPublicStreams)" \
            --minimum-expected-tests 2
          dotnet test --project tests/Event.SetupAssistant.Cli.Tests/Event.SetupAssistant.Cli.Tests.csproj \
            --configuration Release --no-restore --verbosity quiet -- \
            --treenode-filter "/*/*/*SetupCliProgramTests/*" --minimum-expected-tests 8
          {
            echo "## Setup protected output remains disabled on this host"
            echo "These checks prove refusal, not Windows DACL or macOS protected-write support."
            echo "Do not advertise restricted Save until native permission, race and cleanup proofs replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      coverage-ready: ${{ steps.coverage_reports.outputs.ready }}
    env:
      DOTNET_CONFIGURATION: ${{ inputs.configuration }}
      COLLECT_COVERAGE: ${{ inputs.collect-coverage }}

    steps:
      - name: No-Op for Non-Code Changes
        if: ${{ ! inputs.run-fast-tests }}
        run: |
          {
            echo "## Fast Build/Test"
            echo
            echo "No build/test-relevant changes were detected by the caller workflow."
            echo "This required check is intentionally passing without restore, build, or test execution."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ inputs.run-fast-tests }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Isolated .NET Installation
        if: ${{ inputs.run-fast-tests }}
        shell: bash
        run: |
          {
            echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/audited-dotnet"
            echo "DOTNET_ROOT=$RUNNER_TEMP/audited-dotnet"
          } >> "$GITHUB_ENV"

      - name: Setup .NET
        if: ${{ inputs.run-fast-tests }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Keep the SDK-Bundled Compiler Runtime
        if: ${{ inputs.run-fast-tests }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(realpath "$DOTNET_ROOT")" = "$(realpath "$RUNNER_TEMP")/audited-dotnet"
          sdk_version="$(jq -er '.sdk.version' global.json)"
          runtime_version="$(jq -er '.runtimeOptions.framework.version' "$DOTNET_ROOT/sdk/$sdk_version/dotnet.runtimeconfig.json")"
          runtime_root="$DOTNET_ROOT/shared/Microsoft.NETCore.App"
          test -d "$runtime_root/$runtime_version"
          holding="$(mktemp -d "$RUNNER_TEMP/audited-extra-runtimes.XXXXXX")"
          for runtime_path in "$runtime_root"/*; do
            if [ "$runtime_path" != "$runtime_root/$runtime_version" ]; then
              mv -- "$runtime_path" "$holding/"
            fi
          done
          dotnet --list-runtimes

      - name: Restore
        if: ${{ inputs.run-fast-tests }}
        run: dotnet restore --locked-mode

      - name: Restore Dependency Audit Probes
        if: ${{ inputs.run-fast-tests }}
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            eng/setup-assistant/probes/*/*.csproj \
            eng/release/dependencies/terminal-gui/probe/TerminalGuiClosure.csproj
          do
            dotnet restore "$project" --locked-mode
          done

      - name: Check Setup Assistant Ratchets
        if: ${{ inputs.run-fast-tests }}
        run: |
          dotnet run eng/setup-assistant/GenerateSetupAssistantRatchets.cs -- --check
          dotnet run --project eng/setup-assistant/EnvironmentCatalogueGenerator/EnvironmentCatalogueGenerator.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore -- --check
          dotnet run --project eng/setup-assistant/SetupCliCommandSchemaGenerator/SetupCliCommandSchemaGenerator.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore -- --check

      - name: Restore .NET Tools
        if: ${{ inputs.run-fast-tests }}
        run: dotnet tool restore

      - name: NuGet Security Audit
        if: ${{ inputs.run-fast-tests }}
        env:
          RestorePackagesWithLockFile: "false"
        run: |
          mkdir -p artifacts/dependencies
          dotnet list Explore.slnx package --vulnerable --include-transitive --format json --output-version 1 --no-restore > artifacts/dependencies/nuget-vulnerabilities.json
          rm -f .ci/scripts/packages.lock.json
          NUGET_VULNERABILITY_SUMMARY_PATH="artifacts/dependencies/nuget-vulnerability-summary.md" dotnet run .ci/scripts/validate-nuget-vulnerabilities.cs -- artifacts/dependencies/nuget-vulnerabilities.json

      - name: Dependency License Policy Audit
        if: ${{ inputs.run-fast-tests }}
        env:
          RestorePackagesWithLockFile: "false"
        run: |
          rm -f .ci/scripts/packages.lock.json
          dotnet run .ci/scripts/validate-dependency-license-policy.cs -- .

      - name: Audited Terminal.Gui Package Gate
        if: ${{ inputs.run-fast-tests && inputs.run-setup-tests }}
        env:
          RestorePackagesWithLockFile: "false"
        run: |
          dotnet --info
          bash eng/release/dependencies/terminal-gui/BuildTerminalGuiPackage.sh --check

      - name: Linting Check
        if: ${{ inputs.run-fast-tests }}
        run: dotnet format whitespace --verify-no-changes --verbosity minimal

      - name: Build
        if: ${{ inputs.run-fast-tests }}
        run: |
          set -o pipefail
          mkdir -p artifacts/build
          dotnet build --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false 2>&1 | tee artifacts/build/fast-build.log

      - name: Prepare coverage output
        if: ${{ inputs.run-fast-tests && inputs.collect-coverage }}
        run: mkdir -p artifacts/coverage

      - name: Setup Project Gates
        if: ${{ inputs.run-fast-tests && inputs.run-setup-tests }}
        id: test_setup
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/Event.Setup.Core.Tests/Event.Setup.Core.Tests.csproj \
            tests/Event.Setup.Artifacts.Tests/Event.Setup.Artifacts.Tests.csproj \
            tests/Event.SetupAssistant.Tests/Event.SetupAssistant.Tests.csproj \
            tests/Event.SetupAssistant.Browser.Tests/Event.SetupAssistant.Browser.Tests.csproj \
            tests/Event.SetupAssistant.Desktop.Tests/Event.SetupAssistant.Desktop.Tests.csproj \
            tests/Event.SetupAssistant.Cli.Tests/Event.SetupAssistant.Cli.Tests.csproj \
            tests/Event.SetupAssistant.Terminal.Tests/Event.SetupAssistant.Terminal.Tests.csproj
          do
            dotnet build "$project" --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal
            coverage_args=()
            test_filters=()
            if [[ "$COLLECT_COVERAGE" == true ]]; then
              coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-$(basename "$project" .csproj).cobertura.xml" --coverage-output-format cobertura)
              if [[ "$project" == tests/Event.Setup.Core.Tests/Event.Setup.Core.Tests.csproj ]]; then
                dotnet test --project "$project" --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
                  --treenode-filter "/*/*/*/*[Category=Architecture]" --minimum-expected-tests 1 --no-progress
                test_filters=(--treenode-filter "/*/*/*/*[Category!=Architecture]")
              fi
            fi
            echo "started=true" >> "$GITHUB_OUTPUT"
            dotnet test --project "$project" --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --minimum-expected-tests 1 --no-progress "${coverage_args[@]}" "${test_filters[@]}"
          done
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-SetupLiveAuthoritySecurityTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
            --treenode-filter "/*/*/*SetupLiveAuthoritySecurityTests/*" \
            --minimum-expected-tests 35 --maximum-parallel-tests 1 --no-progress \
            --report-trx --report-trx-filename SetupLiveAuthoritySecurityTests.trx "${coverage_args[@]}"

      - name: Publish public Setup Assistant browser
        if: ${{ inputs.run-fast-tests && inputs.run-setup-tests }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet msbuild eng/setup-assistant/SetupAssistant.Release.proj \
            -target:PublishSetupAssistantBrowser \
            -property:SetupAssistantOutputRoot="$RUNNER_TEMP/setup-assistant"
          test -f "$RUNNER_TEMP/setup-assistant/browser/wwwroot/index.html"
          test -d "$RUNNER_TEMP/setup-assistant/browser/wwwroot/_framework"
          dotnet run eng/setup-assistant/GenerateSetupAssistantRatchets.cs -- --check

      - name: Unit Tests — Application
        if: ${{ inputs.run-fast-tests && inputs.run-app-tests }}
        id: test_application
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Event.Application.UnitTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Application.UnitTests/Event.Application.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Application.UnitTests.trx "${coverage_args[@]}"

      - name: Unit Tests — Domain
        if: ${{ inputs.run-fast-tests && inputs.run-domain-tests }}
        id: test_domain
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Event.Domain.UnitTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Domain.UnitTests/Event.Domain.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Domain.UnitTests.trx "${coverage_args[@]}"

      - name: Architecture Tests
        if: ${{ inputs.run-fast-tests && inputs.run-architecture-tests }}
        id: test_architecture
        run: dotnet test --project tests/Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Architecture.Tests.trx

      - name: Unit Tests — Secrets
        if: ${{ inputs.run-fast-tests && inputs.run-secrets-tests }}
        id: test_secrets
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Explore.Secrets.UnitTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Explore.Secrets.UnitTests/Explore.Secrets.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Secrets.UnitTests.trx "${coverage_args[@]}"

      - name: Unit Tests — Infrastructure
        if: ${{ inputs.run-fast-tests && inputs.run-infrastructure-tests }}
        id: test_infrastructure
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Explore.Infrastructure.Tests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Infrastructure.Tests.trx --treenode-filter "/*/*/*/*[Category!=Runtime]" --minimum-expected-tests 1 "${coverage_args[@]}"

      - name: Blazor Client Tests
        if: ${{ inputs.run-fast-tests && inputs.run-blazor-tests }}
        id: test_blazor_client
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Explore.Blazor.Client.Tests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Explore.Blazor.Client.Tests/Explore.Blazor.Client.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Blazor.Client.Tests.trx "${coverage_args[@]}"

      - name: Blazor Integration Tests
        if: ${{ inputs.run-fast-tests && inputs.run-blazor-tests }}
        id: test_blazor_integration
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Explore.Blazor.IntegrationTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Explore.Blazor.IntegrationTests/Explore.Blazor.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --maximum-parallel-tests 8 --report-trx --report-trx-filename Explore.Blazor.IntegrationTests.trx "${coverage_args[@]}"

      - name: Wire Contract Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_wire_contracts
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Event.Wire.Contracts.UnitTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Wire.Contracts.UnitTests/Event.Wire.Contracts.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Wire.Contracts.UnitTests.trx "${coverage_args[@]}"

      - name: Generated Contract Tooling Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_generated_contracts
        run: dotnet test --project tests/Explore.GeneratedContracts.Tests/Explore.GeneratedContracts.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.GeneratedContracts.Tests.trx

      - name: Diagnostic Command Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_diagnostic
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Explore.Diagnostic.UnitTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Explore.Diagnostic.UnitTests/Explore.Diagnostic.UnitTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Diagnostic.UnitTests.trx "${coverage_args[@]}"

      - name: Standalone Host Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_standalone
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/fast-Event.Standalone.IntegrationTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Standalone.IntegrationTests/Event.Standalone.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Standalone.IntegrationTests.trx "${coverage_args[@]}"

      - name: Validate coverage reports
        id: coverage_reports
        if: >-
          ${{ always() && !cancelled() && inputs.run-fast-tests && inputs.collect-coverage &&
            (steps.test_setup.outputs.started == 'true' ||
             contains(fromJSON('["success","failure"]'), steps.test_application.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_domain.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_secrets.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_infrastructure.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_blazor_client.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_blazor_integration.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_wire_contracts.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_diagnostic.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_standalone.outcome)) }}
        shell: bash
        run: |
          mkdir -p artifacts/coverage
          dotnet run eng/coverage/validate-reports.cs -- artifacts/coverage
          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage: selected fast suites only"
            echo "Commit: $GITHUB_SHA"
            echo "Artifact: coverage-fast; Codecov flag: fast"
            echo "Skipped suites and runtime-only paths are not complete platform coverage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain fast coverage
        if: ${{ always() && inputs.run-fast-tests && inputs.collect-coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fast
          path: artifacts/coverage/*.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Test Results
        if: ${{ always() && inputs.run-fast-tests }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-fast
          path: |
            '**/TestResults/**/*.trx'
            artifacts/build/fast-build.log
            artifacts/dependencies/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write Test Evidence Summary
        if: ${{ always() && inputs.run-fast-tests }}
        env:
          APPLICATION_OUTCOME: ${{ steps.test_application.outcome }}
          DOMAIN_OUTCOME: ${{ steps.test_domain.outcome }}
          ARCHITECTURE_OUTCOME: ${{ steps.test_architecture.outcome }}
          SECRETS_OUTCOME: ${{ steps.test_secrets.outcome }}
          INFRASTRUCTURE_OUTCOME: ${{ steps.test_infrastructure.outcome }}
          BLAZOR_CLIENT_OUTCOME: ${{ steps.test_blazor_client.outcome }}
          BLAZOR_INTEGRATION_OUTCOME: ${{ steps.test_blazor_integration.outcome }}
          WIRE_OUTCOME: ${{ steps.test_wire_contracts.outcome }}
          GENERATED_OUTCOME: ${{ steps.test_generated_contracts.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.test_diagnostic.outcome }}
          STANDALONE_OUTCOME: ${{ steps.test_standalone.outcome }}
        run: |
          {
            echo "## Fast Test Evidence"
            echo
            echo "TRX/build artifact: \`test-results-fast\`"
            echo "Build log: \`artifacts/build/fast-build.log\`"
            echo
            echo "| Project | Step outcome |"
            echo "|---|---|"
            echo "| Event.Application.UnitTests | ${APPLICATION_OUTCOME:-not-run} |"
            echo "| Event.Domain.UnitTests | ${DOMAIN_OUTCOME:-not-run} |"
            echo "| Event.Architecture.Tests | ${ARCHITECTURE_OUTCOME:-not-run} |"
            echo "| Explore.Secrets.UnitTests | ${SECRETS_OUTCOME:-not-run} |"
            echo "| Explore.Infrastructure.Tests | ${INFRASTRUCTURE_OUTCOME:-not-run} |"
            echo "| Explore.Blazor.Client.Tests | ${BLAZOR_CLIENT_OUTCOME:-not-run} |"
            echo "| Explore.Blazor.IntegrationTests | ${BLAZOR_INTEGRATION_OUTCOME:-not-run} |"
            echo "| Event.Wire.Contracts.UnitTests | ${WIRE_OUTCOME:-not-run} |"
            echo "| Explore.GeneratedContracts.Tests | ${GENERATED_OUTCOME:-not-run} |"
            echo "| Explore.Diagnostic.UnitTests | ${DIAGNOSTIC_OUTCOME:-not-run} |"
            echo "| Event.Standalone.IntegrationTests | ${STANDALONE_OUTCOME:-not-run} |"
            echo
            echo "Inspect the uploaded \`test-results-fast\` artifact for project-specific TRX files and build/analyzer warning output."
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Integration Tests
    if: ${{ inputs.run-fast-tests && inputs.run-integration-tests }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      coverage-ready: ${{ steps.coverage_reports.outputs.ready }}
    env:
      DOTNET_CONFIGURATION: ${{ inputs.configuration }}
      COLLECT_COVERAGE: ${{ inputs.collect-coverage }}
      PrivacyErasure__Authority__Topology: EmbeddedSqlite
      PrivacyErasureAuthorityEmbedded__WriterReplicaCount: "1"
      PrivacyErasureAuthorityEmbedded__BusyTimeoutSeconds: "30"

    services:
      postgres:
        image: postgres:16.14@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: event_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Configure Embedded Authority File
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/database/integration
          echo "PrivacyErasureAuthorityEmbedded__Path=${RUNNER_TEMP}/privacy-erasure-authority-integration.db" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Build
        run: |
          set -o pipefail
          mkdir -p artifacts/build
          dotnet build --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false 2>&1 | tee artifacts/build/integration-build.log

      - name: Prepare runtime coverage output
        if: ${{ inputs.collect-coverage }}
        run: mkdir -p artifacts/coverage

      - name: Run bounded issuance HTTP and signed ingress contracts
        id: issuance_http
        shell: bash
        run: |
          set -euo pipefail
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-IssuanceHttp.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
            --treenode-filter "/*/*/ExternalApiKeyIssuance*Tests/*" \
            --minimum-expected-tests 33 --no-progress --maximum-parallel-tests 1 \
            --report-trx --report-trx-filename Event.API.IntegrationTests.Issuance.trx "${coverage_args[@]}"

      - name: Validate bounded HTTP coverage
        id: issuance_http_coverage
        if: ${{ always() && inputs.collect-coverage && contains(fromJSON('["success","failure"]'), steps.issuance_http.outcome) }}
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/coverage/runtime-IssuanceHttp.cobertura.xml
          dotnet run eng/coverage/validate-reports.cs -- artifacts/coverage

      - name: Retain bounded HTTP coverage before broad integration
        id: retain_issuance_http_coverage
        if: ${{ always() && inputs.collect-coverage && contains(fromJSON('["success","failure"]'), steps.issuance_http.outcome) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-runtime-IssuanceHttp
          path: artifacts/coverage/runtime-IssuanceHttp.cobertura.xml
          if-no-files-found: error
          retention-days: 30

      - name: Publish bounded HTTP coverage before broad integration
        if: ${{ always() && inputs.collect-coverage && steps.issuance_http_coverage.outcome == 'success' && steps.retain_issuance_http_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ github.event_name != 'pull_request' && secrets.CODECOV_TOKEN || github.event.pull_request.head.repo.full_name == github.repository && secrets.CODECOV_TOKEN || '' }}
          files: artifacts/coverage/runtime-IssuanceHttp.cobertura.xml
          disable_search: true
          flags: runtime
          name: runtime-IssuanceHttp
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true

      - name: Persistence Integration Tests
        id: test_persistence_integration
        run: |
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-Event.Persistence.IntegrationTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Persistence.IntegrationTests.trx "${coverage_args[@]}"
        env:
          Database__Provider: PostgreSql
          Database__Host: localhost
          Database__Port: "5432"
          Database__Database: event_test
          Database__TlsMode: Disabled
          Database__TrustServerCertificate: "false"
          Database__Runtime__Username: postgres
          Database__Runtime__Password: password

      - name: API Integration Tests
        id: test_api_integration
        shell: bash
        run: |
          set -euo pipefail
          SETUP_SECRET="$(openssl rand -hex 32)"
          KEYCLOAK_BLAZOR_CLIENT_SECRET="$(openssl rand -hex 32)"
          export SETUP_SECRET KEYCLOAK_BLAZOR_CLIENT_SECRET
          echo "::add-mask::$SETUP_SECRET"
          echo "::add-mask::$KEYCLOAK_BLAZOR_CLIENT_SECRET"
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-Event.API.IntegrationTests.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.API.IntegrationTests.trx "${coverage_args[@]}"
        env:
          Database__Provider: PostgreSql
          Database__Host: localhost
          Database__Port: "5432"
          Database__Database: event_test
          Database__TlsMode: Disabled
          Database__TrustServerCertificate: "false"
          Database__Runtime__Username: postgres
          Database__Runtime__Password: password

      - name: Infrastructure Email Runtime Tests
        id: test_infrastructure_email
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/runtime
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-Explore.Infrastructure.Tests.Email.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Infrastructure.Tests.Email.trx --treenode-filter "/*/*/*/*[Category=Email]" --minimum-expected-tests 1 "${coverage_args[@]}" 2>&1 | tee artifacts/runtime/infrastructure-email.log

      - name: Infrastructure RabbitMQ Runtime Tests
        id: test_infrastructure_rabbitmq
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/runtime
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-Explore.Infrastructure.Tests.RabbitMQ.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Infrastructure.Tests.RabbitMQ.trx --treenode-filter "/*/*/*/*[Category=RabbitMQ]" --minimum-expected-tests 1 "${coverage_args[@]}" 2>&1 | tee artifacts/runtime/infrastructure-rabbitmq.log

      - name: Validate runtime coverage reports
        id: coverage_reports
        if: >-
          ${{ always() && inputs.collect-coverage &&
            (contains(fromJSON('["success","failure"]'), steps.test_persistence_integration.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_api_integration.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_infrastructure_email.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.test_infrastructure_rabbitmq.outcome)) }}
        shell: bash
        run: |
          mkdir -p artifacts/coverage
          dotnet run eng/coverage/validate-reports.cs -- artifacts/coverage
          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage: existing runtime suites"
            echo "Commit: $GITHUB_SHA"
            echo "Artifact: coverage-runtime; Codecov flag: runtime"
            echo "Persistence fixtures can require multiple database providers; matrix migration processes are not instrumented."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain validated runtime coverage
        if: ${{ always() && inputs.collect-coverage && steps.coverage_reports.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-runtime-validated
          path: artifacts/coverage/*.cobertura.xml
          if-no-files-found: error
          retention-days: 30

      - name: Retain runtime coverage
        if: ${{ always() && inputs.collect-coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-runtime
          path: artifacts/coverage/*.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Capture Runtime Container Diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime/docker

          docker ps -a > artifacts/runtime/docker/containers.txt || true
          docker images > artifacts/runtime/docker/images.txt || true

          while read -r container_id container_name; do
            [ -n "$container_id" ] || continue
            safe_name="${container_name//[^A-Za-z0-9_.-]/-}"
            docker logs "$container_id" > "artifacts/runtime/docker/${safe_name}.log" 2>&1 || true
          done < <(docker ps -a --format '{{.ID}} {{.Names}}' || true)

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration
          path: |
            '**/TestResults/**/*.trx'
            artifacts/build/integration-build.log
            artifacts/runtime/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write Integration Test Evidence Summary
        if: always()
        env:
          PERSISTENCE_OUTCOME: ${{ steps.test_persistence_integration.outcome }}
          API_OUTCOME: ${{ steps.test_api_integration.outcome }}
          INFRASTRUCTURE_EMAIL_OUTCOME: ${{ steps.test_infrastructure_email.outcome }}
          INFRASTRUCTURE_RABBITMQ_OUTCOME: ${{ steps.test_infrastructure_rabbitmq.outcome }}
        run: |
          {
            echo "## Integration Test Evidence"
            echo
            echo "TRX/build artifact: \`test-results-integration\`"
            echo "Build log: \`artifacts/build/integration-build.log\`"
            echo
            echo "| Project | Step outcome |"
            echo "|---|---|"
            echo "| Event.Persistence.IntegrationTests | ${PERSISTENCE_OUTCOME:-not-run} |"
            echo "| Event.API.IntegrationTests | ${API_OUTCOME:-not-run} |"
            echo "| Explore.Infrastructure.Tests Email | ${INFRASTRUCTURE_EMAIL_OUTCOME:-not-run} |"
            echo "| Explore.Infrastructure.Tests RabbitMQ | ${INFRASTRUCTURE_RABBITMQ_OUTCOME:-not-run} |"
            echo
            echo "Inspect the uploaded \`test-results-integration\` artifact for project-specific TRX files, runtime command logs, container diagnostics, and build/analyzer warning output."
          } >> "$GITHUB_STEP_SUMMARY"

  upload-fast-coverage:
    if: ${{ always() && inputs.collect-coverage && needs.build-and-test.outputs.coverage-ready == 'true' }}
    needs: build-and-test
    uses: ./.github/workflows/_coverage-upload.yml
    with:
      flag: fast
      artifact: coverage-fast
    secrets:
      CODECOV_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CODECOV_TOKEN || github.event.pull_request.head.repo.full_name == github.repository && secrets.CODECOV_TOKEN || '' }}

  upload-runtime-coverage:
    if: ${{ always() && inputs.collect-coverage && needs.integration-tests.outputs.coverage-ready == 'true' }}
    needs: integration-tests
    uses: ./.github/workflows/_coverage-upload.yml
    with:
      flag: runtime
      artifact: coverage-runtime-validated
    secrets:
      CODECOV_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CODECOV_TOKEN || github.event.pull_request.head.repo.full_name == github.repository && secrets.CODECOV_TOKEN || '' }}

  database-provider-matrix:
    name: Database Provider (${{ matrix.provider }})
    if: ${{ inputs.run-fast-tests && inputs.run-integration-tests }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: PostgreSql
            engine_image: postgres:16.14@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
            database: event_mdb
            port: "5432"
            username: event
            password: EventCi2026_Strong
            tls_mode: Disabled
            trust_server_certificate: "false"
            server_flavor: ""
            server_version: ""
            email_dispatch_mode: Quartz
            health_options: >-
              --health-cmd "pg_isready -U event -d event_mdb"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 20
          - provider: Sqlite
            engine_image: host file-backed SQLite
            database: artifacts/database/Sqlite/event-mdb.sqlite3
            port: ""
            username: ""
            password: ""
            tls_mode: Prefer
            trust_server_certificate: "false"
            server_flavor: ""
            server_version: ""
            email_dispatch_mode: Quartz
            health_options: ""
          - provider: SqlServer
            engine_image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04@sha256:b1395aa51b4ec39981883560f1379ea9eba2a1c0719bf8e6477902769316bb79
            database: event_mdb
            port: "1433"
            username: sa
            password: EventCi2026_Strong
            tls_mode: Required
            trust_server_certificate: "true"
            server_flavor: ""
            server_version: ""
            email_dispatch_mode: HostedService
            health_options: >-
              --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P EventCi2026_Strong -Q 'SELECT 1' -b -o /dev/null"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 30
              --health-start-period 20s
          - provider: MariaDb
            engine_image: mariadb:11.4.12@sha256:a6ee0e234c527de59d6a1924703e5512e7a762c74616a443ec9c729b3a9c5154
            database: event_mdb
            port: "3306"
            username: event
            password: EventCi2026_Strong
            tls_mode: Disabled
            trust_server_certificate: "false"
            server_flavor: MariaDb
            server_version: 11.4.12
            email_dispatch_mode: HostedService
            health_options: >-
              --health-cmd "healthcheck.sh --connect --innodb_initialized"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 20
          - provider: MySql
            engine_image: mysql:8.4.6@sha256:c296d65ee6ab3ce2f608c1d1b2bdd3c08b087a5834101d76a6db2e00875216cc
            database: event_mdb
            port: "3306"
            username: event
            password: EventCi2026_Strong
            tls_mode: Disabled
            trust_server_certificate: "false"
            server_flavor: MySql
            server_version: 8.4.6
            email_dispatch_mode: HostedService
            health_options: >-
              --health-cmd "MYSQL_PWD=\"$MYSQL_PASSWORD\" mysqladmin --protocol=tcp --host=127.0.0.1 --user=\"$MYSQL_USER\" --silent status"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 20

    env:
      DOTNET_CONFIGURATION: ${{ inputs.configuration }}
      DOTNET_ENVIRONMENT: Production
      COLLECT_COVERAGE: ${{ inputs.collect-coverage }}
      SecretProvider__Provider: Environment
      Database__Provider: ${{ matrix.provider }}
      Database__Host: ${{ matrix.provider != 'Sqlite' && 'localhost' || '' }}
      Database__Port: ${{ matrix.port }}
      Database__Database: ${{ matrix.database }}
      Database__TlsMode: ${{ matrix.tls_mode }}
      Database__TrustServerCertificate: ${{ matrix.trust_server_certificate }}
      Database__ServerFlavor: ${{ matrix.server_flavor }}
      Database__ServerVersion: ${{ matrix.server_version }}
      Database__Runtime__Username: ${{ matrix.username }}
      Database__Runtime__Password: ${{ matrix.password }}
      Database__Migrator__Username: ${{ matrix.username }}
      Database__Migrator__Password: ${{ matrix.password }}
      PrivacyErasure__Authority__Topology: EmbeddedSqlite
      PrivacyErasureAuthorityEmbedded__WriterReplicaCount: "1"
      PrivacyErasureAuthorityEmbedded__BusyTimeoutSeconds: "30"
      EmailDispatchProcessor__Mode: ${{ matrix.email_dispatch_mode }}

    services:
      database:
        image: ${{ matrix.provider == 'PostgreSql' && 'postgres:16.14@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4' || matrix.provider == 'SqlServer' && 'mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04@sha256:b1395aa51b4ec39981883560f1379ea9eba2a1c0719bf8e6477902769316bb79' || matrix.provider == 'MariaDb' && 'mariadb:11.4.12@sha256:a6ee0e234c527de59d6a1924703e5512e7a762c74616a443ec9c729b3a9c5154' || matrix.provider == 'MySql' && 'mysql:8.4.6@sha256:c296d65ee6ab3ce2f608c1d1b2bdd3c08b087a5834101d76a6db2e00875216cc' || '' }}
        env:
          POSTGRES_USER: ${{ matrix.username }}
          POSTGRES_PASSWORD: ${{ matrix.password }}
          POSTGRES_DB: ${{ matrix.database }}
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ matrix.password }}
          MARIADB_DATABASE: ${{ matrix.database }}
          MARIADB_USER: ${{ matrix.username }}
          MARIADB_PASSWORD: ${{ matrix.password }}
          MARIADB_ROOT_PASSWORD: ${{ matrix.password }}
          MYSQL_DATABASE: ${{ matrix.database }}
          MYSQL_USER: ${{ matrix.username }}
          MYSQL_PASSWORD: ${{ matrix.password }}
          MYSQL_ROOT_PASSWORD: ${{ matrix.password }}
        ports:
          - 5432:5432
          - 1433:1433
          - 3306:3306
        options: ${{ matrix.health_options }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Configure Isolated SQLite Files
        shell: bash
        run: |
          set -euo pipefail
          echo "PrivacyErasureAuthorityEmbedded__Path=${RUNNER_TEMP}/privacy-erasure-authority.db" >> "$GITHUB_ENV"
          if [ "${{ matrix.provider }}" = "Sqlite" ]; then
            echo "Database__Database=${RUNNER_TEMP}/event-mdb.sqlite3" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build Migration And Behavior Projects
        run: |
          dotnet build src/Event.MigrationService/Event.MigrationService.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false
          dotnet build tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore --verbosity minimal -p:RunAnalyzers=false -p:RunAnalyzersDuringBuild=false

      - name: Create SQL Server Database
        if: ${{ matrix.provider == 'SqlServer' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.database.id }}" /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "$Database__Migrator__Password" \
            -Q "IF DB_ID(N'event_mdb') IS NULL CREATE DATABASE [event_mdb]" -b

      - name: Apply Clean And Idempotent Migrations
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/database/${{ matrix.provider }}"
          dotnet run --project src/Event.MigrationService/Event.MigrationService.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --no-launch-profile \
            2>&1 | tee "artifacts/database/${{ matrix.provider }}/migration-clean.log"
          dotnet run --project src/Event.MigrationService/Event.MigrationService.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --no-launch-profile \
            2>&1 | tee "artifacts/database/${{ matrix.provider }}/migration-idempotent.log"

      - name: Verify Embedded Authority File Isolation
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PrivacyErasureAuthorityEmbedded__Path"
          stat --printf='authority-bytes=%s\n' "$PrivacyErasureAuthorityEmbedded__Path" \
            > "artifacts/database/${{ matrix.provider }}/sqlite-files.txt"
          if [ "${{ matrix.provider }}" = "Sqlite" ]; then
            test -s "$Database__Database"
            test "$Database__Database" != "$PrivacyErasureAuthorityEmbedded__Path"
            stat --printf='primary-bytes=%s\n' "$Database__Database" \
              >> "artifacts/database/${{ matrix.provider }}/sqlite-files.txt"
          fi

      - name: Run Provider Runtime Smoke
        id: runtime_smoke
        shell: bash
        run: |
          set -euo pipefail
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            mkdir -p artifacts/coverage
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-${{ matrix.provider }}-Smoke.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
            --treenode-filter "/*/*/PrimaryDatabaseRuntimeSmokeTests/*" \
            --minimum-expected-tests 1 --no-progress --maximum-parallel-tests 1 \
            --report-trx --report-trx-filename Event.Persistence.IntegrationTests.${{ matrix.provider }}.Smoke.trx "${coverage_args[@]}"

      - name: Run Provider Behavior Contract
        id: behavior_contract
        shell: bash
        run: |
          set -euo pipefail
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            mkdir -p artifacts/coverage
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-${{ matrix.provider }}-Behavior.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
            --treenode-filter "/*/*/PrimaryDatabaseProviderBehaviorContractTests/*" \
            --minimum-expected-tests 2 --no-progress --maximum-parallel-tests 1 \
            --report-trx --report-trx-filename Event.Persistence.IntegrationTests.${{ matrix.provider }}.Behavior.trx "${coverage_args[@]}"

      - name: Run API Key Issuance Provider Contract
        id: api_key_issuance
        shell: bash
        env:
          AUTHENTICATION_PROVIDER: local
          AUTHORIZATION_PROVIDER: local
          PRIVACY_ERASURE_IDENTITY_FENCE_KEY_ID: ci-issuance
        run: |
          set -euo pipefail
          AUTHENTICATION_LOCAL_JWT_KEY="$(openssl rand -hex 32)"
          PRIVACY_ERASURE_IDENTITY_FENCE_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$AUTHENTICATION_LOCAL_JWT_KEY"
          echo "::add-mask::$PRIVACY_ERASURE_IDENTITY_FENCE_KEY"
          export AUTHENTICATION_LOCAL_JWT_KEY PRIVACY_ERASURE_IDENTITY_FENCE_KEY
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            mkdir -p artifacts/coverage
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-${{ matrix.provider }}-Issuance.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
            --treenode-filter "/*/*/ExternalApiKeyIssuanceProviderTests/*" \
            --minimum-expected-tests 16 --no-progress --maximum-parallel-tests 1 \
            --report-trx --report-trx-filename "Event.Persistence.IntegrationTests.${{ matrix.provider }}.Issuance.trx" "${coverage_args[@]}"

      - name: Run Secret Binding Provider Contract
        id: secret_binding_contract
        shell: bash
        run: |
          set -euo pipefail
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            mkdir -p artifacts/coverage
            coverage_args=(--coverage --coverage-settings eng/coverage/product.config --coverage-output "$GITHUB_WORKSPACE/artifacts/coverage/runtime-${{ matrix.provider }}-SecretBinding.cobertura.xml" --coverage-output-format cobertura)
          fi
          dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj \
            --configuration "$DOTNET_CONFIGURATION" --no-build --verbosity minimal -- \
            --treenode-filter "/*/*/SecretBindingProviderContractTests/*" \
            --minimum-expected-tests 1 --no-progress --maximum-parallel-tests 1 \
            --report-trx --report-trx-filename Event.Persistence.IntegrationTests.${{ matrix.provider }}.SecretBinding.trx "${coverage_args[@]}"

      - name: Validate provider coverage reports
        id: provider_coverage
        if: >-
          ${{ always() && inputs.collect-coverage &&
            (contains(fromJSON('["success","failure"]'), steps.runtime_smoke.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.behavior_contract.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.api_key_issuance.outcome) ||
             contains(fromJSON('["success","failure"]'), steps.secret_binding_contract.outcome)) }}
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior_contract.outcome }}
          ISSUANCE_OUTCOME: ${{ steps.api_key_issuance.outcome }}
          SECRET_BINDING_OUTCOME: ${{ steps.secret_binding_contract.outcome }}
        run: |
          set -euo pipefail
          for suite in Smoke Behavior Issuance SecretBinding; do
            case "$suite" in
              Smoke) outcome="$SMOKE_OUTCOME" ;;
              Behavior) outcome="$BEHAVIOR_OUTCOME" ;;
              Issuance) outcome="$ISSUANCE_OUTCOME" ;;
              SecretBinding) outcome="$SECRET_BINDING_OUTCOME" ;;
            esac
            if [[ "$outcome" == success || "$outcome" == failure ]]; then
              test -s "artifacts/coverage/runtime-${{ matrix.provider }}-${suite}.cobertura.xml"
            fi
          done
          dotnet run eng/coverage/validate-reports.cs -- artifacts/coverage
          reports=(artifacts/coverage/*.cobertura.xml)
          printf -v report_list '%s,' "${reports[@]}"
          printf 'files=%s\n' "${report_list%,}" >> "$GITHUB_OUTPUT"

      - name: Retain provider coverage
        id: retain_provider_coverage
        if: ${{ always() && inputs.collect-coverage && steps.runtime_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-runtime-${{ matrix.provider }}
          path: artifacts/coverage/*.cobertura.xml
          if-no-files-found: error
          retention-days: 30

      - name: Publish provider coverage
        if: ${{ always() && inputs.collect-coverage && steps.provider_coverage.outcome == 'success' && steps.retain_provider_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ github.event_name != 'pull_request' && secrets.CODECOV_TOKEN || github.event.pull_request.head.repo.full_name == github.repository && secrets.CODECOV_TOKEN || '' }}
          files: ${{ steps.provider_coverage.outputs.files }}
          disable_search: true
          flags: runtime
          name: runtime-${{ matrix.provider }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true

      - name: Capture Database Service Diagnostics
        if: ${{ always() && matrix.provider != 'Sqlite' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/database/${{ matrix.provider }}"
          docker ps -a > "artifacts/database/${{ matrix.provider }}/containers.txt" || true
          docker logs "${{ job.services.database.id }}" > "artifacts/database/${{ matrix.provider }}/service.log" 2>&1 || true

      - name: Upload Provider Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-provider-${{ matrix.provider }}
          path: |
            **/TestResults/**/*.trx
            artifacts/database/${{ matrix.provider }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Write Provider Evidence Summary
        if: always()
        env:
          MIGRATION_OUTCOME: ${{ steps.migrations.outcome }}
          RUNTIME_SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior_contract.outcome }}
          ISSUANCE_OUTCOME: ${{ steps.api_key_issuance.outcome }}
          COVERAGE_OUTCOME: ${{ steps.provider_coverage.outcome }}
        run: |
          {
            echo "## Database Provider: ${{ matrix.provider }}"
            echo
            echo "- Engine image: \`${{ matrix.engine_image }}\`"
            echo "- TLS mode: \`${{ matrix.tls_mode }}\`; trust server certificate: \`${{ matrix.trust_server_certificate }}\`"
            echo "- Email dispatch mode: \`${{ matrix.email_dispatch_mode }}\`"
            echo "- Clean + idempotent migrations: \`${MIGRATION_OUTCOME:-not-run}\`"
            echo "- Runtime smoke: \`${RUNTIME_SMOKE_OUTCOME:-not-run}\`"
            echo "- Behavior contract: \`${BEHAVIOR_OUTCOME:-not-run}\`"
            echo "- API key issuance contract (at least 14 cases): \`${ISSUANCE_OUTCOME:-not-run}\`"
            echo "- Evidence artifact: \`database-provider-${{ matrix.provider }}\`"
            echo "- Coverage validation: \`${COVERAGE_OUTCOME:-not-run}\`; artifact: \`coverage-runtime-${{ matrix.provider }}\` (30 days)"
            echo "- Coverage reports measure executed product lines; passing TRX alone is not coverage. Migration processes are not instrumented."
          } >> "$GITHUB_STEP_SUMMARY"
