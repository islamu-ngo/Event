# Group membership mutation scopes are projected from current tenant-bound group authority.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_group_member"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_group_member.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all group members within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.principal.attr.groupMemberCreateScopes) &&
            (request.resource.attr.tenantId + "/" + request.resource.attr.groupId) in request.principal.attr.groupMemberCreateScopes

    - actions: ["update"]
      effect: EFFECT_ALLOW
      roles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.principal.attr.groupMemberUpdateScopes) &&
            (request.resource.attr.tenantId + "/" + request.resource.attr.groupId) in request.principal.attr.groupMemberUpdateScopes

    - actions: ["delete"]
      effect: EFFECT_ALLOW
      roles: ["islamuevent_authenticated_user"]
      condition:
        match:
          expr: >
            has(request.principal.attr.groupMemberDeleteScopes) &&
            (request.resource.attr.tenantId + "/" + request.resource.attr.groupId) in request.principal.attr.groupMemberDeleteScopes

    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
